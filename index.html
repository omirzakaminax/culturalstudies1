 {id:"w8t4", title:"Cultural dimensions: Hofstede's 6-D model", src:"L",
  quick:[
   "==Geert Hofstede== studied ==IBM== employees in ==50+ countries== {L}",
   "First ==4 dimensions==; 5th & 6th added with ==Michael H. Bond== and ==Michael Minkov== {L}",
   "1 ==Power Distance (PDI)==; 2 ==Individualism vs Collectivism (IDV)==; 3 ==Masculinity vs Femininity (MAS)== {L}",
   "4 ==Uncertainty Avoidance (UAI)==; 5 ==Long- vs Short-Term Orientation== (originally 'Pragmatic vs Normative'); 6 ==Indulgence vs Restraint (IVR)== {L}",
   "IVR = sixth, with ==Minkov==, relatively new → less data {L}"
  ],
  deep:`<p><b>Geert Hofstede</b> studied people who worked for <b>IBM in more than 50 countries</b>. Initially he found <b>four</b> dimensions; later the <b>fifth and sixth</b> were added in cooperation with Drs. <b>Michael H. Bond</b> and <b>Michael Minkov</b>. {L}</p>
<table class="tbl"><tr><th>#</th><th>Dimension</th><th>High score</th><th>Low score / opposite</th></tr>
<tr><td>1</td><td><b>Power Distance Index (PDI)</b> – degree of inequality that exists and is accepted between people with and without power</td><td>Society accepts an unequal, hierarchical distribution of power; people know "their place"</td><td>Power is shared and dispersed; people reject unequal power; supervisors and employees almost equal</td></tr>
<tr><td>2</td><td><b>Individualism vs Collectivism (IDV)</b> – strength of ties to others in the community</td><td>Individualist: weak ties outside the core family; less responsibility for others; respect for privacy, time, freedom</td><td>Collectivist: loyalty to the group, defending its interests, responsibility for each other; maintaining harmony</td></tr>
<tr><td>3</td><td><b>Masculinity vs Femininity (MAS)</b> – distribution of roles between men and women</td><td>Masculine: roles overlap less; assertiveness, success, strength, money and achievement important</td><td>Feminine: roles overlap; modesty is a virtue; good relationships, cooperation, consensus</td></tr>
<tr><td>4</td><td><b>Uncertainty Avoidance Index (UAI)</b> – how well people cope with anxiety</td><td>Make life predictable and controllable; many conventions; need for structure and stability</td><td>Relaxed, open, inclusive; rapid acceptance of innovations</td></tr>
<tr><td>5</td><td><b>Long- vs Short-Term Orientation</b> (originally "Pragmatic vs Normative", PRA) – time horizon</td><td>Long-term: pragmatic, modest, thrifty</td><td>Short-term: principles, consistency, truth; typically religious and nationalistic</td></tr>
<tr><td>6</td><td><b>Indulgence vs Restraint (IVR)</b> – with Michael Minkov; relatively new, less data</td><td>Indulgent: free gratification of drives and emotions, enjoying life, having fun</td><td>Restrained: suppress gratification; more regulation; stricter social norms</td></tr></table>
<p class="tip">{C} Mnemonic <b>"PIMULI"</b> → <b>P</b>ower, <b>I</b>ndividualism, <b>M</b>asculinity, <b>U</b>ncertainty, <b>L</b>ong-term, <b>I</b>ndulgence ("<b>P</b>lease <b>I</b> <b>M</b>ust <b>U</b>nderstand <b>L</b>ocal <b>I</b>deas").</p>
<p>{C} Link to intercultural communication: Hofstede's model gives <b>cognitive CQ</b> (knowledge of differences). Example: a student from a high-PDI culture may not question a professor; a manager from an individualist culture may praise people individually, which can embarrass members of a collectivist team.</p>`,
  must:["Hofstede – IBM – 50+ countries","Bond & Minkov – dimensions 5 & 6","6 dimensions in order with meaning","LTO originally 'Pragmatic vs Normative'","IVR newest, less data"],
  confused:[["PDI","UAI","PDI = acceptance of unequal POWER. UAI = coping with ANXIETY/uncertainty."],["MAS","IDV","MAS = gender ROLES & achievement vs care. IDV = ties to the GROUP."],["Long-term","Short-term","Long = pragmatic, thrifty, modest. Short = principles, truth, tradition, nationalistic."]],
  traps:["Minkov is linked to the SIXTH dimension (Indulgence vs Restraint).","Short-term orientation is described as 'religious and nationalistic' – not long-term."]
 },
 {id:"w8t5", title:"Debate: Can IT and digital creative industries preserve national culture while competing globally?", src:"S",
  quick:[
   "Creative industries = film, music, games, design, media, digital content, animation {X}",
   "Infrastructure: ==Astana Hub== (international IT technopark, 2018) with tax preferences {X}",
   "Pro: tech spreads culture worldwide (Q-pop, Dimash, Kazakh films, games with nomadic themes, AI in Kazakh) {C}",
   "Con: homogenization, English/Russian dominance, market logic, brain drain, commercialization {C}",
   "Best answer: ==glocalization==: yes, IF policy supports Kazakh-language content, heritage data, education and authentic storytelling {C}"
  ],
  deep:`<p class="note">This seminar question is not covered in the slides; the material below combines course concepts with external information {X} and analysis {C}. Use it to build an argument, not to memorize numbers.</p>
<h4>Key concepts to use {C}</h4>
<p><b>Cultural identity</b> (Week 7), <b>globalization</b> and <b>glocalization</b> (Robertson), <b>cultural homogenization</b>, <b>mass culture</b>, <b>digital culture</b> as participatory culture, <b>cultural codes</b>, <b>soft power</b> {X}, <b>economic modernization</b> (Digital Kazakhstan, Week 9).</p>
<h4>The sectors {X}{C}</h4>
<table class="tbl"><tr><th>Sector</th><th>Opportunity for Kazakh culture</th><th>Risk</th></tr>
<tr><td>Digital media</td><td>Kazakh-language YouTube/TikTok creators, memes ("Eşqandai ne joq", Week 9), podcasts</td><td>Algorithms reward global trends; Russian/English dominance</td></tr>
<tr><td>Game development</td><td>Games using nomadic history, mythology (Tengri, Samruk), togyzkumalak apps; studios supported at Astana Hub</td><td>Small market; pressure to copy global genres; outsourcing only</td></tr>
<tr><td>Cinema</td><td>Kazakhfilm and private studios; historical epics (e.g. <i>Tomiris</i>, 2019, Akan Satayev {X}); festival art-house films</td><td>Hollywood competition; stereotypes for export</td></tr>
<tr><td>Music</td><td>Dimash Qudaibergen's global fame; Q-pop (Ninety One); ethno-rock and folk fusion; Spirit of Tengri festival</td><td>Losing traditional forms (küy) to pop formats</td></tr>
<tr><td>AI & technology</td><td>Kazakh language models ({X} e.g. KazLLM, 2024), Kazakh National Corpus, digitized archives, eGov AI</td><td>Bias toward big languages; data scarcity; dependence on foreign platforms</td></tr></table>
<h4>Arguments FOR ("Yes, it can") {C}</h4>
<ol><li>Technology <b>lowers barriers</b>: anyone can publish Kazakh content to a global audience.</li>
<li><b>Glocalization</b> sells: global audiences seek authentic, unique stories (nomads, steppe, Silk Road).</li>
<li><b>Economic modernization</b> funds culture: a strong IT sector creates jobs, taxes and investors for creative projects.</li>
<li><b>Digital preservation</b> (e-Museum, corpus, archives) makes heritage usable as raw material for new products.</li>
<li>Soft power: culture improves the country's image and tourism.</li></ol>
<h4>Arguments AGAINST ("It is difficult") {C}</h4>
<ol><li><b>Cultural homogenization</b>: to compete, products often adopt global formats and English.</li>
<li><b>Commercialization</b> turns traditions into superficial "brand decoration".</li>
<li><b>Brain drain</b> and small domestic market.</li>
<li>Dependence on <b>foreign platforms</b> and their algorithms.</li>
<li>Risk of <b>stereotypes</b> and simulacra instead of living culture.</li></ol>
<h4>Model conclusion {C}</h4>
<p>Kazakhstan can preserve national culture <i>and</i> compete if it follows a <b>glocal</b> strategy: global technology + local content; state support for Kazakh-language content and heritage data; education linking IT and humanities (Digital Humanities); protecting creators' rights; avoiding stereotypes by letting communities represent themselves.</p>`,
  must:["Use concepts: identity, globalization, glocalization, homogenization, digital culture","Give 2–3 arguments for and against with Kazakh examples","Conclude with a balanced, glocal answer"],
  confused:[],
  traps:["Do not answer only 'yes' or 'no' – essay questions reward BOTH sides plus a reasoned conclusion."]
 }
 ]
},

 {id:"w9t1", title:"Culture shock: concept and stages", src:"L",
  quick:[
   "==Kalervo Oberg==, Canadian anthropologist, ==1950s==, introduced 'culture shock' {L}",
   "Culture shock = ==anxiety from losing familiar signs and symbols== of social intercourse {L}",
   "Causes: different norms, language barriers, communication styles, unwritten rules, loneliness {L}",
   "Stages: ==1 Honeymoon → 2 Rejection/Regression → 3 Adjustment/Negotiation → 4 Mastery== {L}",
   "Mastery: 'an ==adoptive cultural native==' – not everyone reaches it {L}"
  ],
  deep:`<p><b>Kalervo Oberg</b>, a Canadian anthropologist, introduced the term <b>"culture shock"</b> in the <b>1950s</b>. Culture shock is <b>the anxiety that results from losing all our familiar signs and symbols of social intercourse</b>. Culture shapes our unconscious habits; an unfamiliar culture disrupts them. Our expectations are often built from tourist attractions, movies and an idealized image of a country. {L}</p>
<p>Causes: different social norms, language barriers, communication styles, unwritten social rules, loneliness. {L}</p>
<table class="tbl"><tr><th>Stage</th><th>Description {L}</th></tr>
<tr><td>1. <b>Honeymoon</b></td><td>Just arrived and fascinated; senses alert; language understood better than expected; euphoric, energetic; differences hardly noticed and excused "like the defects in a loved person"</td></tr>
<tr><td>2. <b>Rejection / Regression</b></td><td>Confused, tired, afraid, rejected, lonely, irritable, anxious; physical fatigue (sleep, food); language barriers more noticeable; homesickness; host culture compared negatively ("nothing works, people are rude")</td></tr>
<tr><td>3. <b>Adjustment / Negotiation</b></td><td>Gradual adaptation; routines (same route, same shops); new people help interpret situations; better language; knows the city; understands the target culture is not bad, just different</td></tr>
<tr><td>4. <b>Mastery</b></td><td>Becomes "an adoptive cultural native"; not everyone stays long enough to complete this stage</td></tr></table>
<p class="tip">{C} Mnemonic <b>"Happy Rabbits Always Munch"</b> = Honeymoon, Rejection, Adjustment, Mastery. {C} Link to CQ: high motivational and behavioral CQ shorten the rejection stage.</p>`,
  must:["Oberg 1950s","Definition: anxiety from losing familiar signs and symbols","4 stages in order with features","Adoptive cultural native"],
  confused:[["Rejection","Adjustment","Rejection = negative comparisons, homesickness. Adjustment = routines, understanding 'different, not bad'."]],
  traps:["The second stage is REJECTION/REGRESSION, not 'negotiation' (negotiation = 3rd)."]
 },
 {id:"w9t2", title:"New trends in modern culture: hustle, meme, digital, cancel and AI culture", src:"L",
  quick:[
   "==Hustle culture== – glorifies constant productivity, achievement; self-worth based on measurable output {L}",
   "==Digital culture== – ==participatory culture==; users consume AND contribute; digital communication, AI tools, online art, virtual museums {L}",
   "==Meme== – ==Richard Dawkins==, <i>==The Selfish Gene== (1976)</i>: 'unit of cultural transmission, or a unit of imitation'; from Greek ==mimeme== {L}",
   "Meme: 3 characteristics – passes person to person; reproduces by ==imitation==; diffuses through ==competition and selection== {L}",
   "Kazakh TikTok meme ==\"Eşqandai ne joq\"== (2024, from a Habar-24 interview; @irohkoke) – Qairzhan 2025 {L}",
   "==Cancel culture== – collective withdrawal of support from a person/brand after offensive behavior, often online {X}",
   "AI & culture: ==UNESCO Recommendation on the Ethics of AI== (slide: published 2022); Kazakhstan ==Law on Artificial Intelligence – 17 Nov 2025== {L}"
  ],
  deep:`<h4>1. Hustle culture {L}{X}</h4>
<p><b>Definition</b>: a mindset that glorifies constant productivity and achievement, with <b>self-worth based on measurable output</b>. {L} {X} Origins: start-up and Silicon Valley work ethic of the 2010s ("rise and grind", #hustle), gig economy, social media success stories. Characteristics: long hours, "side hustles", busyness as status, always online. Positive: ambition, entrepreneurship, skill growth. Negative: <b>burnout</b>, anxiety, toxic productivity, weak work-life balance. Counter-trends: "quiet quitting", slow living, well-being. Kazakh example {C}: students combining study, freelance IT work and online courses.</p>
<h4>2. Digital culture {L}</h4>
<p>A <b>participatory culture</b> where users not only consume information but also contribute in many ways; it includes digital communication, AI tools, online art and virtual museums. Positive: access, creativity, global communication. Negative: digital divide, misinformation, addiction, privacy loss. Examples: Wikipedia, e-Museum, eGov, TikTok.</p>
<h4>3. Meme culture {L}</h4>
<p>The term <b>meme</b> was introduced by <b>Richard Dawkins</b> in <i>The Selfish Gene</i> (<b>1976</b>): "the unit of cultural transmission, or a unit of imitation." He shortened Greek <b>"mimeme"</b> to a monosyllable that sounds like "gene" (also related to "memory" and French <i>même</i>; it rhymes with "cream"). Dawkins' examples: tunes, ideas, catch-phrases, clothes fashions, ways of making pots or building arches. Today memes are visual, textual or audiovisual reactions to social, political and cultural events.</p>
<p><b>Three main characteristics</b> (Shifman 2013): (1) cultural information passing from person to person and becoming a shared social phenomenon; (2) reproduction by various means of <b>imitation</b>; (3) diffusion through <b>competition and selection</b>.</p>
<p><b>Kazakhstan</b>: the TikTok meme <b>"Eşqandai ne joq"</b> ("There is nothing like this" / Ешқандай не жоқ) – from a <b>Habar-24</b> TV interview with a woman; phrases taken out of context for humor; published by <b>@irohkoke (Shaikumar Airo) in 2024</b>; "linguistic absurdity, visual aesthetics and rhythmic structure form a specific model of social reality perception"; it reflects social problems and alienation; comments: "The most surprising thing is that everyone understood." Memes reflect local realities, linguistic practices and cultural references (A. Qairzhan, <i>Saryn</i>, 2025). {L}</p>
<h4>4. Cancel culture {S}{X}</h4>
<p><b>Definition</b> {X}: the practice of publicly withdrawing support from (boycotting, "calling out", unfollowing) a person, brand or organization after statements or actions seen as offensive, usually through social media. Origins: late 2010s social-media activism (#MeToo era), "call-out culture". Characteristics: speed, virality, collective moral judgment, little due process. Positive: accountability for real harm, voice for marginalized groups. Negative: mob justice, disproportionate punishment, fear of speaking (self-censorship), no chance to apologize or learn, overlaps with <b>cyberbullying</b> and trolling (Week 7). Link: netiquette rule 10 – <i>be forgiving of other people's mistakes</i>.</p>
<h4>5. AI culture {L}{X}</h4>
<p>AI changes how culture is created and consumed: AI art and music, chatbots, translation, recommendation algorithms. Regulation: <b>UNESCO Recommendation on the Ethics of Artificial Intelligence</b> (slide: published 2022; {X} adopted by UNESCO Member States in November 2021) – human rights, fairness, transparency, accountability. <b>Kazakhstan: Law on Artificial Intelligence, 17 November 2025</b>, and other regulations {L}; {X} Concept of AI Development 2024–2029. Positive: creativity tools, access, preservation (e.g. AI for the Kazakh language). Negative: <b>gender and cultural bias</b> (see Topic 5), deepfakes, plagiarism, job loss, homogenized aesthetics, copyright disputes.</p>
<h4>Comparison table {C}</h4>
<table class="tbl"><tr><th>Trend</th><th>Core idea</th><th>Key word</th><th>+</th><th>−</th></tr>
<tr><td>Hustle</td><td>Self-worth = output</td><td>Productivity</td><td>Ambition</td><td>Burnout</td></tr>
<tr><td>Meme</td><td>Unit of imitation (Dawkins)</td><td>Imitation</td><td>Humor, social critique</td><td>Misinformation, out-of-context</td></tr>
<tr><td>Digital</td><td>Participatory culture</td><td>Participation</td><td>Access, creativity</td><td>Digital divide</td></tr>
<tr><td>Cancel</td><td>Collective withdrawal of support</td><td>Accountability</td><td>Justice for harm</td><td>Mob, no forgiveness</td></tr>
<tr><td>AI</td><td>Machine-generated / assisted culture</td><td>Automation</td><td>New tools</td><td>Bias, deepfakes</td></tr></table>`,
  must:["Hustle = self-worth from measurable output","Digital = participatory","Dawkins 1976 Selfish Gene; meme = unit of imitation; mimeme","3 meme characteristics","Eşqandai ne joq – Habar-24 – 2024","Cancel culture definition + pros/cons","UNESCO AI ethics rec.; KZ AI Law 17 Nov 2025"],
  confused:[["Meme (Dawkins)","Gene","Meme = unit of CULTURAL transmission (imitation); gene = BIOLOGICAL unit."],["Cancel culture","Cyberbullying","Cancel = collective withdrawal of support for perceived wrongdoing (claims accountability). Cyberbullying = harmful targeting (harassment, trolling)."],["Hustle culture","Digital culture","Hustle = PRODUCTIVITY obsession. Digital = PARTICIPATION online."]],
  traps:["The Selfish Gene is from 1976.","Dawkins appears in Week 1 too (sociobiological view: memes ↔ genes)."]
 },
 {id:"w9t3", title:"Digital Humanities and cultural identity", src:"L",
  quick:[
   "==Digital Humanities (DH)== – humanities scholarship, teaching and service grounded in ==digital sources, methodologies, tools and platforms== {L}",
   "First DH project ==1946==: ==Roberto Busa== (Italian priest) – linguistic automation for ==Thomas Aquinas== → ==56-volume <i>Index Thomisticus</i>== {L}",
   "4 directions: ==textual/linguistic; spatial/visual; archival/preservation; digital modeling/reconstruction== {L}",
   "Kazakh National Corpus: ==250,000,000== word usages, ==20 subcorpora== {L}",
   "==ORBIS== (Stanford) – Roman world travel model: ==632 sites, ~10 million km²== {L}",
   "==Caravans of Gold, Fragments in Time== – Block Museum, Northwestern Univ.; Sahara: ==Mali, Morocco, Nigeria== {L}",
   "e-Museum – digital modeling: ==700+ 3D exhibits== {L}"
  ],
  deep:`<p><b>Digital Humanities (DH)</b> – "a field of humanities scholarship, teaching, and service which is grounded in digital sources, methodologies, tools and platforms" (M. K. Gold). {L}</p>
<p><b>History</b>: the first DH projects date back to <b>1946</b>, when the Italian priest <b>Roberto Busa</b> used linguistic automation (with IBM {X}) in his research on <b>Thomas Aquinas</b>' works. The result was the <b>56-volume <i>Index Thomisticus</i></b>. Today DH includes anthropology, history, linguistics, literary studies, cultural studies and technology. {L}</p>
<h4>Four directions with examples {L}</h4>
<table class="tbl"><tr><th>Direction</th><th>Methods</th><th>Example</th></tr>
<tr><td><b>Textual and linguistic</b></td><td>Text encoding, text mining, corpus linguistics</td><td><b>Kazakh National Corpus</b> (qazcorpus.kz, A. Baitursynuly Institute of Linguistics): electronic collection covering the lexical and grammatical system of Kazakh with deep annotation; <b>250,000,000 word usages</b>; scientific, conversational, fictional texts; <b>20 subcorpora</b> (spoken, contemporary poetry, historical, cultural-representative…)</td></tr>
<tr><td><b>Spatial and visual</b></td><td>GIS mapping, data visualization, geospatial analysis</td><td><b>ORBIS: The Stanford Geospatial Network Model of the Roman World</b> – time cost and financial expense of travel in antiquity; historians + IT specialists; <b>632 sites</b>, about <b>10 million km²</b></td></tr>
<tr><td><b>Archival and preservation</b></td><td>Digitization of manuscripts and archives in museums, libraries, archives</td><td><b><i>Caravans of Gold, Fragments in Time: Art, Culture, and Exchange across Medieval Saharan Africa</i></b> – online exhibition, <b>Block Museum of Art, Northwestern University</b>; Sahara routes; finds from <b>Mali, Morocco, Nigeria</b></td></tr>
<tr><td><b>Digital modeling and reconstruction</b></td><td>3D modeling of historical sites, VR, digital heritage</td><td><b>E-museum</b> – national platform uniting all Kazakh museums; virtual tours; <b>700+ 3D exhibits</b></td></tr></table>
<h4>DH and cultural identity {C}</h4>
<ul><li><b>Preservation</b>: digitized manuscripts (e.g. collected in the Madeni Mura program, Week 10), audio archives of akyns and küys.</li>
<li><b>Access and education</b>: anyone can explore heritage online; teaching history with GIS maps of the Silk Road.</li>
<li><b>Language</b>: corpora and AI tools keep Kazakh competitive in the digital age.</li>
<li><b>Globalization</b>: DH lets Kazakhstan present its heritage to the world on its own terms.</li></ul>
<p><b>Opportunities vs limitations</b> {C}{X}: + scale, speed, collaboration, new questions; − digital divide, cost, need for both IT and humanities skills, copyright, risk of losing context ("data without meaning"), dependence on technology and formats that age.</p>`,
  must:["DH definition (Gold)","1946 Busa – Thomas Aquinas – Index Thomisticus 56 vols","4 directions + their examples","Corpus 250M, 20 subcorpora; ORBIS 632 sites, 10M km²; Caravans of Gold (Northwestern; Mali, Morocco, Nigeria); e-Museum 700+ 3D"],
  confused:[["ORBIS","Caravans of Gold","ORBIS = SPATIAL (Roman roads, Stanford). Caravans = ARCHIVAL (Sahara, Northwestern)."],["Kazakh National Corpus","e-Museum","Corpus = TEXTUAL/linguistic. e-Museum = 3D MODELING/reconstruction."]],
  traps:["Busa studied Thomas AQUINAS (not Aristotle), and the Index has 56 volumes.","DH started in 1946 – not with the internet in the 1990s."]
 },

  ],
  deep:`<p class="note">Not covered in the slides – prepared from official and reliable sources {X}. The <b>original program</b> (2018–2022) must be distinguished from <b>earlier</b> e-government and <b>later</b> digital initiatives.</p>
<h4>Timeline of digitalization in Kazakhstan {X}</h4>
<table class="tbl"><tr><th>Year</th><th>Initiative</th></tr>
<tr><td>2004 (10 Nov)</td><td>Presidential decree on the State Program for forming e-government 2005–2007</td></tr>
<tr><td>12 April 2006</td><td><b>eGov.kz</b> portal launched (at first an information "showcase")</td></tr>
<tr><td>2017 (31 Jan)</td><td>Presidential Address "Third Modernization of Kazakhstan: Global Competitiveness" – digitalization as a priority</td></tr>
<tr><td>12 Dec 2017</td><td><b>"Digital Kazakhstan" State Program</b> approved (Government Decree No. 827), for <b>2018–2022</b></td></tr>
<tr><td>2018</td><td>Astana Hub international IT technopark founded</td></tr>
<tr><td>2019</td><td>eGov Mobile app in new format</td></tr>
<tr><td>28 Mar 2023</td><td><b>Concept of Digital Transformation, Development of the ICT Sector and Cybersecurity for 2023–2029</b> (Gov. Resolution No. 269)</td></tr>
<tr><td>July 2024</td><td>Concept for Artificial Intelligence Development 2024–2029</td></tr>
<tr><td>17 Nov 2025</td><td><b>Law on Artificial Intelligence</b> {L}</td></tr>
<tr><td>9 Jan 2026</td><td><b>Digital Code</b> adopted {S}</td></tr></table>
<h4>The Digital Kazakhstan program (2018–2022)</h4>
<p><b>Aim</b>: "a comprehensive program aimed at improving the standard of living of every citizen through the use of digital technologies"; accelerate economic growth and prepare a transition to a digital economy. Responsible body: Ministry of Information and Communications (later the Ministry of Digital Development, Innovation and Aerospace Industry). <b>Five directions</b>:</p>
<ol><li><b>Digitalization of economic sectors</b> – transform traditional industries (mining, agriculture, transport, energy, e-commerce) to raise labor productivity.</li>
<li><b>Transition to a digital state</b> – e-government, proactive public services, "state as a platform".</li>
<li><b>Implementation of the Digital Silk Road</b> – digital infrastructure: broadband, fiber to villages, data centers, information security.</li>
<li><b>Development of human capital</b> – digital literacy in schools, colleges, universities and for adults; IT specialists.</li>
<li><b>Creation of an innovative ecosystem</b> – start-ups, venture capital, technoparks (Astana Hub).</li></ol>
<p>17 initiatives, 120 projects, 12 target indicators; expected 300,000 new jobs and labor-productivity growth.</p>
<h4>Digital transformation of government, economy and society</h4>
<ul><li><b>Government</b>: eGov.kz and eGov Mobile, digital ID documents, eLicense, e-Otinish (citizens' appeals); about <b>90% of public services available online</b>; 15+ million registered users (gov.kz, 2025–26). Kazakhstan ranks among the <b>top 25 in the UN E-Government Development Index</b> (2024).</li>
<li><b>Economy</b>: digital banking and payments (e.g. Kaspi), smart fields in mining, e-commerce, fintech.</li>
<li><b>Society</b>: internet in villages (program for villages with 250+ people), digital schools, online education, e-health records; "Smart City" ratings.</li>
<li><b>Culture</b>: e-Museum, digitized libraries and archives, Kazakh National Corpus.</li></ul>
<h4>Achievements and limitations {X}{C}</h4>
<table class="tbl"><tr><th>Achievements</th><th>Limitations</th></tr>
<tr><td>Fast online public services; less bureaucracy and corruption risk</td><td><b>Digital divide</b>: rural areas, elderly people</td></tr>
<tr><td>Growth of IT sector and start-ups; IT exports</td><td><b>Cybersecurity</b> threats and personal-data leaks</td></tr>
<tr><td>Infrastructure: broadband to villages</td><td>Uneven quality of internet; dependence on foreign technology</td></tr>
<tr><td>High UN e-government ranking</td><td>Need for digital literacy and qualified specialists; brain drain</td></tr></table>
<h4>Social and cultural implications {C}</h4>
<p>New habits (cashless life, online services), changing communication between citizens and the state, new digital identity, but also surveillance concerns (informational city, Week 8) and the need for digital ethics (Digital Code principle 9).</p>`,
  must:["eGov.kz – 12 April 2006","Digital Kazakhstan – approved 12 Dec 2017 – 2018–2022","5 directions","17 initiatives / 120 projects / 12 indicators","Later: Concept 2023–2029; AI Law 2025; Digital Code 2026"],
  confused:[["Digital Kazakhstan (2018–2022)","Concept of Digital Transformation (2023–2029)","Program = 2018–2022 with 5 directions. Concept = the NEXT stage, 2023–2029, adds cybersecurity."],["Digital Silk Road","Digital state","Silk Road direction = INFRASTRUCTURE (connectivity). Digital state = e-GOVERNMENT services."]],
  traps:["Digital Kazakhstan was APPROVED in Dec 2017 but RUNS 2018–2022.","eGov.kz (2006) is OLDER than Digital Kazakhstan – don't confuse them."]
 },
 {id:"w9t5", title:"Gender policy in the IT sector", src:"L",
  quick:[
   "==Gender equality== – equal rights, opportunities and treatment regardless of gender {L}",
   "==Gender stereotypes== – assumptions about what men and women are naturally good at or should do {L}",
   "==Gender bias in AI== – AI produces unfair outcomes because of biased data or design {L}",
   "==Glass ceiling== – invisible barriers preventing women & minorities from reaching senior positions {L}",
   "==Gender pay gap== – difference in earnings between men and women for the same work {L}",
   "==Ada Lovelace== – English mathematician, called the ==first computer programmer== {L}",
   "==UNESCO Red Teaming AI for social good – PLAYBOOK== {L}",
   "==Techno Women== (Kazakhstan NGO): ==Tech Girls, IT Aiel, Robotech Girls== {L}",
   "Stats {X}: women ≈ ==42%== of info & communications employees; ≈24% of IT students (2024); men in ICT earn ≈45% more"
  ],
  deep:`<h4>Key terms {L}</h4>
<table class="tbl"><tr><th>Term</th><th>Definition</th></tr>
<tr><td><b>Gender equality</b></td><td>Equal rights, opportunities and treatment regardless of gender</td></tr>
<tr><td><b>Gender stereotypes</b></td><td>Assumptions about what men and women are naturally good at or should do ("boys are better at coding")</td></tr>
<tr><td><b>Gender bias in AI</b></td><td>Situations when AI systems produce unfair outcomes because of biased data or design (e.g. image generators showing only men as engineers)</td></tr>
<tr><td><b>Glass ceiling</b></td><td>Invisible barriers that prevent women and minority groups from reaching senior positions</td></tr>
<tr><td><b>Gender pay gap</b></td><td>The difference in earnings between men and women for the same work</td></tr></table>
<p><b>Ada Lovelace</b> (1815–1852 {X}), English mathematician, is called the <b>first computer programmer</b> (notes on Babbage's Analytical Engine {X}). The lecture uses the <b>UNESCO "Red Teaming Artificial Intelligence for Social Good" PLAYBOOK</b> to show how AI can reinforce gender stereotypes and how testing ("red teaming") can reveal bias. {L}</p>
<h4>Contribution to gender equality {L}</h4>
<ul><li>Increasing women's participation in technology.</li><li>Developing digital and STEM skills.</li><li>Supporting female leadership and entrepreneurship.</li></ul>
<p><b>"Techno Women"</b> – a non-profit organization in Kazakhstan that unites women in IT, digital, telecom, new media, fintech, edutech, healthtech, biotech, ecotech, nanotech, robotics, space and other high-tech industries. Projects: <b>Tech Girls</b>, <b>IT Aiel</b>, <b>Robotech Girls</b>. {L}</p>
<h4>Kazakhstan: data and policies {X}</h4>
<ul><li>Women make up about <b>42%</b> of employees in the information and communications sector (2019–2024, steady); but in 2024 they were about <b>24% of IT students</b> (down from 31.7% in 2019, because male enrolment grew faster), even though the number of female IT students tripled (4,500 → 15,300). Men in ICT earn on average about <b>45% more</b> than women (Ranking.kz data, 2025).</li>
<li>WEF Global Gender Gap Report 2024: about <b>30% of ICT graduates</b> in Kazakhstan are women.</li>
<li>Astana Hub: women-led IT companies grew from 179 (2023) to 301 (2025).</li>
<li>Policy framework: Concept of Family and Gender Policy until 2030 (2016); National Commission for Women's Affairs, Family and Demographic Policy; programs like TechnoWomen forums, Girls in ICT Day (4th Thursday of April, ITU).</li></ul>
<h4>International comparison {X}</h4>
<p>Globally women hold under a third of tech positions and about 22% of AI jobs (figures quoted by ITU, 2024); in EU countries women are only about one fifth of ICT specialists. Kazakhstan's share of women in the ICT sector is comparatively high, but leadership and pay gaps persist – a <b>glass ceiling</b> effect.</p>
<h4>Barriers and solutions {C}</h4>
<table class="tbl"><tr><th>Barriers</th><th>Opportunities for improvement</th></tr>
<tr><td>Stereotypes from school ("IT is for boys"); lack of role models</td><td>Role models (Ada Lovelace, local founders), girls' coding clubs (Tech Girls)</td></tr>
<tr><td>Work–family balance; traditional expectations</td><td>Flexible/remote work, childcare, parental leave for both parents</td></tr>
<tr><td>Pay gap; glass ceiling</td><td>Transparent salaries, mentoring, women in leadership programs</td></tr>
<tr><td>Biased AI and hiring tools</td><td>Red-teaming and auditing AI, diverse development teams</td></tr></table>
<p>{C} Cultural implications: gender roles in a traditional society meet a global, meritocratic IT industry – a typical "tradition vs innovation" tension (Week 10).</p>`,
  must:["5 key terms with definitions","Ada Lovelace – first programmer","UNESCO Red Teaming PLAYBOOK","Techno Women – Tech Girls, IT Aiel, Robotech Girls","3 contributions to equality"],
  confused:[["Glass ceiling","Gender pay gap","Glass ceiling = blocked PROMOTION to senior roles. Pay gap = different EARNINGS for the same work."],["Gender stereotype","Gender bias in AI","Stereotype = human ASSUMPTION. AI bias = unfair OUTPUT of a system due to biased data/design."]],
  traps:["The lecture defines the pay gap as the difference 'for the SAME work'.","Ada Lovelace was a MATHEMATICIAN (English) – not an engineer of ENIAC."]
 }
 ]
},

 {id:"w10t1", title:"The Cultural Heritage (Madeni Mura) Program: goals and achievements", src:"X",
  quick:[
   "==\"Madeni Mura\" (Cultural Heritage)== state program – initiated by President ==N. Nazarbayev==; adopted ==2004== (January) {X}",
   "Kazakhstan – ==first CIS country== with such a large-scale heritage program {X}",
   "Stages: ==2004–2006, 2007–2009, 2009–2011== {X}",
   "Aims: study, ==restoration and preservation== of historical-cultural heritage; revival of traditions; promotion of heritage {X}",
   "Directions: restoring monuments; ==archaeology==; scientific works; ==finding manuscripts in foreign archives==; publishing series {X}",
   "Results: restoration of dozens of monuments (51 by mid-program, 73+ later); ==~5,000 manuscripts== acquired early, ==10,000+== archival records; ==~3,000 documents from China== {X}",
   "Monuments: mausoleums of ==Aisha Bibi, Arystan Bab==, Abat-Baitak, Esim Khan; Yasawi complex works {X}",
   "Publications: ==\"Babalar Sozi\" (100 volumes)== of folklore {X}",
   "Follow-ups: ==People in the Flow of History (2013)==; ==Rukhani Zhangyru (2017)== – Sacred Geography; Archive-2025 {X}"
  ],
  deep:`<p class="note">No Week 10 lecture was uploaded. This topic is prepared from official sources (e-history.kz, academic articles) {X}.</p>
<h4>Background {X}</h4>
<p>After independence Kazakhstan needed to restore historical memory damaged in the Soviet period (lost manuscripts, neglected monuments, repressed names). In his Address to the people, President <b>Nursultan Nazarbayev</b> ordered the creation of the State Program <b>"Mädeni Mura" (Cultural Heritage)</b>; it was adopted in <b>2004</b>. Kazakhstan was the <b>first CIS country</b> to launch such a large-scale project. It became a "strategic national project" and the basic document for preserving and using cultural heritage.</p>
<h4>Goals {X}</h4>
<ul><li>Studying, <b>restoring and preserving</b> historical and cultural heritage;</li>
<li><b>Reviving</b> historical and cultural traditions;</li>
<li><b>Promoting</b> Kazakhstan's heritage (including abroad);</li>
<li>Strengthening <b>national identity</b> and the spiritual unity of the people;</li>
<li>Creating a system for studying national culture – history, philosophy, ethnography, language, literature, art, music.</li></ul>
<h4>Implementation – stages and directions {X}</h4>
<p><b>Stages</b>: 2004–2006, 2007–2009, 2009–2011 (some sources: 2007–2008). Directions:</p>
<ol><li><b>Restoration</b> of historical, cultural and architectural monuments of special national importance;</li>
<li><b>Archaeological research</b> (settlements, burial mounds);</li>
<li><b>Scientific works</b> on Kazakh cultural heritage and publication series;</li>
<li><b>Searching for and acquiring copies of manuscripts, rare books and archival documents</b> about Kazakhstan in foreign archives and libraries (China, Russia, Turkey, Mongolia, Egypt, Europe…);</li>
<li>Restoring monuments connected to Kazakh history <b>abroad</b>; introducing ICT in museums; restoring audio recordings of 20th-century performers.</li></ol>
<h4>Major achievements {X}</h4>
<ul><li>Restoration of <b>dozens of monuments</b> (51 by an early report, more than 73 later): mausoleums of <b>Aisha Bibi, Arystan Bab, Abat-Baitak, Esim Khan</b>; the Zharkent Mosque; Ascension Cathedral in Almaty; the house of Tatar poet Gabdulla Tukai in Uralsk; churches in Turkistan.</li>
<li><b>Archaeology</b>: research on 39+ ancient settlements and barrows; later 40+ archaeological projects.</li>
<li><b>Manuscripts and archives</b>: about <b>5,000 manuscripts and printed editions</b> acquired in the first stage; later more than <b>10,000</b> archival records, documents and manuscripts identified – the largest number (about <b>3,000</b>) in <b>China</b>.</li>
<li>A <b>public list of monuments</b>: 218 of national significance and about 11,500 of local significance.</li>
<li><b>Publications</b>: the 100-volume series <b>"Babalar Sözi"</b> ("Words of the Ancestors" – Kazakh folklore and epics), anthologies of Kazakh literature, music, philosophy and history translated into world languages.</li></ul>
<h4>Later programs (continuity) {X}</h4>
<table class="tbl"><tr><th>Program</th><th>Year</th><th>Focus</th></tr>
<tr><td>Madeni Mura</td><td>2004–2011</td><td>Monuments, archaeology, manuscripts</td></tr>
<tr><td>"People in the Flow of History" (Khalyk tarikh tolkynynda)</td><td>2013–</td><td>Searching foreign archives; research of national history</td></tr>
<tr><td>Rukhani Zhangyru ("Modernization of Spirituality / Looking to the Future")</td><td>2017</td><td>Projects "Sacred Geography of Kazakhstan", "Tugan Zher" (native land), "100 New Faces", transition to Latin script – the course's own goal is linked to this program (Week 1)</td></tr>
<tr><td>Archive-2025</td><td>2020s</td><td>Returning documents and films from foreign archives (e.g. a rare video of Shara Zhienkulova found in Russia, Nov 2025)</td></tr></table>
<p class="tip">{C} Memory: "<b>Mura</b> = <b>M</b>onuments, <b>U</b>nearthing (archaeology), <b>R</b>are manuscripts, <b>A</b>nthologies (Babalar Sozi)". Dates: <b>"04-06-09-11"</b>.</p>
<h4>National identity and cultural memory {C}</h4>
<p>By returning manuscripts and restoring sacred places, the program reconnected Kazakhs with the medieval and nomadic past (Yasawi, al-Farabi, Kashgari, Turkic inscriptions) – it built <b>cultural memory</b> (see Topic 7) and strengthened the narrative of a continuous "Great Steppe" civilization.</p>`,
  must:["Madeni Mura 2004; initiator Nazarbayev; first in CIS","Stages 2004–2006 / 2007–2009 / 2009–2011","Goals: study, restore, preserve, revive, promote","Results: monuments (Aisha Bibi, Arystan Bab), ~5,000 manuscripts, 10,000+ records, China 3,000, Babalar Sozi 100 vols","Successors: People in the Flow of History 2013, Rukhani Zhangyru 2017"],
  confused:[["Madeni Mura (2004)","Rukhani Zhangyru (2017)","Madeni Mura = HERITAGE program (monuments, manuscripts). Rukhani Zhangyru = MODERNIZATION OF CONSCIOUSNESS (Sacred Geography, Latin script)."]],
  traps:["The program started in 2004, not 2014.","The largest number of foreign documents came from CHINA."]
 },

  deep:`<p class="note">Prepared from UNESCO and other reliable sources {X}.</p>
<h4>UNESCO's role {X}</h4>
<p>The <b>United Nations Educational, Scientific and Cultural Organization</b> was founded in <b>1945</b> (headquarters in <b>Paris</b>). In culture it sets international standards (conventions), keeps lists of heritage, provides expert help and funds, trains specialists and promotes dialogue between cultures.</p>
<table class="tbl"><tr><th>Convention / instrument</th><th>Year</th><th>Protects</th></tr>
<tr><td>Hague Convention</td><td>1954</td><td>Cultural property in the event of armed conflict</td></tr>
<tr><td>Convention on illicit import/export/transfer of cultural property</td><td>1970</td><td>Against trafficking (basis of the Virtual Museum of Stolen Objects, Week 7)</td></tr>
<tr><td><b>World Heritage Convention</b></td><td><b>1972</b></td><td>Cultural and natural sites of "outstanding universal value"; World Heritage List</td></tr>
<tr><td>Universal Declaration on Cultural Diversity</td><td>2001</td><td>Cultural diversity as "common heritage of humanity"</td></tr>
<tr><td><b>Convention for the Safeguarding of the Intangible Cultural Heritage</b></td><td><b>2003</b></td><td>Living traditions: oral traditions, performing arts, rituals, crafts, knowledge of nature</td></tr>
<tr><td>Convention on the Diversity of Cultural Expressions</td><td>2005</td><td>Cultural industries and policies</td></tr>
<tr><td>Memory of the World programme</td><td>1992</td><td>Documentary heritage (manuscripts, archives, audiovisual)</td></tr>
<tr><td>Recommendation on the Ethics of AI</td><td>2021 (slide: 2022)</td><td>Ethical AI (Week 9)</td></tr></table>
<p><b>World Heritage</b> = tangible sites (cultural or natural). <b>Intangible Cultural Heritage (ICH)</b> = practices, expressions, knowledge and skills that communities recognize as their heritage, transmitted between generations.</p>
<h4>Kazakhstan's participation {X}</h4>
<p>Kazakhstan joined UNESCO in <b>1992</b>, ratified the World Heritage Convention in <b>1994</b>, joined the 2003 ICH Convention in <b>2011</b> and created a National Committee for ICH in 2012; its National ICH List (2013) has more than 50 elements. It served on the ICH Intergovernmental Committee (2018–2022). UNESCO also supports Kazakh events (World Nomad Games 2024 was organized in collaboration with UNESCO).</p>
<h4>World Heritage sites in Kazakhstan (7) {X}</h4>
<table class="tbl"><tr><th>Site</th><th>Year</th><th>Type</th></tr>
<tr><td>Mausoleum of Khoja Ahmed Yasawi (Turkistan)</td><td>2003 – the first</td><td>Cultural</td></tr>
<tr><td>Petroglyphs within the Archaeological Landscape of Tamgaly</td><td>2004</td><td>Cultural</td></tr>
<tr><td>Saryarka – Steppe and Lakes of Northern Kazakhstan (Korgalzhyn, Naurzum)</td><td>2008</td><td>Natural</td></tr>
<tr><td>Silk Roads: the Routes Network of Chang'an–Tianshan Corridor (with China, Kyrgyzstan)</td><td>2014</td><td>Cultural (transnational)</td></tr>
<tr><td>Western Tien-Shan (with Kyrgyzstan, Uzbekistan; Aksu-Zhabagly, Karatau, Sairam-Ugam)</td><td>2016</td><td>Natural (transnational)</td></tr>
<tr><td>Cold Winter Deserts of Turan (with Turkmenistan, Uzbekistan)</td><td>2023</td><td>Natural (transnational)</td></tr>
<tr><td>Rock Mosques and Associated Sacred Sites of Mangystau</td><td>25 July 2026 (48th session, Busan)</td><td>Cultural</td></tr></table>
<h4>Intangible Cultural Heritage elements of Kazakhstan (Representative List) {X}</h4>
<table class="tbl"><tr><th>Element</th><th>Year</th><th>Shared?</th></tr>
<tr><td><b>Kazakh traditional art of Dombra Küy</b></td><td>2014</td><td>National</td></tr>
<tr><td>Traditional knowledge and skills in making Kyrgyz and Kazakh yurts</td><td>2014 (extended 2025 with Karakalpak yurts)</td><td>With Kyrgyzstan (+Uzbekistan)</td></tr>
<tr><td><b>Aitysh/Aitys</b>, art of improvisation</td><td>2015</td><td>With Kyrgyzstan</td></tr>
<tr><td><b>Kazakh kuresi</b> (wrestling)</td><td>2016</td><td>National</td></tr>
<tr><td>Flatbread making and sharing (lavash, katyrma, jupka, yufka); Nauryz</td><td>2016 (Nauryz updated 2024)</td><td>Multinational</td></tr>
<tr><td><b>Kazakh traditional Assyk games</b></td><td>2017</td><td>National</td></tr>
<tr><td>Traditional spring festive rites of the Kazakh horse breeders</td><td>2018</td><td>National</td></tr>
<tr><td>Heritage of Dede Qorqud / Korkyt Ata</td><td>2018</td><td>With Azerbaijan, Turkey</td></tr>
<tr><td><b>Togyzqumalaq</b> (Toguz Korgool, Mangala)</td><td>2020</td><td>With Kyrgyzstan, Turkey</td></tr>
<tr><td>Falconry, a living human heritage</td><td>2021 (Kazakhstan joined)</td><td>Multinational</td></tr>
<tr><td><b>Orteke</b> – performing art (dance, puppet, music)</td><td>2022</td><td>National</td></tr>
<tr><td>Telling tradition of Nasreddin Hodja / <b>Kozhanasyr</b> anecdotes</td><td>2022</td><td>Multinational</td></tr>
<tr><td><b>Betashar</b>, traditional wedding ritual</td><td>2024</td><td>National</td></tr></table>
<p class="tip">{C} World Heritage order mnemonic <b>"Y-T-S-S-W-C-M"</b>: "<b>Y</b>oung <b>T</b>ravelers <b>S</b>ee <b>S</b>teppe, <b>W</b>estern mountains, <b>C</b>old deserts, <b>M</b>angystau" (2003, 04, 08, 14, 16, 23, 25).</p>
<p>{X} Other cooperation: UNESCO Almaty Cluster Office; Memory of the World register includes audiovisual documents of the Nevada–Semipalatinsk movement; Kazakhstan restored heritage abroad within Madeni Mura (e.g. sites linked to Sultan Baybars in Egypt and Syria).</p>`,

  deep:`<p class="note">Prepared from external sources {X} and course material (Week 5 lists kokpar, asyq atu, togyzqumalaq, kyz kuu as national games {L}).</p>
<h4>Origins and meaning {X}{C}</h4>
<p>Nomadic life required constant riding, herding, hunting and readiness for war. Games trained <b>horsemanship, strength, courage and strategy</b>; they were held at <b>toi</b> (feasts), <b>as</b> (memorial feasts) and seasonal holidays (Nauryz). Physical culture was therefore inseparable from <b>everyday survival, social life and honour</b> (cf. batyrs' code, Week 5).</p>
<table class="tbl"><tr><th>Sport / game</th><th>Description</th><th>Values / function</th></tr>
<tr><td><b>Kokpar</b> (buzkashi, kok-boru)</td><td>Two teams of riders struggle for a goat carcass (today often a dummy) and throw it into the opponent's goal (<i>kazan</i>)</td><td>Teamwork, horsemanship, courage</td></tr>
<tr><td><b>Baiga</b>, <b>Alaman baiga</b></td><td>Horse races; alaman = long-distance race</td><td>Pride in horse breeding; endurance</td></tr>
<tr><td><b>Kyz kuu</b></td><td>"Catch the girl": a young man chases a girl on horseback to kiss her; if he fails, she chases him back with a whip</td><td>Courtship, equality and skill of women riders</td></tr>
<tr><td><b>Audaryspak</b></td><td>Horseback wrestling – pull the opponent off his horse</td><td>Strength, military skill</td></tr>
<tr><td><b>Tenge ilu / tenge alu</b></td><td>Pick up a coin (or scarf) from the ground at full gallop</td><td>Agility</td></tr>
<tr><td><b>Zhamby atu</b></td><td>Shooting arrows at a target (silver ingot) from horseback</td><td>Archery, hunting</td></tr>
<tr><td><b>Kazakh kuresi</b></td><td>Belt wrestling – UNESCO ICH 2016</td><td>Strength, fair play</td></tr>
<tr><td><b>Asyk atu</b></td><td>Shooting knucklebones (sheep astragali) – UNESCO ICH 2017</td><td>Children's skill, accuracy, socializing</td></tr>
<tr><td><b>Togyzkumalak</b></td><td>"Nine pebbles" mancala-type board game with 162 stones {X} – UNESCO ICH 2020</td><td>Logic, mathematics, strategy</td></tr>
<tr><td><b>Kusbegilik / sayatshylyk</b></td><td>Hunting with golden eagles (berkutchi) and falcons – falconry UNESCO 2016 (Kazakhstan joined the multinational file)</td><td>Relationship with nature</td></tr></table>
<h4>Transmission between generations {C}</h4>
<p>Fathers and elders teach riding from early childhood (the <i>tusau kesu</i> and first-horse rituals, Week 5); asyk games are played by children in the aul; master–apprentice training for eagle hunters; competitions at village and family celebrations.</p>
<h4>Preservation in modern society {X}{C}</h4>
<ul><li><b>World Nomad Games</b> – first held in 2014 (Kyrgyzstan); the <b>5th edition in Astana, 8–13 September 2024</b>, with about 2,800 participants from 89 countries; disciplines included kokpar, audaryspak, kusbegilik, kazakh kuresi, togyzkumalak, asyk atu, archery; organized with UNESCO's collaboration; next edition 2026 in Kyrgyzstan.</li>
<li>Federations and national championships (kokpar league, togyzkumalak federation, asyk atu federation).</li>
<li>UNESCO inscriptions raise international visibility.</li>
<li>Schools and sports sections; togyzkumalak in school curricula; mobile apps.</li>
<li>Challenges: urbanization, cost of horses, animal-welfare debates (dummy carcass in kokpar), commercialization.</li></ul>`,
  must:["Kokpar, baiga, kyz kuu, audaryspak, tenge ilu – meanings","Kuresi 2016, Asyk 2017, Togyzkumalak 2020, Falconry 2021 (UNESCO)","World Nomad Games 5th – Astana 2024"],
  confused:[["Audaryspak","Kokpar","Audaryspak = 1-on-1 WRESTLING on horseback. Kokpar = TEAM game with a goat carcass."],["Kyz kuu","Baiga","Kyz kuu = courtship CHASE of a girl. Baiga = horse RACE."]],
  traps:["Kazakh kuresi is WRESTLING (UNESCO 2016), not horse racing."]

 {id:"w10t4", title:"Globalization and the future of Kazakh cultural identity", src:"X",
  quick:[
   "Three views {X}: ==homogenization== (one global culture, e.g. 'McDonaldization' – Ritzer), ==polarization/resistance==, ==hybridization/glocalization== (Robertson)",
   "==Cultural diversity== = UNESCO 2001: 'common heritage of humanity' {X}",
   "Kazakh strategies: ==preservation== (heritage programs), ==adaptation== (new forms), ==promotion== (soft power) {C}",
   "Indicators: Kazakh language & ==Latin script== reform, Q-pop, Nomad Games, UNESCO lists {X}{C}"
  ],
  deep:`<p class="note">Prepared from the lecture concepts of Week 7 {L} plus external sources {X} and analysis {C}.</p>
<h4>Globalization and culture – three scenarios {X}</h4>
<table class="tbl"><tr><th>Scenario</th><th>Idea</th><th>Kazakh example {C}</th></tr>
<tr><td><b>Cultural homogenization</b></td><td>Global (often Western/American) mass culture makes cultures uniform – "McDonaldization" (George Ritzer, 1993); the lecture: "blurring of boundaries… tendency toward uniformity" {L}</td><td>Global brands, English slang, Hollywood films dominate youth culture</td></tr>
<tr><td><b>Polarization / resistance</b></td><td>Local cultures defend themselves, sometimes through closed nationalism</td><td>Calls to limit foreign content</td></tr>
<tr><td><b>Hybridization / glocalization</b></td><td>Global and local mix into new forms (Robertson) {L}</td><td>Q-pop; ethno-jazz with dombra; Kazakh-language rap; Nauryz in shopping malls</td></tr></table>
<h4>Key concepts</h4>
<ul><li><b>Cultural diversity</b> – UNESCO 2001 declaration: diversity is "as necessary for humankind as biodiversity is for nature" {X}.</li>
<li><b>Cultural preservation</b> – protecting heritage (Madeni Mura, UNESCO lists, museums).</li>
<li><b>Cultural adaptation</b> – changing forms while keeping meanings (e.g. digital museums, modern weddings with betashar).</li>
<li><b>National identity</b> – citizens' identification with traditions, values and the state {L}.</li>
<li><b>Multiculturalism</b> – Kazakhstan has more than 100 ethnic groups {X}; the Assembly of People of Kazakhstan (1995) {X}.</li></ul>
<h4>The future of Kazakh identity – factors {C}</h4>
<ul><li><b>Language</b>: strengthening Kazakh as state language (Law on Languages 1989 → Latin-script reform announced 2017); content creation in Kazakh.</li>
<li><b>Youth and digital culture</b>: memes, TikTok and games can carry Kazakh codes – or replace them.</li>
<li><b>Education</b>: Rukhani Zhangyru, history of Kazakhstan in schools, CQ for a global world.</li>
<li><b>Economy</b>: creative industries and tourism (Nomad Games, UNESCO sites).</li>
<li><b>Openness</b>: Kazakhstan's identity is historically Eurasian and syncretic (Tengrism + Islam + Soviet modernization + globalization) – adaptation is part of tradition.</li></ul>
<p><b>Model thesis</b> {C}: Kazakh identity will survive not by isolation but through <b>conscious glocalization</b>: preserving core values (family, hospitality, respect for elders, language, nomadic memory) while expressing them in new global forms.</p>`,
  must:["Homogenization vs hybridization vs polarization","Glocalization – Robertson","Cultural diversity (UNESCO 2001)","Preservation, adaptation, identity – with Kazakh examples"],
  confused:[["Homogenization","Hybridization","Homogenization = cultures become the SAME. Hybridization = cultures MIX into something new."]],
  traps:["Globalization is not only negative – the best answers show risks AND opportunities."]
 },
 {id:"w10t5", title:"Tradition vs innovation: can they coexist?", src:"X",
  quick:[
   "Tradition = transmitted values, customs, knowledge; innovation = new ideas, technologies, forms {C}",
   "Positions: ==traditionalism== (preserve), ==modernism== (replace), ==synthesis== (coexist) {C}",

   "Risks: loss of authenticity, commercialization, generation gap; benefits: survival, access, youth interest {C}"
  ],
  deep:`<p class="note">An argument-based topic. Prepared from course concepts and examples {C}{X}.</p>
<h4>Key terms</h4>
<ul><li><b>Traditional values</b> – values transmitted between generations: respect for elders, hospitality, family (shanyrak), honour, connection to land.</li>
<li><b>Modernization</b> – transition to industrial/digital society; in Soviet times it was combined with suppression of tradition → hybrid culture (Week 6).</li>
<li><b>Cultural innovation</b> – new forms of creating and transmitting culture.</li>
<li><b>Preservation vs adaptation</b> – keeping forms unchanged vs changing forms to keep meanings alive.</li></ul>
<h4>Examples from Kazakhstan {C}{X}</h4>
<table class="tbl"><tr><th>Tradition</th><th>Innovation</th><th>Result</th></tr>
<tr><td>Museum objects, nomadic artefacts</td><td>3D scans, virtual tours (e-Museum, 700+ 3D)</td><td>Access for all regions and the world</td></tr>
<tr><td>Kazakh language & oral literature</td><td>Kazakh National Corpus (250M words), AI language models</td><td>Language survives in the digital era</td></tr>
<tr><td>Yurt, khan's tent</td><td>Khan Shatyr (Foster) – tent of modern materials</td><td>Nomadic code in modern architecture</td></tr>
<tr><td>Togyzkumalak</td><td>Apps, online tournaments, UNESCO listing (2020), World Nomad Games tournaments</td><td>Interest of youth</td></tr>
<tr><td>Dombra & küy</td><td>Ethno-rock, YouTube channels, Dombra Day flash mobs</td><td>New audiences</td></tr>
<tr><td>Ornaments, national dress</td><td>Ethno-fashion, design, stickers</td><td>Identity in everyday life</td></tr>
<tr><td>Wedding rites (betashar)</td><td>Modern weddings keep betashar with a host and microphone</td><td>Living heritage (UNESCO 2024)</td></tr></table>
<h4>Positive and negative aspects</h4>
<table class="tbl"><tr><th>Positive</th><th>Negative</th></tr>
<tr><td>Traditions survive by staying relevant</td><td>Loss of authenticity, "show" folklore</td></tr>
<tr><td>Technologies preserve fragile heritage</td><td>Commercialization and kitsch</td></tr>
<tr><td>Young people engage with heritage</td><td>Generation gap; superficial knowledge</td></tr>
<tr><td>Global visibility (soft power)</td><td>Homogenization if global formats dominate</td></tr></table>
<h4>How technology supports traditional culture {C}</h4>
<p>Digitization (archives, corpora), 3D/VR reconstruction, online education (dombra lessons), social media promotion, AI translation of epics, crowdfunding for restorations, GIS mapping of sacred sites (Sacred Geography project).</p>
<p><b>Conclusion</b> {C}: Yes – they can coexist when innovation serves the <b>meaning</b> of tradition (values, memory, community) and communities themselves stay the bearers. Kazakh culture is itself a history of coexistence (Tengrism + Islam = syncretism, Week 5).</p>`,
  must:["Define tradition, modernization, innovation, preservation vs adaptation","3+ Kazakh examples of coexistence","Pros and cons","Ways technology supports tradition"],
  confused:[["Preservation","Adaptation","Preservation keeps the FORM; adaptation changes the form to keep the MEANING alive."]],
  traps:["A strong answer gives a clear position + examples + counterarguments."]
 },
 {id:"w10t6", title:"Cultural ecology and the role of nature in national identity", src:"X",
  quick:[
   "==Cultural ecology== – study of how cultures ==adapt to their natural environment==; founder ==Julian Steward== (<i>==Theory of Culture Change==</i>, ==1955==) {X}",
   "Steward's ==culture core== – features most closely linked to subsistence and environment {X}",
   "Kazakh nomadism = ecological adaptation: seasonal pastures ==kystau (winter), koktau (spring), zhailau (summer), kuzeu (autumn)== {X}",
   "==Tört tülik== – four kinds of livestock: horse, camel, cattle, sheep (goat) {X}",
   "Nature in beliefs: ==Tengri (sky), Zher-Su (land-water)== {L}",
   "Modern challenges: ==Aral Sea== crisis, ==Semipalatinsk test site== (1949–1989), steppe degradation, pollution; ==Taza Kazakhstan== {X}{L}"
  ],
  deep:`<p class="note">Prepared from external academic sources {X} and course links {L}.</p>
<h4>Definition {X}</h4>
<p><b>Cultural ecology</b> studies the relationship between a culture and its <b>natural environment</b> – how people adapt their economy, technology, social organization and beliefs to nature. Founder: American anthropologist <b>Julian Steward</b> (<i>Theory of Culture Change</i>, <b>1955</b>). Key idea – the <b>culture core</b>: the features most closely connected with subsistence (how people get food) are shaped by the environment. {X} The term is also used more broadly for "ecology of culture" – protecting the cultural environment like the natural one (Russian scholar D. Likhachev).</p>
<h4>Nature and Kazakh traditional culture {X}{L}{C}</h4>
<ul><li><b>Nomadism</b> (Week 3) is a perfect example of ecological adaptation: seasonal movement prevented overgrazing of the steppe.</li>
<li>Seasonal pastures: <b>kystau</b> (winter camp), <b>koktau</b> (spring), <b>zhailau</b> (summer highland pasture – cf. "yaylak"), <b>kuzeu</b> (autumn).</li>
<li><b>Tört tülik mal</b> – four kinds of livestock (horse, camel, cattle, sheep/goat), each with a patron spirit in folk belief.</li>
<li><b>Beliefs</b>: Tengri (sky) and <b>Zher-Su</b> ("sacred land–water") (Week 3); taboos against pulling up green grass or polluting water; respect for springs and sacred places.</li>
<li><b>Language</b>: horse and camel images in idioms (Week 1).</li>
<li><b>Material culture</b>: the portable yurt from felt and wood; ornaments of horns and plants (koshkar muyiz).</li></ul>
<h4>Nature in national identity {C}</h4>
<p>The steppe ("Uly Dala" – Great Steppe), mountains, the horse, the golden eagle and the snow leopard appear in state symbols (the eagle on the flag; the tulpar horses on the emblem {X}), architecture (Khan Shatyr) and the brand "Great Steppe". Natural UNESCO sites (Saryarka, Western Tien-Shan, Turan deserts) are part of national pride.</p>
<h4>Modern environmental challenges {X}</h4>
<ul><li><b>Aral Sea disaster</b> – Soviet irrigation drained the sea (cf. Nurpeisov's <i>Blood and Sweat</i> about Aral fishermen, Week 6); Kok-Aral dam (2005) partly restored the North Aral.</li>
<li><b>Semipalatinsk nuclear test site</b> (1949–1989, closed 1991) – health and land damage; the Nevada–Semipalatinsk movement (Week 6).</li>
<li>Land degradation, overgrazing near settlements, air pollution in cities, Caspian pollution, saiga mass die-offs (2015).</li>
<li>Responses: <b>Taza Kazakhstan</b> ecological campaign (Week 8), protected areas, "green economy" agenda, EXPO-2017 "Future Energy".</li></ul>`,
  must:["Cultural ecology definition; Julian Steward 1955; culture core","Nomadism as adaptation; kystau/koktau/zhailau/kuzeu; tört tülik","Tengri & Zher-Su; taboos","Aral Sea, Semipalatinsk, Taza Kazakhstan"],
  confused:[["Zhailau","Kystau","Zhailau = SUMMER pasture. Kystau = WINTER camp."]],
  traps:["Cultural ecology was founded by STEWARD, not Hofstede or Oberg."]
 },
 {id:"w10t7", title:"Institutions as carriers of cultural memory", src:"X",
  quick:[
   "==Collective memory== – ==Maurice Halbwachs== (1925): memory is shaped by social groups {X}",
   "==Cultural memory== – ==Jan & Aleida Assmann==: long-term memory stored in texts, rituals, monuments, institutions (vs ==communicative memory== ~80–100 years) {X}",
   "==Lieux de mémoire== (sites of memory) – ==Pierre Nora== {X}",
   "Institutions: ==museums, schools, universities, libraries, archives, cultural organizations, community projects== {C}",
   "Kazakh examples: ==National Museum (Astana)==, ==ALZhIR==, ==National Academic Library==, Central State Archive, ==e-Museum==, e-history.kz, Kazakhfilm, ==Tugan Zher== projects {L}{X}"
  ],
  deep:`<p class="note">Prepared from external theory {X} and course examples {L}.</p>
<h4>Theory {X}</h4>
<ul><li><b>Maurice Halbwachs</b> (French sociologist, <i>The Social Frameworks of Memory</i>, 1925): <b>collective memory</b> – individuals remember within social groups (family, nation, religion).</li>
<li><b>Jan and Aleida Assmann</b>: <b>communicative memory</b> (everyday, oral, about 3 generations / 80–100 years) vs <b>cultural memory</b> (long-term, fixed in texts, rituals, monuments, maintained by institutions and specialists).</li>
<li><b>Pierre Nora</b>: <b>lieux de mémoire</b> – "sites of memory" (places, objects, events) that embody a nation's memory.</li></ul>
<p>{C} Institutions turn fragile communicative memory into lasting cultural memory: they <b>collect, preserve, interpret and transmit</b> (cf. the Week 7 definition of a cultural institution: conservation, interpretation, dissemination {L}).</p>
<table class="tbl"><tr><th>Institution</th><th>How it carries memory</th><th>Examples from Kazakhstan</th></tr>
<tr><td><b>Museums</b></td><td>Keep and exhibit objects; narrate history; virtual tours</td><td>National Museum of the RK (Astana, opened 2014 {X}), Central State Museum (Almaty), Kasteyev State Museum of Arts, <b>ALZhIR</b> memorial (Stalinist repression), Mashhur Zhusip museum {L}, Otrar museum-reserve, e-Museum</td></tr>
<tr><td><b>Schools</b></td><td>Transmit language, history, literature, values to every child</td><td>History of Kazakhstan and Kazakh literature courses; Abai's Words; school museums</td></tr>
<tr><td><b>Universities</b></td><td>Research, interpret and teach heritage; train specialists</td><td>Al-Farabi KazNU, L.N. Gumilyov ENU, AITU (Smart City center, cultural studies course), Institute of Literature named after Auezov</td></tr>
<tr><td><b>Libraries</b></td><td>Store manuscripts and books; give access</td><td>National Academic Library (Astana), National Library (Almaty) – rare books collected in Madeni Mura</td></tr>
<tr><td><b>Archives</b></td><td>Keep documents, photos, films – evidence of the past</td><td>Central State Archive; Archive of the President; Central State Archive of Film, Photo and Sound Recordings; "Archive-2025" returns documents from abroad</td></tr>
<tr><td><b>Cultural organizations</b></td><td>Perform and recreate culture</td><td>Astana Opera, Abai Opera theatre, Kazakhfilm (film archive), Kurmangazy Orchestra, Tselinny Center {L}</td></tr>
<tr><td><b>Local community projects</b></td><td>Memory of villages, families, local heroes</td><td>"Tugan Zher" (Rukhani Zhangyru): local history books, restoring mausoleums; shezhire (genealogy) projects; Sacred Geography map</td></tr></table>
<h4>Memory between generations {C}</h4>
<p>Traditionally memory was carried by <b>zhyraus and akyns</b> (oral code, Week 2/5) and by the custom of knowing <b>seven generations</b> (zheti ata). Today institutions and digital platforms take over this role; the danger is that memory becomes "stored" but not "lived" – so schools, families and communities must keep using it (rituals, holidays, storytelling).</p>`,
  must:["Halbwachs – collective memory (1925)","Assmann – cultural vs communicative memory","Nora – lieux de mémoire","Role of each institution + Kazakh example"],
  confused:[["Collective memory (Halbwachs)","Cultural memory (Assmann)","Halbwachs = memory is SOCIAL. Assmann = LONG-TERM memory in texts/monuments/institutions (vs communicative)."],["Communicative memory","Cultural memory","Communicative = everyday, oral, ~80–100 years. Cultural = institutionalized, centuries."]],
  traps:["'Lieux de mémoire' is Pierre NORA."]
 }
 ]
}
);

S(6,"w6t5","short",3,"Describe the main stages of the formation and development of Kazakh cinema in the Soviet period.",[["1929","vostokkino"],["1934","newsreel"],["amangeldy","1938"],["mosfilm","lenfilm","evacuat","war"],["kazakhfilm","1960"],["aimanov","begalin","khodzhikov","karsakbayev"],["ideology","identity"]],"Cinema began with the Vostokkino studio (1929) and the Alma-Ata newsreel studio (1934). 'Amangeldy' (1938) was the first feature film on a Kazakh theme (E. Umurzakov). In WWII Mosfilm and Lenfilm were evacuated to Almaty (1941–44), creating the Central United Film Studio and training local film-makers. In 1960 the studio became Kazakhfilm; the 1950s–70s were a 'golden age' with directors Aimanov (Our Dear Doctor), Begalin (Song of Manshuk), Khodzhikov (Kyz Zhibek), Karsakbayev (My Name is Kozha). Cinema promoted Soviet ideology but also developed Kazakh identity; in 1984 Kazakhfilm was named after Aimanov.");

S(7,"w7t3","compare",2,"Explain the difference between IQ, EQ and CQ.",[["iq","cognitive","test","age"],["eq","emotion"],["cq","intercultural","cultures"]],"IQ is a score from standardized tests measuring cognitive abilities relative to one's age group; EQ is the ability to manage one's own emotions and understand others' emotions; CQ is the capability to function effectively in intercultural contexts. A person can have high IQ and EQ at home but still misread cultural signals abroad – CQ is specific to cultural diversity.");

S(8,"w8t2","apply",3,"Explain, with at least two examples, how Astana's architecture reflects Kazakhstan's cultural identity.",[["baiterek","tree","egg"],["khan shatyr","tent","nomad"],["palace","pyramid","peace","religion","toleran"],["mangilik","arch","eternal"],["identity","code","symbol"]],"Astana's buildings translate cultural codes into modern forms. Baiterek (golden egg on the Tree of Life) uses Turkic myth to symbolize rebirth and the new capital; Khan Shatyr reinterprets the nomadic khan's tent in modern materials; the Palace of Peace and Reconciliation expresses interfaith harmony and multi-ethnic tolerance; the Mängilik El arch (2011) expresses the 'Eternal Country' idea. Together they show identity balancing tradition and globalization.");

S(8,"w8t5","short",3,"Can Kazakhstan's growing IT and digital creative industries preserve national culture while competing in the global market? Give arguments for both sides and a conclusion.",[["glocal","adapt","local"],["homogeniz","uniform","global format","english"],["game","cinema","film","music","ai"],["identity","preserv","heritage"],["econom","market","compet"],["conclu","balance","therefore","yes"]],"FOR: technology lowers barriers to reach global audiences; glocal products with authentic nomadic/Silk Road stories sell; IT growth funds culture (Astana Hub, games, cinema like 'Tomiris', music like Dimash, Kazakh AI models); digital preservation provides raw material. AGAINST: pressure to adopt global formats and English (homogenization), commercialization and stereotypes, small market and brain drain, dependence on foreign platforms. CONCLUSION: possible through a glocal strategy – global technology + local content, state support for Kazakh-language content and heritage data, education linking IT and humanities.");

S(9,"w9t4","short",3,"What was the Digital Kazakhstan state program? Describe its goals, directions and one achievement and one limitation, distinguishing it from earlier and later initiatives.",[["2017","2018","2022"],["standard of living","economy","productivity"],["digital state","e-gov","government"],["silk road","infrastructure"],["human capital","literacy"],["innovat","ecosystem","start"],["divide","security","rural","limitation"],["2006","2023","2029","concept"]],"Approved in Dec 2017 (Decree No. 827) for 2018–2022, it aimed to raise every citizen's standard of living and economic productivity through digital technology. Five directions: digitalization of economic sectors, transition to a digital state, Digital Silk Road (infrastructure), human capital development, innovative ecosystem (17 initiatives, 120 projects). Achievement: most public services online via eGov (top-25 UN e-government ranking). Limitation: digital divide in rural areas and cybersecurity/data-leak risks. It followed the e-government program (eGov.kz 2006) and was succeeded by the Concept of Digital Transformation, ICT and Cybersecurity 2023–2029.");

S(9,"w9t5","apply",3,"Identify three barriers women face in the IT sector and propose a concrete policy or practice for each, with reference to Kazakhstan.",[["stereotyp"],["pay gap","salary","earn"],["glass ceiling","leadership","senior"],["family","childcare","balance"],["mentor","club","tech girls","techno women","program"],["bias","ai"]],"Barriers: stereotypes from school ('IT is for boys') → girls' coding clubs like Tech Girls and role models (Ada Lovelace, local founders); pay gap → salary transparency and equal-pay audits; glass ceiling → mentoring and women-in-leadership programs (Techno Women, Astana Hub support); work–family balance → flexible/remote work and childcare; biased AI hiring tools → red-teaming and audits (UNESCO playbook).");

S(10,"w10t1","short",2,"What were the main goals and achievements of the Cultural Heritage (Madeni Mura) program?",[["2004"],["restor","monument"],["archaeolog"],["manuscript","archive","document"],["identity","memory"],["aisha","arystan","babalar","5,000","5000","10,000"]],"Adopted in 2004 on Nazarbayev's initiative (first such program in the CIS), with stages 2004–06, 2007–09, 2009–11. Goals: study, restore and preserve historical-cultural heritage, revive traditions, promote heritage and strengthen national identity. Achievements: restoration of dozens of monuments (Aisha Bibi, Arystan Bab mausoleums), archaeological research, acquisition of about 5,000 manuscripts at first and later 10,000+ archival records from abroad (most from China), publication of the 100-volume 'Babalar Sözi'.");

S(10,"w10t3","short",2,"Why are national sports considered cultural heritage? Use at least three Kazakh examples.",[["nomad","horse","history","origin"],["kokpar","kyz kuu","audaryspak","baiga","kuresi","asyk","togyz"],["identity","values","courage"],["generation","transmi","children","elder"],["nomad games","unesco","preserv"]],"They grew out of nomadic life (horse riding, herding, war training) and carry values like courage, honour and teamwork; they are transmitted between generations at toi and holidays. Examples: kokpar, kyz kuu, audaryspak, kazakh kuresi (UNESCO 2016), asyk atu (2017), togyzkumalak (2020). Today they are preserved through federations, schools, UNESCO lists and the World Nomad Games (Astana 2024).");

S(10,"w10t4","short",3,"Discuss globalization and the future of Kazakh cultural identity using the terms homogenization, glocalization and cultural preservation.",[["homogeniz","uniform"],["glocal","hybrid","robertson"],["preserv","heritage","unesco","madeni"],["identity"],["language","kazakh"],["example","q-pop","nomad games","e-museum","dimash"]],"Globalization can homogenize culture (global brands, English), but also enables glocalization – mixing global forms with Kazakh content (Q-pop, ethno-music, Nomad Games). Cultural preservation (Madeni Mura, UNESCO lists, e-Museum) protects the core. The future of Kazakh identity depends on conscious glocalization: keeping core values and the Kazakh language while expressing them in new global forms.");
S(10,"w10t5","apply",3,"Can tradition and innovation coexist in national culture? Take a position and support it with Kazakh examples and a counterargument.",[["tradition"],["innovat","technolog","modern"],["e-museum","corpus","togyz","khan shatyr","dombra","betashar","3d"],["however","but","risk","although","commerc","authentic"],["coexist","yes","balance"]],"Yes: when innovation serves the meaning of tradition. Examples: e-Museum 3D exhibits, the Kazakh National Corpus, togyzkumalak apps and its UNESCO listing, Khan Shatyr as a modern tent, betashar in modern weddings. Counterargument: commercialization and loss of authenticity, generation gap. Conclusion: coexistence is possible if communities stay the bearers of tradition.");

S(10,"w10t6","short",2,"Explain the role of nature in Kazakh national identity using the concept of cultural ecology.",[["steward","adapt","environment"],["nomad","season","pasture","zhailau"],["tengri","zher-su","sacred"],["steppe","horse","eagle"],["aral","semipalatinsk","ecolog","taza"]],"Cultural ecology (Julian Steward) studies how culture adapts to the environment. Kazakh nomadism was an adaptation to the steppe: seasonal pastures (kystau, koktau, zhailau, kuzeu), four kinds of livestock, the portable yurt. Beliefs in Tengri and Zher-Su made land and water sacred. Nature (steppe, horse, eagle) appears in symbols and identity. Modern challenges – the Aral Sea, the Semipalatinsk test site – and responses like Taza Kazakhstan show the link between environment and culture today.");
M(10,"w10t7","people",2,"The concept of 'collective memory' (1925) belongs to…",["Maurice Halbwachs","Pierre Nora","Jan Assmann","Julian Steward"],"Halbwachs.");

M(10,"w10t7","compare",3,"According to the Assmanns, everyday oral memory spanning about 80–100 years is…",["communicative memory","cultural memory","collective unconscious","digital memory"],"Cultural memory = long-term, institutional.");
S(10,"w10t7","short",2,"How do institutions preserve and transmit cultural memory between generations? Give Kazakh examples.",[["museum"],["school","universit","education"],["librar","archive"],["preserv","collect","store"],["transmit","generation","teach"],["alzhir","national museum","e-museum","national library","tugan zher","archive"]],"Institutions collect, preserve, interpret and transmit memory: museums (National Museum in Astana, ALZhIR memorial, e-Museum) exhibit objects and narratives; schools and universities teach language, history and literature; libraries and archives (National Academic Library, Central State Archive, Archive-2025) keep documents; cultural organizations (opera, Kazakhfilm) perform heritage; local projects (Tugan Zher) keep village memory. They turn short communicative memory into long-term cultural memory (Assmann).");

/* ---------- ATTEMPTS, MASTERY, WEIGHTING ---------- */
const Att={
 rec(item,correct,chosen){const id=item.id;const a=S.att[id]||{c:0,w:0,s:0,h:""};
  if(correct){a.c++;a.s++;}else{a.w++;a.s=0;}a.l=Date.now();a.h=(a.h+(correct?"1":"0")).slice(-6);S.att[id]=a;S.answered++;
  if(!correct){S.redo[id]=1;if(item.card&&S.srs[item.card])SRS.bump(item.card);
   if(chosen!=null&&item.o){const A=item.o[item.a],B=chosen;if(A!==B){const k=[A,B].sort().join(" ⟷ ");const cf=S.conf[k]||{n:0,q:[]};cf.n++;cf.a=A;cf.b=B;if(!cf.q.includes(id))cf.q.push(id);cf.l=Date.now();S.conf[k]=cf;}}}
  else if(a.s>=2) delete S.redo[id];
  Daily.bump("q");if(correct)Daily.bump("qc");logActivity(correct?(item.d>=3?15:10):2);},
 strength(id){const a=S.att[id];if(!a)return 0;const h=a.h||"";let w=0,t=0;for(let i=0;i<h.length;i++){const wt=i+1;t+=wt;if(h[i]==="1")w+=wt;}let st=t?w/t:0;if(a.s>=3)st=Math.min(1,st+.1);return st;},
 weight(item){const a=S.att[item.id];if(S.redo[item.id])return 4;if(!a)return 1.6;const since=(Date.now()-(a.l||0))/DAY;const base=1/(1+a.s*a.s);return base*(0.6+Math.min(since,7)/7);}
};
function weightedPick(pool,n){const out=[];const arr=pool.map(it=>({it,w:Att.weight(it)}));while(out.length<n&&arr.length){const tot=arr.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;let i=0;for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}i=Math.min(i,arr.length-1);out.push(arr[i].it);arr.splice(i,1);}return out;}
function interleave(list){const by={};list.forEach(x=>(by[x.w]=by[x.w]||[]).push(x));const ks=shuffle(Object.keys(by));const out=[];let added=true;while(added){added=false;for(const k of ks){if(by[k].length){out.push(by[k].shift());added=true;}}}return out;}

/* Mastery of a scope = average strength over all items + cards in scope (unseen count 0) */
function scopeItems(f){return ITEMS.filter(f);}function scopeCards(f){return CARDS.filter(f);}
function mastery(fItem,fCard){const its=scopeItems(fItem),cs=fCard?scopeCards(fCard):[];const n=its.length+cs.length;if(!n)return{m:0,seen:0,n:0,acc:null,status:"Not Started"};
 let sum=0,seen=0,cor=0,tot=0;its.forEach(i=>{const a=S.att[i.id];if(a){seen++;cor+=a.c;tot+=a.c+a.w;}sum+=Att.strength(i.id);});cs.forEach(c=>{if(S.srs[c.id])seen++;sum+=SRS.strength(c.id);});
 const m=sum/n;const acc=tot?cor/tot:null;let status="Not Started";
 if(seen){status=m>=.85?"Mastered":m>=.6?"Almost Mastered":(acc!=null&&acc<.6&&tot>=4)?"Needs Revision":m>=.35?"Needs Revision":"Learning";if(status==="Mastered"&&acc!=null&&acc<.7)status="Almost Mastered";}
 return{m,seen,n,acc,status};}

   shuffle(tps).slice(0,Math.max(0,N-2)).forEach(tp=>{let c=ITEMS.filter(i=>i.tp===tp&&!i.gen&&i.t!=="s"&&types.includes(i.t));if(!c.length)c=ITEMS.filter(i=>i.tp===tp&&types.includes(i.t));take(weightedPick(c,1)[0]);});}
  const extras=[];if(types.includes("match")){const m=makeMatch(W);if(m)extras.push(m);}if(types.includes("order"))extras.push(makeOrder(W,5));
  const room=N-base.length-extras.length;const mix={m:.5,tf:.12,f:.1,s:.1,x:.08,who:.1};const qt=types.filter(t=>mix[t]);const tot=qt.reduce((s,t)=>s+mix[t],0)||1;
  qt.forEach(t=>{const want=Math.max(0,Math.round(room*mix[t]/tot));weightedPick(ITEMS.filter(i=>inW(i)&&i.t===t&&!used.has(i.id)),want).forEach(take);});
  const need=N-extras.length-base.length;if(need>0)weightedPick(ITEMS.filter(i=>inW(i)&&!used.has(i.id)&&types.includes(i.t)),need).forEach(take);
  return shuffle(base.slice(0,N-extras.length).concat(extras));}
};
