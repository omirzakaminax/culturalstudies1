<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultural Studies – Learning & Exam Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN SYSTEM ===================== */
:root{
 --bg:#faf8f5; --bg2:#f3f0eb; --surface:#ffffff; --surface2:#f8f6fc; --line:#e9e4ef; --line2:#ddd5ea;
 --ink:#221d2e; --ink2:#4b4458; --muted:#7a7287;
 --p50:#f5f2fe; --p100:#ebe4fd; --p200:#d9ccfb; --p300:#bfa9f6; --p400:#9d80ee; --p500:#7c5ce0; --p600:#6643c9; --p700:#5233a6; --p800:#3e2780;
 --accent:var(--p500); --accent-ink:#fff;
 --ok:#2f8f5b; --ok-bg:#e8f6ee; --bad:#c2414b; --bad-bg:#fcecee; --mid:#c98a16; --mid-bg:#fdf4e1;
 --gold:#b98a1f; --et:#d4537a; --et-bg:#fdeef3;
 --src-l:#2f6fd0; --src-s:#a2489b; --src-x:#c46a14; --src-c:#2f8f7b;
 --r:18px; --r-sm:12px; --r-xs:8px;
 --sh:0 1px 2px rgba(40,25,80,.04),0 4px 18px rgba(60,35,120,.06);
 --sh2:0 2px 6px rgba(40,25,80,.06),0 14px 40px rgba(60,35,120,.12);
 --grad:linear-gradient(135deg,#7c5ce0 0%,#a77de8 55%,#d78bc0 100%);
 --grad-soft:linear-gradient(135deg,#f3eefe 0%,#fbf3f8 100%);
 --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --serif:"Fraunces","Georgia",serif;
 --side:258px;
 color-scheme:light;
}
[data-theme="dark"]{
 --bg:#14121b; --bg2:#1a1723; --surface:#1e1b28; --surface2:#242031; --line:#2f2a3d; --line2:#3b3450;
 --ink:#eeeaf6; --ink2:#c9c2d8; --muted:#958da6;
 --p50:#221d33; --p100:#2b2342; --p200:#3a2f5c; --p300:#5a468f; --p400:#8a6fe0; --p500:#9b80f0; --p600:#b29cf5; --p700:#c8b8fa; --p800:#ddd2fd;
 --accent:#9277ee; --accent-ink:#fff;
 --ok:#5cc58b; --ok-bg:#16301f; --bad:#f07c84; --bad-bg:#3a1b20; --mid:#e7b04a; --mid-bg:#352a12;
 --et:#f07ca0; --et-bg:#3a1a27;
 --src-l:#6ea2f0; --src-s:#d488cd; --src-x:#eba25c; --src-c:#5cc5ae;
 --sh:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25);
 --sh2:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.4);
 --grad-soft:linear-gradient(135deg,#251f38 0%,#2a1f2e 100%);
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--p600);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:.2em 0 .5em;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:2.05rem} h2{font-size:1.5rem} h3{font-size:1.14rem} h4{font-size:1rem;margin-top:1.1em}
p{margin:.45em 0 .8em}
ul,ol{padding-left:1.25em;margin:.4em 0 .9em}
li{margin:.22em 0}
mark{background:linear-gradient(transparent 52%,var(--p200) 52%);color:inherit;padding:0 .1em;border-radius:2px;font-weight:600}
[data-theme="dark"] mark{background:linear-gradient(transparent 50%,#4b3b7a 50%)}
kbd{font:600 .72em var(--font);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1px 6px;margin-left:6px}
details{border-bottom:1px solid var(--line);padding:.45em 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;list-style:none;font-weight:500;padding-right:22px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:2px;top:-1px;color:var(--p500);font-weight:700;font-size:1.1em}
details[open] summary::after{content:"–"}
details>*:not(summary){margin-top:.4em}
hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:1.1rem;box-shadow:0 6px 18px rgba(124,92,224,.35)}
.brand b{font-family:var(--serif);font-size:1.02rem;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.75rem}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:11px;color:var(--ink2);font-weight:500;font-size:.93rem;transition:background .15s,color .15s}
.nav a:hover{background:var(--p50);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--p100);color:var(--p700);font-weight:600}
.nav a .ni{width:22px;text-align:center;color:var(--p500);font-size:.95rem;flex-shrink:0}
.nav a.etnav{background:var(--et-bg);color:var(--et);font-weight:600;margin:4px 0}
.nav a.etnav .ni{color:var(--et)}
.nav a.etnav.on{box-shadow:inset 0 0 0 1.5px var(--et)}
.nav .nb{margin-left:auto;font-size:.7rem;background:var(--p500);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.side-foot .lvl{display:flex;justify-content:space-between;margin-bottom:5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:0;font-size:1.4rem;color:var(--ink);cursor:pointer;padding:4px 8px}
.sbox{position:relative;flex:1;max-width:520px}
.sbox input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem;outline:none;transition:border .15s,box-shadow .15s}
.sbox input:focus{border-color:var(--p400);box-shadow:0 0 0 4px color-mix(in srgb,var(--p300) 30%,transparent)}
.sbox .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh2);max-height:62vh;overflow:auto;padding:6px;display:none}
.sres.on{display:block}
.sres a{display:block;padding:8px 10px;border-radius:9px;color:var(--ink)}
.sres a:hover,.sres a.hl{background:var(--p50);text-decoration:none}
.sres .sk{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--p600);font-weight:700;margin-right:6px}
.sres .ss{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill.resume{background:var(--et-bg);color:var(--et);border-color:transparent;cursor:pointer}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:1rem}
.iconbtn:hover{border-color:var(--p300)}
#view{padding:28px 32px 70px;max-width:1180px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);margin-bottom:18px}
.card.link{transition:transform .15s,box-shadow .15s,border-color .15s;color:inherit;display:block}
.card.link:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--p200);text-decoration:none}
.card h3:first-child{margin-top:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--p600);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead{font-size:1.05rem;color:var(--ink2);max-width:760px}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid2>.card,.grid3>.card{margin-bottom:0}
.grid2,.grid3{margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 .9rem var(--font);cursor:pointer;transition:all .15s;text-decoration:none!important;white-space:nowrap}
.btn:hover{border-color:var(--p300);background:var(--p50)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.primary:hover{background:var(--p600);border-color:var(--p600)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--p50);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:9px}
.btn.big{padding:13px 24px;font-size:1rem;border-radius:13px}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;background:var(--p50);color:var(--p700);font-size:.74rem;font-weight:600;border:1px solid var(--p100);white-space:nowrap}
.chip.hard{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.big{font-size:.9rem;padding:5px 12px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink);font:inherit;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p400);box-shadow:0 0 0 4px color-mix(in srgb,var(--p300) 28%,transparent)}
.inp.sm{width:auto;padding:6px 10px;font-size:.88rem}
.inp.big{font-size:1.15rem;padding:13px 15px}
textarea.inp{resize:vertical;line-height:1.55}
select.inp{cursor:pointer}
input[type=range]{accent-color:var(--p500);width:220px}
input[type=date],input[type=number]{background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit}
.tbl{width:100%;border-collapse:collapse;margin:.5em 0 1em;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface2)}
.tbl tr:last-child td{border-bottom:0}
.tbl.small{font-size:.86rem}
.deep .tbl,.deep table{display:block;overflow-x:auto}
.note{background:var(--p50);border:1px solid var(--p100);border-left:4px solid var(--p400);border-radius:var(--r-sm);padding:12px 16px;margin:0 0 18px;font-size:.92rem;color:var(--ink2)}
.tip{background:var(--mid-bg);border-radius:var(--r-sm);padding:10px 14px;margin:10px 0;font-size:.9rem}
.warn,.warn-inline{color:var(--bad);font-weight:600}
.warnline{color:var(--et)}
.bad{color:var(--bad)} .ok{color:var(--ok)}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font:600 .85rem var(--font);color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--p700);box-shadow:var(--sh)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 20px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:11px 15px;font:600 .9rem var(--font);color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--p600);border-bottom-color:var(--p500)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.wchip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:99px;padding:5px 12px;font:600 .8rem var(--font);cursor:pointer;transition:all .12s}
.wchip:hover{border-color:var(--p300)}
.wchip.on{background:var(--p500);border-color:var(--p500);color:#fff}
.wchip.et:not(.on){border-color:color-mix(in srgb,var(--et) 45%,transparent)}
.wchip.all,.wchip.et2{background:transparent;border-style:dashed}
.wchip.et2{color:var(--et);border-color:var(--et)}
.tools{display:flex;flex-direction:column;gap:10px}
.tools .row{margin:0}
.tools .inp{max-width:420px}

/* ---------- source badges & status ---------- */
.src{display:inline-block;font:700 .64rem var(--font);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:5px;vertical-align:1px;margin:0 2px;border:1px solid currentColor;opacity:.9;cursor:help;white-space:nowrap}
.src-l{color:var(--src-l)} .src-s{color:var(--src-s)} .src-x{color:var(--src-x)} .src-c{color:var(--src-c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.78rem;color:var(--muted);margin:0 0 16px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.legend .src{margin-right:-8px}
.stb{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st0{background:var(--bg2);color:var(--muted)} .st1{background:#e6effc;color:#2f64b8} .st2{background:var(--bad-bg);color:var(--bad)} .st3{background:var(--mid-bg);color:var(--mid)} .st4{background:var(--ok-bg);color:var(--ok)}
[data-theme="dark"] .st1{background:#1b2840;color:#7eaaf0}
.stb.self{background:var(--p50);color:var(--p600)} .stb.et{background:var(--et-bg);color:var(--et)} .stb.warn{background:var(--mid-bg);color:var(--mid)}

/* ---------- rings & bars ---------- */
.ring{--p:0;--sz:64px;width:var(--sz);height:var(--sz);border-radius:50%;background:conic-gradient(var(--p500) calc(var(--p)*1%),var(--p100) 0);display:grid;place-items:center;position:relative;flex-shrink:0;margin:0 auto}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-weight:700;font-size:.9rem}
.ring.sm{--sz:46px}.ring.sm::before{inset:5px}.ring.sm span{font-size:.72rem}
.ring.big{--sz:96px}.ring.big::before{inset:9px}.ring.big span{font-size:1.25rem;font-family:var(--serif)}
.ring.xl{--sz:132px}.ring.xl::before{inset:11px}.ring.xl span{font-size:1.7rem;font-family:var(--serif)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.bar>div{height:100%;border-radius:99px;background:var(--p400);transition:width .5s ease}
.bar .low{background:var(--bad)} .bar .mid{background:var(--mid)} .bar .hi{background:var(--ok)}
.mrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.mrow:last-child{border-bottom:0}
.mrow>span:first-child,.mrow>a:first-child{flex:0 0 42%;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mrow b{min-width:38px;text-align:right}
.mrow small{color:var(--muted);min-width:34px}
.mini{height:5px;background:var(--p100);border-radius:9px;overflow:hidden;margin-top:6px}
.mini>div{height:100%;background:var(--grad)}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;align-items:center;background:var(--grad-soft);border-color:var(--p100);padding:28px 30px}
.hero h1{font-size:2.3rem;margin-top:.1em}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hstats>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hstats b{font-family:var(--serif);font-size:1.6rem;display:block;line-height:1.1}
.hstats span{font-size:.78rem;color:var(--muted);font-weight:500}
.endbanner{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;color:inherit;border:1.5px solid color-mix(in srgb,var(--et) 40%,transparent);background:linear-gradient(120deg,var(--surface) 30%,var(--et-bg));transition:transform .15s,box-shadow .15s}
.endbanner:hover{text-decoration:none;transform:translateY(-2px);box-shadow:var(--sh2)}
.endbanner .eyebrow{color:var(--et)}
.endbanner h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.wtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:inherit;text-align:center;transition:all .15s}
.wtile:hover{border-color:var(--p300);text-decoration:none;transform:translateY(-2px)}
.wtile.et{border-color:color-mix(in srgb,var(--et) 35%,transparent);background:var(--et-bg)}
.wtile .wn{font-family:var(--serif);font-weight:700;color:var(--p600)}
.wtile.et .wn{color:var(--et)}
.wtile .wt{font-size:.74rem;color:var(--ink2);line-height:1.25;min-height:2.5em}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:20px}
.pagehead>div:first-child{flex:1}
.stat{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat b{font-family:var(--serif);font-size:2rem;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}

/* ---------- roadmap & week ---------- */
.roadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wcard{color:inherit;margin:0;transition:all .15s;display:flex;flex-direction:column}
.wcard:hover{text-decoration:none;transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--p200)}
.wcard.et{border-top:4px solid var(--et)}
.wch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wch .ring{margin:0}
.wbig{font-family:var(--serif);font-size:2.6rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.wcard .row{margin-top:auto}
.sticky-tools{position:sticky;top:62px;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0;margin:0 0 6px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.toc a{font-size:.84rem;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;color:var(--ink2)}
.toc a:hover{border-color:var(--p300);text-decoration:none;color:var(--p700)}
.topic{scroll-margin-top:130px}
.topic .th{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.topic .tha{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.topic h3{font-size:1.32rem}
.quick{list-style:none;padding:0}
.quick li{position:relative;padding:7px 0 7px 22px;border-bottom:1px dashed var(--line)}
.quick li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--p300)}
.quick li:last-child{border-bottom:0}
.deep{font-size:.98rem}
.deep h4{color:var(--p700);font-size:1.05rem;margin-top:1.3em;padding-top:.3em}
.deep h4:first-child{margin-top:.2em}
.box{border-radius:var(--r-sm);padding:12px 16px;margin:14px 0;font-size:.92rem}
.box>b:first-child{display:block;margin-bottom:6px}
.box ul{margin:0}

<script>
var KB={weeks:[]};
;
/* ---- d1_weeks_1_5.js ---- */
/* ===== WEEKS 1–5 =====
 Source tags: {L}=lecture slides, {S}=seminar slides / official seminar instructions,
 {X}=external academic source (researched), {C}=study explanation / memory aid.
 ==text== = must-memorize highlight. */
KB.weeks.push(
{
 id:1, title:"Morphology of Culture. Language of Culture", short:"Morphology & Language of Culture",
 files:["Week 1 Lecture (30 slides)","Week 1 Seminar (21 slides)"],
 goals:["Understand the historical development of the concept of culture","Identify the main forms and structures of culture","Explore how culture is expressed through language"],
 seminarQs:["What is culture? Why is it difficult to define?","Material vs non-material culture","Cultures, subcultures and countercultures","Sapir–Whorf hypothesis","Language of culture as a system of signs","Language of digital culture","Digital youth subcultures and why they matter"],
 topics:[
 {id:"w1t1", title:"The historical development of the concept of culture", src:"L",
  quick:[
   "Culture comes from Latin ==colere== – to inhabit, to cultivate, to honor {L}",
   "==Cicero==: culture = ==\"cultura animi\"== – cultivation of the soul {L}",
   "==Paideia== (Greek) – formation of the citizen in the classical Greek polis {L}",
   "Antiquity: culture = cultivating reason, beauty, measure and justice {L}",
   "Middle Ages (Western Christianity): religion, God, soul, salvation; sacred texts over empirical knowledge {L}",
   "Medieval Islamic culture (==al-Farabi, Ibn Sina, al-Biruni==): unity of religion and everyday life; science, falsafa, medicine, mathematics, astronomy {L}",
   "Renaissance: ==humanism, individualism==, revival of classical ideals {L}",
   "Enlightenment (==Voltaire, Montesquieu, Rousseau==): reason, science, progress; freedom and equality {L}",
   "Culture = internal (values, norms, beliefs); civilization = external (institutions, material achievements) {L}",
   "18th–19th c.: culture equated with civilization → hierarchy of \"cultured\" and \"uncultured\" peoples; today culture is plural {L}",
   "==1871== – E. B. ==Tylor==, <i>Primitive Culture</i>: culture is \"that complex whole…\" {L}",
   "==1952== – ==Kroeber & Kluckhohn==: ==200+ definitions== of culture, 8 types {L}",
   "==1982== – UNESCO ==Mexico Declaration== on Cultural Policies {L}",
   "==Leslie A. White (1900–1975)== introduced cultural studies (culturology) as a scientific field {L}{S}"
  ],
  deep:`<p>The word <b>culture</b> comes from the Latin root <b>colere</b>, which meant <i>to inhabit, to cultivate, or to honor</i>. At first it described the cultivation of land (agri-culture). The Roman orator <b>Cicero</b> moved the idea from the field to the person: philosophy is <b>"cultura animi"</b> – the <i>cultivation of the soul</i>. {L}</p>
<p>In ancient Greece the parallel idea was <b>paideia</b> – the education and formation of a full citizen of the <i>polis</i> (city-state). For the classical world, culture meant cultivating reason, an appreciation of beauty, and a sense of measure and justice. {L}</p>
<h4>How the idea changed by period {L}</h4>
<table class="tbl"><tr><th>Period</th><th>Main idea of culture</th><th>Key names</th></tr>
<tr><td>Classical antiquity</td><td>Cultivation of reason, beauty, measure, justice; paideia</td><td>Cicero</td></tr>
<tr><td>Middle Ages (Western Christianity)</td><td>Religion at the center: God, soul, salvation; overcoming sin; sacred texts over empirical knowledge</td><td>—</td></tr>
<tr><td>Medieval Islamic culture</td><td>Unity of religion and everyday life; Islam shaped social, political, intellectual life; strong science, <i>falsafa</i> (philosophy), medicine, mathematics, astronomy</td><td>al-Farabi, Ibn Sina, al-Biruni</td></tr>
<tr><td>Renaissance</td><td>Humanism and individualism: human dignity, creativity, potential; revival of classical beauty, harmony, reason, secular life</td><td>—</td></tr>
<tr><td>Enlightenment</td><td>Reason and science replace religious dogmatism; freedom, equality, individual rights, social reform</td><td>Voltaire, Montesquieu, Rousseau</td></tr>
<tr><td>XX–XXI centuries</td><td>Diversity of theories and approaches; culture is plural</td><td>Boas, Mead, Turner, Geertz, Dawkins</td></tr></table>
<h4>Culture vs civilization {L}</h4>
<p><b>Culture</b> = the <i>internal</i> dimension of society: values, norms, traditions, beliefs, ethics, ways of life. <b>Civilization</b> = the <i>external</i> expression: institutions, material achievements, arts, social organization. In the 18th–19th centuries "culture" was often equated with "civilization", which created a <b>hierarchy</b> of "cultured" and "uncultured" societies. Today culture is understood as <b>plural and diverse</b>.</p>
<h4>XX–XXI century approaches {L}</h4>
<ul><li><b>Cultural anthropology</b> – Franz <b>Boas</b>, Margaret <b>Mead</b>. Key idea: <b>cultural relativism</b> – we should understand another person's beliefs and behaviors from the perspective of <i>their own</i> culture, not ours.</li>
<li><b>Symbolic theory</b> – Victor <b>Turner</b>, Clifford <b>Geertz</b>. Culture is <b>like a text</b> that must be <i>interpreted</i> through the investigation of symbols.</li>
<li><b>Sociobiological view</b> – Richard <b>Dawkins</b>: <b>memes</b> are the cultural parallel to biological <b>genes</b> (see Week 9, meme culture).</li></ul>
<h4>Definitions of culture</h4>
<p>In <b>1952</b> Alfred L. <b>Kroeber</b> and Clyde <b>Kluckhohn</b> listed <b>more than 200 definitions</b> of culture in <i>Culture: A Critical Review of Concepts and Definitions</i>. They grouped them into types: {L}</p>
<table class="tbl"><tr><th>Type</th><th>Culture is…</th></tr>
<tr><td>Topical</td><td>a list of topics (social structure, religion, economic system…)</td></tr>
<tr><td>Historical</td><td>social heritage / tradition passed from generation to generation</td></tr>
<tr><td>Behavioral</td><td>shared, learned human behavior, a way of life</td></tr>
<tr><td>Normative</td><td>ideals, values, norms, standards for life</td></tr>
<tr><td>Functional</td><td>the way people solve problems and adapt to their environment</td></tr>
<tr><td>Mental</td><td>a complex of ideas or learned habits that distinguish people from animals</td></tr>
<tr><td>Structural</td><td>patterned and interrelated ideas, symbols or behaviors</td></tr>
<tr><td>Symbolic</td><td>arbitrarily assigned meanings shared by a society</td></tr></table>
<p><b>Classic definition</b> – Sir Edward Burnett <b>Tylor</b> (1832–1917), English anthropologist, <i>Primitive Culture</i> (<b>1871</b>): culture is "that complex whole which includes knowledge, belief, art, law, morals, custom, and any other capabilities and habits acquired by man as a member of society." {L}</p>
<p><b>UNESCO, 1982 Mexico Declaration on Cultural Policies</b>: culture is the distinct <b>spiritual, material, intellectual and emotional</b> features characterizing a society; it includes arts, lifestyles, human rights, value systems, traditions and beliefs. {L}</p>
<p><b>Leslie Alvin White</b> (1900–1975), American anthropologist, introduced the term for culture study as a scientific field (culturology / cultural studies). {L}{S}</p>
<h4>About this course {S}</h4>
<p>Lecturer: <b>Alzhanova Gaukhar Mirzhanovna</b>. The course studies national culture within global culture and civilization: structure of culture, language of culture, cultural semiotics, anatomy of culture, and the history of culture in Kazakhstan from ancient times to today. Its goal is linked to the state program <i>"Looking to the future: modernization of public consciousness"</i>. Grading: <b>Total = Midterm 30% + Endterm 30% + Final Exam 40%</b>; midterm and endterm each = assignment 50% + lecture quizzes 20% + MCQ quiz 30%. Assessments are paper-based.</p>`,

 {id:"w1t2", title:"Morphology of culture: structure, forms and types", src:"L",
  quick:[
   "==Morphology of culture== – branch of cultural studies analyzing the structure, forms and typology of culture {L}",
   "==Values== – ideas about what in life seems important {L}",
   "==Norms== – expectations of how people will behave in different situations {L}",
   "==Sanctions== – mechanisms of social control {L}",
   "==Subculture== – group with distinct values/norms at variance with mainstream; offers \"maps of meaning\" (==Barker==) {L}",
   "==Counterculture== – values and mores that run counter to established society (e.g. ==Voluntary Human Extinction Movement==) {L}",
   "Folk = traditional customs, oral traditions, crafts; Mass = commercial, media-driven; Elite (high) = for a smaller educated audience {L}",
   "Ecological culture = sustainable living, climate activism; Digital culture = digital communication, AI tools, online art, virtual museums {L}",
   "Material culture (objects) vs spiritual / non-material culture (ideas, values, beliefs) {L}{S}"
  ],
  deep:`<p><b>Morphology of culture</b> is the branch of cultural studies that analyzes the <b>structure, forms and typology</b> of culture as a social phenomenon. {L}</p>
<h4>Elements of culture {L}</h4>
<ul><li><b>Values</b> – ideas about what in life seems important (family, honor, freedom).</li>
<li><b>Norms</b> – expectations of how people will behave in different situations (greeting elders first).</li>
<li><b>Sanctions</b> – mechanisms of social control: rewards and punishments that make people follow norms.</li></ul>
<h4>Material vs non-material (spiritual) culture {L}{S}</h4>
<p><b>Material culture</b> = physical objects people make and use (a yurt, a dombra, a smartphone). <b>Non-material / spiritual culture</b> = ideas, values, beliefs, language, norms, knowledge. Example {C}: a <i>dombra</i> is material culture; the <i>küy</i> tradition and its meaning are spiritual culture.</p>
<h4>Subculture and counterculture {L}{S}</h4>
<p><b>Subculture</b> (Chris <b>Barker</b>, <i>Cultural Studies</i>): groups of persons who share distinct values and norms held to be at variance with the dominant or mainstream society. Subcultures offer <b>"maps of meaning"</b> which make the world intelligible to their members. Merriam-Webster: an ethnic, regional, economic or social group with characteristic patterns of behavior that distinguish it within an embracing culture. Examples: gamers, K-pop fandom, skaters.</p>
<p><b>Counterculture</b>: a culture with values and mores that <b>run counter</b> to those of established society. The lecture example is the <b>Voluntary Human Extinction Movement</b> – an environmental movement that calls on all people to stop reproducing so that humankind gradually and voluntarily disappears. {L}</p>
<p class="tip">{C} Memory key: a SUBculture lives <i>under</i> the main culture (different but coexisting); a COUNTERculture goes <i>against</i> it (rejects its core values).</p>
<h4>Forms of culture by audience {L}</h4>
<table class="tbl"><tr><th>Form</th><th>Description</th><th>Example {C}</th></tr>
<tr><td>Folk culture</td><td>Traditional customs, oral traditions, crafts</td><td>Aitys, felt-making, folk tales</td></tr>
<tr><td>Mass culture</td><td>Commercial, media-driven cultural products</td><td>Pop hits, blockbuster films, TikTok trends</td></tr>
<tr><td>Elite (high) culture</td><td>Artistic / intellectual expressions for a smaller educated audience</td><td>Opera, classical music, avant-garde art</td></tr>
<tr><td>Ecological culture</td><td>Sustainable living, climate activism</td><td>"Taza Kazakhstan" clean-up campaigns (Week 8)</td></tr>
<tr><td>Digital culture</td><td>Digital communication, AI tools, online art, virtual museums</td><td>e-Museum, memes, AI art</td></tr></table>`,
  must:["Morphology = structure, forms, typology of culture","Values / Norms / Sanctions definitions","Subculture (Barker, 'maps of meaning') vs counterculture (runs counter)","Voluntary Human Extinction Movement = counterculture example","Folk / Mass / Elite / Ecological / Digital"],
  confused:[["Subculture","Counterculture","Sub = different but inside mainstream; Counter = actively opposes mainstream values."],["Norms","Sanctions","Norms = expected behavior; Sanctions = control mechanisms (reward/punishment) that enforce norms."],["Mass culture","Folk culture","Mass = commercial & media-driven; Folk = traditional, oral, crafts."]],
  traps:["'Maps of meaning' describes SUBcultures (Barker), not countercultures.","Morphology studies STRUCTURE and FORMS; 'anatomy of culture' (Week 2) studies the INTERNAL structure – knowledge, values, regulatives."]
 },
 {id:"w1t3", title:"Language of culture. Sapir–Whorf hypothesis. Language of digital culture", src:"L",
  quick:[
   "==Language of culture== – signs, forms, symbols, texts that let people communicate and navigate in the space of culture {L}",
   "==Linguistic relativity (Sapir–Whorf hypothesis)==: structures and words of a language influence how speakers think, behave and the culture itself {L}{S}",
   "Edward ==Sapir== and Benjamin Lee ==Whorf== {L}",
   "Kazakh language: ==genderless==, levels of politeness, rich kinship vocabulary, untranslatable concepts {L}",
   "==Ainalaiyn== – 'let me circle you' – affection & care; ==Bauyrym== – 'my liver' – kinship/closeness {L}",
   "==Qut== – blessing & prosperity; ==Amanat== – sacred trust & responsibility {L}",
   "Horse idioms: 'as tall as a noble horse', 'gold the size of a horse's head', ==üzengiles joldas== – 'stirrup companion' = friend {L}",
   "Digital culture = ==participatory culture== – users consume AND contribute (==Uzelac==) {S}",
   "Digital youth subcultures (Barker): music & digital platforms, ==fan culture==, ==games== {S}"
  ],
  deep:`<p>The <b>language of culture</b> is the set of <b>signs, forms, symbols and texts</b> that allow people to communicate with each other and to <b>navigate in the space of culture</b>. It includes spoken language, but also gestures, clothing, ornaments, rituals and digital symbols such as emoji. {L}</p>
<h4>Sapir–Whorf hypothesis (linguistic relativity) {L}{S}</h4>
<p>"Linguistic relativity: the idea that the structures and words of a language influence how its speakers think, how they behave, and ultimately the culture itself (also known as the Whorf Hypothesis)." Named after the American linguists <b>Edward Sapir</b> and his student <b>Benjamin Lee Whorf</b>. {X} Scholars distinguish a strong version (language <i>determines</i> thought – largely rejected) and a weak version (language <i>influences</i> thought – supported by many studies).</p>
<h4>Kazakh language as a mirror of culture {L}</h4>
<ul><li><b>Genderless</b> – no grammatical gender (one pronoun <i>ol</i> for he/she).</li>
<li><b>Levels of politeness</b> – <i>sen</i> (informal) vs <i>siz</i> (polite).</li>
<li>Rich <b>kinship vocabulary</b> and vocabulary for social interactions (reflects the importance of kinship in nomadic society).</li>
<li><b>Non-translatable cultural concepts</b>: <b>ainalaiyn</b> (literally "let me circle you") – affection and care; <b>bauyrym</b> (literally "my liver") – kinship and closeness; <b>qut</b> – blessing and prosperity; <b>amanat</b> – sacred trust and responsibility.</li>
<li><b>Horse and camel images</b> (nomadic way of life in language): <i>arğymaqtai biik</i> "as tall as a noble horse", <i>nardai</i> "like a male camel" (size, strength); <i>at basyndai altyn</i> "gold the size of a horse's head", <i>at töbesindei</i> "as small as a horse's crown" (measure); <i>üzengi qağysyp keledi</i> "their stirrups touch while riding", <i>üzengiles joldas</i> "a stirrup companion" – friendship.</li>
<li><b>Non-verbal communication</b> is also part of the language of culture (gestures, distance, eye contact).</li></ul>
<h4>Language of culture as a system of signs {S}</h4>
<p>Everyday signs – a red flag, traffic signs, emoji – carry meaning only because a culture agrees on it. This prepares Week 2 (semiotics).</p>
<h4>Language of digital culture {S}</h4>
<p>Digital culture is described as a <b>participatory culture</b> where users not only consume information but also <b>contribute</b> in many ways (Uzelac). Its language includes emoji, memes, hashtags, abbreviations and GIFs.</p>
<h4>Digital youth subcultures {S}</h4>
<p>Barker asks: can you think of any contemporary youth culture that exists <i>entirely offline</i>? Key areas: <b>music and new digital delivery platforms</b>, <b>fan culture</b> (e.g. K-pop fandom with light-sticks), and <b>games</b>. They matter because they give young people identity, community and creative participation.</p>`,
  must:["Linguistic relativity = Sapir–Whorf (Whorf) hypothesis","Kazakh: genderless, politeness levels, kinship vocabulary","ainalaiyn, bauyrym, qut, amanat meanings","Digital culture = participatory (Uzelac)","Youth digital subcultures: music platforms, fan culture, games (Barker)"],
  confused:[["Ainalaiyn","Bauyrym","Ainalaiyn = 'let me CIRCLE you' (affection). Bauyrym = 'my LIVER' (kinship/brother)."],["Qut","Amanat","Qut = blessing/prosperity. Amanat = sacred TRUST/responsibility (something entrusted)."]],
  traps:["The hypothesis is LINGUISTIC relativity – not 'cultural relativism' (Boas/Mead).","Bauyrym literally means 'my liver', not 'my heart'."]
 }
 ]
},

 {id:"w2t1", title:"Structuralism and semiotics: Saussure, Peirce, Morris, Kristeva", src:"L",
  quick:[
   "==Structuralism== – studies underlying structures and relationships that create meaning {L}",
   "==Semiotics== – the study ('science') of signs and signification {L}",
   "==Semiotics of culture== – defines culture as human symbolic activity, creation of signs and giving meaning {L}",
   "==Saussure== (European tradition): <i>Course in General Linguistics</i>; uses '==semiology=='; sign = ==signifier + signified== {L}",
   "Signifier = material form (word, sound, image); Signified = concept/meaning {L}",
   "==Peirce== (American pragmatic tradition): meaning through interpretation – ==semiosis==; mental tool = ==interpretant== {L}",
   "Peirce's 3 signs: ==Icon== (similarity – photo), ==Index== (direct connection – smoke→fire), ==Symbol== (learned convention – words, traffic signs) {L}",
   "==Cultural code== – the key to understanding culture; images linked with stereotypes (mentality) {L}",
   "==Charles Morris (1901–1979)== developed Peirce: ==semantics, syntactics, pragmatics== {L}",
   "==Julia Kristeva (b. 1941)==: ==semanalysis== – theory of textual meaning {L}"
  ],
  deep:`<p><b>Structuralism</b> is an approach that studies the <b>underlying structures and relationships</b> that create meaning. <b>Semiotics</b> is the study (or "science") of <b>signs and signification</b>. <b>Semiotics of culture</b> is a research field that defines culture from a semiotic perspective – as a type of human <b>symbolic activity</b>, the creation of signs and a way of giving meaning to everything around. {L}</p>
<h4>Two traditions of semiotics {L}</h4>
<table class="tbl"><tr><th></th><th>Ferdinand de Saussure</th><th>Charles Sanders Peirce</th></tr>
<tr><td>Tradition</td><td>European (structural)</td><td>American (pragmatic)</td></tr>
<tr><td>Term</td><td><b>Semiology</b></td><td><b>Semiotics</b></td></tr>
<tr><td>Focus</td><td>Language as a system</td><td>Meaning develops through interpretation (<b>semiosis</b>), a dynamic process</td></tr>
<tr><td>Model of the sign</td><td>Two parts: <b>signifier + signified</b></td><td>Sign – object – <b>interpretant</b> (the relation is made in the interpreter's mind)</td></tr>
<tr><td>Key work</td><td><i>Course in General Linguistics</i></td><td>Typology: <b>icon, index, symbol</b></td></tr></table>
<p><b>Signifier</b> → the material form (a word, a sound, an image, marks on a page). <b>Signified</b> → the concept / meaning. (Daniel Chandler, <i>Semiotics for Beginners</i>.) {L}</p>
<p class="warn">⚠ Date alert: the lecture slide prints Saussure as "1829–1905". Standard reference dates are <b>1857–1913</b> {X}; his <i>Course</i> was published after his death, in 1916, by his students {X}. If an exam question repeats the slide's dates, be aware of this discrepancy.</p>
<h4>Peirce's three types of signs {L}</h4>
<table class="tbl"><tr><th>Type</th><th>Basis</th><th>Examples</th></tr>
<tr><td><b>Icon</b></td><td>Similarity – resembles what it represents</td><td>Photo, pictogram, portrait, map</td></tr>
<tr><td><b>Index</b></td><td>Direct (physical/causal) connection with its meaning</td><td>Smoke → fire, footprint, thermometer, knock on the door</td></tr>
<tr><td><b>Symbol</b></td><td>Learned convention – no natural connection</td><td>Words, traffic signs, flags, numbers</td></tr></table>
<p class="tip">{C} Mnemonic <b>"I-I-S = Image, Imprint, Settled-by-agreement"</b>: Icon = image (looks like), Index = imprint (caused by), Symbol = settled by agreement (learned).</p>
<h4>Codes and conventional signs {L}</h4>
<p>Signs are organized into sequences that generate meaning through the cultural conventions of their use; such arrangements are called <b>cultural codes</b>. A <b>cultural code</b> is "the key to understanding of culture; a set of images associated with a complex of stereotypes (mentality) in the mind." <b>Conventional signs</b> are created and agreed upon by society and do not resemble their objects (+ − = / %). <b>Cultural symbols</b> carry complex, deep meanings beyond simple signs (e.g. shanyrak).</p>
<h4>Charles Morris (1901–1979) {L}</h4>
<p>Developed Peirce's ideas and divided semiotics into three areas:</p>
<ul><li><b>Semantics</b> – relations between signs and the world of things (what signs mean).</li>
<li><b>Syntactics</b> – how signs relate to <i>other signs</i> (combination rules).</li>
<li><b>Pragmatics</b> – the effects of signs on <i>human behavior</i> (how signs are used).</li></ul>
<p class="tip">{C} "Morris = <b>S-S-P</b>: Sense (semantics), Structure (syntactics), People (pragmatics)."</p>
<h4>Julia Kristeva (born 1941) {L}</h4>
<p>Bulgarian-French theorist. <b>Semanalysis</b> – a theory of textual meaning that studies the signifying activity and its types within the text. {X} She also coined the term <b>intertextuality</b> (every text is built from other texts).</p>`,
  must:["Saussure: semiology; signifier + signified; Course in General Linguistics","Peirce: semiosis, interpretant; icon / index / symbol","Morris 1901–1979: semantics, syntactics, pragmatics","Kristeva b.1941: semanalysis","Cultural code definition"],
  confused:[["Saussure","Peirce","Saussure = European, SEMIOLOGY, 2-part sign (signifier/signified). Peirce = American, SEMIOTICS, 3 types of sign + interpretant."],["Icon","Index","Icon LOOKS LIKE the object (photo). Index is CAUSED BY / physically linked to it (smoke→fire)."],["Index","Symbol","Index has a natural link; Symbol is pure convention (must be learned)."],["Semantics","Pragmatics","Semantics = sign↔thing (meaning). Pragmatics = sign↔people (effect on behavior)."],["Syntactics","Semantics","Syntactics = sign↔sign. Semantics = sign↔world of things."]],
  traps:["Morris developed PEIRCE's ideas, not Saussure's.","'Semanalysis' = Kristeva; 'semiosis' = Peirce. Similar words, different people.","Traffic signs are SYMBOLS in the lecture (learned convention), even though some look pictorial."]
 },
 {id:"w2t2", title:"Textological concepts of culture: Barthes and Suleimenov", src:"L",
  quick:[
   "==Roland Barthes (1915–1980)==, <i>==Mythologies==</i>: ==Denotation → Connotation → Myth== {L}",
   "Denotation = literal, descriptive meaning shared by almost all {L}",
   "Connotation = meanings created by linking signs to wider cultural codes; one sign = many meanings {L}",
   "==Myth== = naturalized connotations accepted as 'normal'; conceptual maps of meaning {L}",
   "Example: Eiffel Tower – denotation: a tower in Paris; connotation: Paris, France, romance, tourism; myth: 'natural' symbol of French culture {L}",
   "==Olzhas Suleimenov== – <i>==AZ i IA==</i> ('I and I' wordplay) {L}",
   "AZ i IA: focuses on <i>==The Tale of Igor's Campaign==</i>; challenges Indo-European linguistics; places Slav and Turk in a shared Eurasian space {L}"
  ],
  deep:`<p>Textological concepts treat <b>culture as a text</b> that can be read and interpreted. {L}</p>
<h4>Roland Barthes (1915–1980) – <i>Mythologies</i> {L}</h4>
<p>Barthes (French semiotician) showed three levels of meaning:</p>
<ol><li><b>Denotation</b> – the descriptive, literal level of meaning shared by virtually all members of a culture.</li>
<li><b>Connotation</b> – meanings generated by connecting signifiers to wider cultural concerns; the association of signs with other cultural codes. <i>A single sign = many meanings.</i></li>
<li><b>Myth</b> – <b>naturalized connotations</b>, accepted as "normal" and "natural"; they act as conceptual maps of meaning by which we make sense of the world.</li></ol>
<table class="tbl"><tr><th>Sign</th><th>Denotation</th><th>Connotation</th><th>Myth</th></tr>
<tr><td>Eiffel Tower</td><td>A tower in Paris</td><td>Paris, France, romance, tourism</td><td>The tower becomes a "natural" symbol of Paris and French culture</td></tr>
<tr><td>Rose</td><td>A flower</td><td>Love, passion, beauty (songs like "White Roses", <i>Titanic</i>)</td><td>Roses "naturally" = romantic love</td></tr>
<tr><td>Baiterek {C}</td><td>A 97 m tower in Astana</td><td>Tree of life, golden egg, new capital</td><td>"Natural" symbol of independent Kazakhstan</td></tr></table>
<p>{X} <i>Mythologies</i> was published in 1957.</p>
<h4>Olzhas Suleimenov – <i>AZ i IA</i> {L}</h4>
<p>Kazakh poet and thinker (born 1936 {X}). The title <i>AZ i IA</i> is a linguistic wordplay: "I and I" (Old Slavic <i>az</i> and modern Russian <i>ya</i> both mean "I"; read together "AZIYA" = Asia {X}). The book:</p>
<ul><li>shows different identities and perspectives – Slavic and Turkic, old and new;</li>
<li>focuses on the Russian epic <b><i>The Tale of Igor's Campaign</i></b>;</li>
<li>challenges traditional Indo-European linguistics and reconsiders the Turkic past;</li>
<li>places Slav and Turk in a <b>shared cultural and historical space – Eurasia</b>.</li></ul>
<p>{X} Published in 1975; it was criticized and banned by Soviet authorities soon after.</p>`,
  must:["Barthes 1915–1980, Mythologies: denotation → connotation → myth","Myth = naturalized connotation","Eiffel Tower example","Suleimenov AZ i IA: 'I and I', Tale of Igor's Campaign, Eurasia"],
  confused:[["Connotation","Myth","Connotation = associated meanings. Myth = when those connotations seem NATURAL/normal and unquestioned."],["Barthes","Kristeva","Barthes = denotation/connotation/MYTH (Mythologies). Kristeva = SEMANALYSIS."]],
  traps:["AZ i IA analyzes the RUSSIAN epic 'Tale of Igor's Campaign', not a Kazakh epic.","Denotation is the LITERAL level – 'a tower in Paris', not 'romance'."]
 },

 {id:"w2t4", title:"Seminar: cultural codes, early religious beliefs, morality, myth", src:"S",
  quick:[
   "Global cultural codes: ==preliterate (traditional) → written (book) → screen → digital== {S}",
   "==Animism== – belief that nature/objects have souls (term from Tylor, 1871) {S}{X}",
   "==Fetishism== – worship of objects with magical power (amulets) {S}{X}",
   "==Totemism== – belief in kinship between a group and an animal/plant ancestor (totem pole) {S}{X}",
   "==Pantheism== – God = nature/universe; ==Deism== – God created the world but does not intervene; ==Monotheism== – one God {S}{X}",
   "Morality vs ethics; ==Golden Rule of Confucius==; ==Kant's categorical imperative== (Formula of Universal Law) {S}",
   "Kant's moral paradox: a murderer at the door asks where your friend is – Kant: do not lie (<i>On a Supposed Right to Lie…</i>) {S}",
   "Myth types: ==creation==, ==foundation (origin)==, ==end-time (eschatological)== {S}"
  ],
  deep:`<h4>1. Types of global cultural codes {S}</h4>
<p>Cultural codes change with the main way of transmitting information:</p>
<table class="tbl"><tr><th>Code</th><th>How culture is transmitted {C}</th></tr>
<tr><td>Preliterate (traditional)</td><td>Oral speech, rituals, ornaments, memory of elders, epics (zhyraus)</td></tr>
<tr><td>Written (book)</td><td>Writing and printed books; linear, reflective reading</td></tr>
<tr><td>Screen</td><td>Cinema, TV – image and sound dominate</td></tr>
<tr><td>Digital</td><td>Internet, social media, AI – interactive, participatory, fast</td></tr></table>
<h4>2. Early forms of religious beliefs {S}{X}</h4>
<table class="tbl"><tr><th>Belief</th><th>Meaning</th><th>Example</th></tr>
<tr><td>Animism</td><td>All natural things and objects have spirits/souls (term popularized by Tylor, <i>Primitive Culture</i>, 1871)</td><td>Spirits of mountains, rivers; Tengrian respect for nature</td></tr>
<tr><td>Fetishism</td><td>Worship of material objects believed to have magical power</td><td>Amulets (Kazakh <i>boytumar</i>, Week 5)</td></tr>
<tr><td>Totemism</td><td>Belief in a mystical kinship between a human group and an animal or plant (totem)</td><td>Tlingit totem pole (Sitka, Alaska); wolf as ancestor in Turkic legend</td></tr>
<tr><td>Pantheism</td><td>God is identical with nature/the universe</td><td>Spinoza's "God or Nature"</td></tr>
<tr><td>Deism</td><td>God created the world but does not intervene; known through reason</td><td>Enlightenment thinkers (Voltaire)</td></tr>
<tr><td>Monotheism</td><td>Belief in one God</td><td>Judaism, Christianity, Islam</td></tr></table>
<h4>3. Morality and its paradoxes {S}</h4>
<p>{X} <b>Morality</b> = the actual norms of good/bad behavior in a society; <b>ethics</b> = the philosophical study (theory) of morality. {S} The <b>Golden Rule</b> (Confucius: "Do not do to others what you do not want done to yourself"); <b>Immanuel Kant's categorical imperative</b> – <i>Formula of Universal Law</i>: "Act only on that maxim through which you can at the same time will that it should become a universal law" – moral rules must apply to everyone in all circumstances.</p>
<p><b>Moral paradox (Kant, "On a Supposed Right to Lie Because of Philanthropic Concerns")</b>: a murderer asks whether your friend is hiding in your house. {X} Kant answered that lying is never permitted, even here – which shows the paradox: following a universal rule can conflict with protecting life.</p>
<h4>4. Symbols and signs in cultural communication {S}</h4>
<p>Exercise: classify images as icon, index or symbol (Peirce). Examples used: the <b>coat of arms of Astana</b>, a Kazakh ornament <b>koshkar muiz</b>, a heart, a clock, a phone icon. Film excerpt: <i>The Da Vinci Code</i>.</p>
<h4>5. Myth as a cultural phenomenon {S}</h4>
<ul><li><b>Creation myths</b> – about the creation of the world.</li>
<li><b>Foundation (origin) myths</b> – about the founding of religions, nations, states.</li>
<li><b>End-time (eschatological) myths</b> – about the end of the world.</li></ul>
<p>Examples shown: Greek myth of Prometheus; Goya's <i>Saturn Devouring His Son</i> (myth of Kronos/Saturn).</p>`,
  must:["4 global codes: preliterate, written, screen, digital","Animism/fetishism/totemism/pantheism/deism/monotheism definitions","Kant: categorical imperative, Formula of Universal Law; murderer-at-the-door","3 myth types: creation, foundation, eschatological"],
  confused:[["Pantheism","Deism","Pantheism: God IS nature. Deism: God MADE the world, then stepped back."],["Fetishism","Totemism","Fetish = magical OBJECT. Totem = ancestral ANIMAL/PLANT of the group."],["Animism","Totemism","Animism = everything has a spirit. Totemism = a group is related to a specific animal/plant."]],
  traps:["Eschatological = END of the world, not origin.","The 'screen' code comes between 'written' and 'digital'."]
 }
 ]
},

 {id:"w3t1", title:"Nomadism as a type of culture: concept, classification, types", src:"L",
  quick:[
   "Three ways of life: ==sedentary (agriculture), nomads, hunter-gatherers== {L}",
   "==Nomadism== – traditional way of life based on ==seasonal mobility== and ==pastoral economy== {L}",
   "Features: extensive pastoralism; recurrent movements of most people & livestock; specific material culture, society and worldview of steppe dwellers {L}",
   "Classification: ==nomadic, semi-nomadic, semi-settled, distant, yaylak== {L}",
   "==Yaylak== – from Turkic 'yaylag' – summer highland pasture {L}",
   "Dwellings: Bedouin tent (bayt al-sha'r), tipi, igloo, ==yurt== {L}",
   "==Shanyrak== – crown of the yurt; a cross within a circle – eternal movement, sun, life, family, unity {L}",
   "==Uyk== – roof poles = rays of the sun {L}",
   "Ornaments: ==koshkar muyiz== (ram's horns – prosperity), ==qus tumsyq== (bird's beak – freedom), ==aishyq gul== (moonflower – cycles of nature) {L}",
   "==Digital nomadism== – remote work + frequent travel; ==Makimoto & Manners==, <i>Digital Nomad</i> {L}"
  ],
  deep:`<p>Three main historical ways of life: <b>sedentary</b> (agriculture), <b>nomadic</b>, and <b>hunter-gatherer</b>. {L}</p>
<p><b>Nomadism</b> is a traditional way of life based on <b>seasonal mobility</b> and a <b>pastoral economy</b>, in which communities move with their livestock in search of pastures. {L}</p>
<h4>Characteristics {L}</h4>
<ul><li>extensive pastoralism as the main economic activity;</li><li>recurrent movements of the majority of the population and livestock;</li><li>a specific material culture, type of society and worldview of steppe dwellers.</li></ul>
<h4>Classification {L}</h4>
<table class="tbl"><tr><th>Type</th><th>Description</th></tr>
<tr><td>Nomadic</td><td>The people move with their cattle and have no settlements as such</td></tr>
<tr><td>Semi-nomadic</td><td>Half of the time (mostly winter) spent settled</td></tr>
<tr><td>Semi-settled</td><td>Half of the people move with the livestock</td></tr>
<tr><td>Distant</td><td>Some of the people stay moving with the cattle (distant-pasture herding)</td></tr>
<tr><td>Yaylak</td><td>From Turkic "yaylag" – summer highland pasture (seasonal mountain herding)</td></tr></table>
<h4>The yurt as a cultural symbol {L}</h4>
<p>The <b>yurt</b> is a portable house that is easy to assemble and disassemble. The <b>shanyrak</b> (crown of the yurt) – a cross within a circle – symbolizes eternal movement in nature, the sun, evolution and development of life, family and unity (it is passed down in the family and appears on the state emblem {X}). The <b>uyk</b> (roof poles) are interpreted as the <b>rays of the sun</b>. Other dwellings shown: Bedouin tent (<i>bayt al-sha'r</i>), North American tipi, igloo.</p>
<h4>Ornaments – symbolic, not only decorative {L}</h4>
<ul><li><b>Koshkar muyiz</b> ("ram's horns") – vitality, prosperity, pastoral life.</li>
<li><b>Qus tumsyq</b> ("bird's beak") – freedom, the celestial sphere.</li>
<li><b>Aishyq gul</b> ("moonflower") – cycles of nature, movement, nomadic perception of time.</li>
<li>Also color symbolism and animal symbolism.</li></ul>
<p><b>The Golden People of Kazakhstan</b> {L} – {X} the "Golden Man" (Altyn Adam) found in the <b>Issyk kurgan</b> (excavated 1969–1970) is a Saka warrior in gold-decorated clothing; it became a national symbol (Independence Monument in Almaty).</p>
<h4>Digital nomadism {L}</h4>
<p>A modern socio-cultural phenomenon in which individuals <b>work remotely</b> using digital technologies while <b>frequently moving</b> between locations. The term comes from <b>Tsugio Makimoto and David Manners</b>, <i>Digital Nomad</i> ({X} 1997). A <b>Digital Nomad Visa</b> is a long-term visa or residence permit that allows foreigners to live legally in a country while working remotely for employers abroad.</p>`,
  must:["Nomadism = seasonal mobility + pastoral economy","Five types incl. yaylak (summer highland pasture)","Shanyrak = cross in circle: sun, eternity, family, unity; uyk = sun rays","Koshkar muyiz / qus tumsyq / aishyq gul","Makimoto & Manners – Digital Nomad"],
  confused:[["Semi-nomadic","Semi-settled","Semi-NOMADIC: half the TIME settled (winter). Semi-SETTLED: half the PEOPLE move."],["Shanyrak","Uyk","Shanyrak = crown (circle with cross). Uyk = roof poles (sun rays)."],["Koshkar muyiz","Qus tumsyq","Ram's horns = prosperity; bird's beak = freedom/sky."]],
  traps:["Yaylak = SUMMER highland pasture (not winter).","Digital nomadism authors are Makimoto & Manners, not Dawkins."]
 },
 {id:"w3t2", title:"Ancient Turkic civilization and Tengrism", src:"L",
  quick:[
   "==Tengrism== – religion of ancient nomads of Eurasia (Turks, Mongols) before Islam {L}",
   "==Tengri== – the Blue Sky, universal supreme deity {L}",
   "==Umai== – female deity, protector of women, children, fertility; also the child's soul & the umbilical cord pouch {L}",
   "==Erlik (Erklig)== – god and ruler of the lower world {L}",
   "==Zher-Su (Yduk Yer-Su)== – 'sacred land–water', principal deity of the middle world {L}",
   "==Kosho-Tsaidam stele==: 'When the blue sky above and the brown earth below were created…' – ancestors ==Bumin Kagan and Istemi Kagan== {L}",
   "Cult of ancestors; hearth & fire purification; Sandyq plateau stone sculptures 9th–11th c. {L}",
   "==Baksy== – shaman, mediator with spirit world, uses the ==kobyz== {L}",
   "Festival: ==The Spirit of Tengri== (contemporary ethnic music) {L}"
  ],
  deep:`<p><b>Tengrism</b> is the religion of the ancient nomads of Eurasia – the Turks and the Mongols; a set of ideas about the world and about life that existed among Turkic peoples <b>before they adopted Islam</b>. {L}</p>
<h4>The pantheon (three worlds) {L}{C}</h4>
<table class="tbl"><tr><th>Deity</th><th>World</th><th>Role</th></tr>
<tr><td><b>Tengri</b></td><td>Upper (sky)</td><td>The Blue Sky – universal supreme deity</td></tr>
<tr><td><b>Umai</b></td><td>Upper / female</td><td>Protector of women, children and fertility. The word also meant the child's soul from birth until it walks and speaks freely, and the umbilical cord, sewn into a pouch and hung on the cradle</td></tr>
<tr><td><b>Zher-Su (Yduk Yer-Su)</b></td><td>Middle (earth)</td><td>"Sacred land–water", principal deity of the middle world</td></tr>
<tr><td><b>Erlik (Erklig)</b></td><td>Lower (underworld)</td><td>God and ruler of the lower world; separated people in death</td></tr></table>
<h4>The Kosho-Tsaidam stele {L}</h4>
<p>The inscription begins: <i>"When the blue sky [Tengri] above and the brown earth below were created, between them a human being was created. Over the human beings, my ancestors <b>Bumin Kagan and Istemi Kagan</b> ruled. They ruled people by Turkish laws…"</i> {X} These are the <b>Orkhon inscriptions</b> (8th century, Mongolia) in honor of Bilge Kagan and Kul Tegin; Bumin founded the First Turkic Khaganate in 552.</p>
<h4>Rituals and practices {L}</h4>
<ul><li><b>Respect for the dead</b>: spirits regarded as ancestors of the family and community; household rites.</li>
<li><b>The hearth</b> has a central role – fire purifies from evil spirits.</li>
<li>Stone sculptures and burial mounds – <b>Sandyq Plateau</b> (Sandyq-3 sculpture, Belsaz-2 burial ground), <b>9th–11th centuries</b>.</li>
<li><b>Baksy</b> – a traditional shaman, mediator between the human world and the spirit world, using ritual, music and the <b>kobyz</b>.</li></ul>
<p>Today: <b>The Spirit of Tengri</b> – contemporary ethnic music festival (spiritoftengri.kz). {L}</p>`,
  must:["Tengri = Blue Sky supreme deity","Umai = women, children, fertility","Erlik = underworld; Zher-Su = sacred land-water (middle world)","Kosho-Tsaidam: Bumin & Istemi Kagan","Baksy + kobyz"],
  confused:[["Umai","Zher-Su","Umai = female protector of children. Zher-Su = land-water, MIDDLE world."],["Erlik","Tengri","Erlik = LOWER world (death). Tengri = UPPER sky."]],
  traps:["Tengrism existed BEFORE Islam among Turks AND Mongols.","Bumin and Istemi are ancestors named on the stele – not Saka thinkers."]
 },
 {id:"w3t3", title:"Saka thinkers: Anacharsis and Toxaris", src:"L",
  quick:[
   "==Anacharsis== – Scythian (Saka) philosopher, one of the ==Seven Sages==; known from ==Diogenes Laërtius== {L}",
   "Anacharsis: 'A view of the unseemly actions of drunken men is the most effectual dissuasive from wine' {L}",
   "Anacharsis: 'My country is a disgrace to me, but you are a disgrace to your country' {L}",
   "==Toxaris== – Scythian who came to Athens ==before Anacharsis==; respected physician, 'the ==Foreign Physician==' {L}",
   "Toxaris – character in ==Lucian==’s dialogue <i>==Toxaris, or Friendship==</i> (with Greek ==Mnesippus==); ==five stories== about friendship {L}",
   "Story: ==Abauchas== saves his friend ==Gyndanes== from a fire instead of his wife and children {L}"
  ],
  deep:`<h4>Anacharsis {L}</h4>
<p>A Scythian (Saka) <b>philosopher</b>, counted among the <b>Seven Sages</b> of ancient Greece. Information about him comes from <b>Diogenes Laërtius</b> ({X} <i>Lives of Eminent Philosophers</i>, 3rd c. AD; Anacharsis lived in the 6th c. BC). Famous sayings:</p>
<ul><li>"A view of the unseemly actions of drunken men is the most effectual dissuasive from wine."</li>
<li>"My country is a disgrace to me, but you are a disgrace to your country." (reply to an Athenian who mocked his Scythian origin)</li></ul>
<h4>Toxaris {L}</h4>
<ul><li>A Scythian who travelled to Athens <b>before Anacharsis</b>.</li>
<li>Interested in Greek culture and customs; became respected as a physician – the <b>"Foreign Physician"</b>.</li>
<li>Later the Scythian character in <b>Lucian</b>'s dialogue <i>Toxaris, or Friendship</i> – a dialogue between Toxaris (Scythian) and <b>Mnesippus</b> (Greek); each tells <b>five stories</b> about friendship.</li>
<li>Example story: <b>Abauchas and Gyndanes</b> – during a fire, Abauchas saves his injured friend instead of his wife and children: "It is an easy matter for me to have more children… but it would take me a long time to find another such friend as Gyndanes." Discussion question: would we consider this "good friendship" today?</li></ul>
<p class="tip">{C} Memory: <b>A</b>nacharsis = <b>A</b>phorisms (wise sayings, Sage); <b>T</b>oxaris = <b>T</b>reats (physician) + <b>T</b>ales of friendship (Lucian).</p>`,
  must:["Anacharsis – Seven Sages – Diogenes Laërtius","Toxaris – Foreign Physician – before Anacharsis","Lucian: Toxaris, or Friendship; Mnesippus; five stories; Abauchas & Gyndanes"],
  confused:[["Anacharsis","Toxaris","Anacharsis = philosopher, one of Seven Sages, sayings. Toxaris = physician, came EARLIER, hero of Lucian's dialogue on friendship."],["Lucian","Diogenes Laërtius","Lucian wrote the dialogue 'Toxaris'. Diogenes Laërtius recorded Anacharsis."]],
  traps:["Toxaris came to Athens BEFORE Anacharsis, not after.","Mnesippus is the GREEK speaker; Toxaris is the Scythian."]
 }
 ]
},

 {id:"w4t1", title:"Urban and material culture in the Karakhanid period", src:"L",
  quick:[
   "Major cities: ==Otrar, Taraz, Suyab, Balasagun, Sygnak, Yangikent, Saraishyq== {L}",
   "City functions: trade & communication, crafts, agriculture, religious & cultural centres, steppe–oasis connection {L}",
   "==Citadel== – most fortified central part; ==Shahristan== – central nucleus (ruler, nobility, citadel, walls); ==Rabad== – suburban craft settlements outside {L}",
   "==Mosque== – a NEW element of urban structure in this period; bazaar; baths {L}",
   "Crafts: ceramics, blacksmithing, coppersmithing, bone carving, stoneworking {L}",
   "==Great Silk Road==; coins: ==gold dinars, silver-plated dirhams== {L}",
   "13th century: ==Mongol campaigns== disrupted cities and trade; partial recovery by mid-13th c. {L}"
  ],
  deep:`<h4>Cities {L}</h4>
<p>Major urban centres: <b>Otrar, Taraz, Suyab, Balasagun, Sygnak, Yangikent, Saraishyq</b>. Functions: trade and communication; craft production; agriculture; religious and cultural centres; the link between the steppe and the oases.</p>
<h4>City structure {L}</h4>
<table class="tbl"><tr><th>Part</th><th>Meaning</th></tr>
<tr><td><b>Citadel</b></td><td>The most fortified central part of a city, adapted for independent defence; refuge of defenders during an assault</td></tr>
<tr><td><b>Shahristan</b></td><td>The central nucleus of the city – residence of the ruler and nobility, including the citadel and walls</td></tr>
<tr><td><b>Rabad</b></td><td>Suburban craft settlements located outside the shahristan</td></tr></table>
<p class="tip">{C} Think of three rings from inside out: <b>C-S-R</b> = "Castle, Seat of nobles, Ring of craftsmen".</p>
<p>Inside the city: the <b>mosque</b> (a <i>new</i> element of urban development in this period), the <b>bazaar</b> and trading buildings (essential role), and <b>baths</b>.</p>
<h4>Crafts and trade {L}</h4>
<p>Crafts: ceramics, blacksmithing, coppersmithing, bone carving, stoneworking. Trade: the <b>Great Silk Road</b>, long-distance trade, local markets and bazaars, trade between cities ↔ agricultural areas ↔ steppe. Coins were minted: <b>gold dinars</b> and <b>silver-plated dirhams</b>.</p>
<h4>13th century {L}</h4>
<p>Mongol campaigns disrupted many urban and trade networks (e.g. {X} Otrar was destroyed in 1219–1220 by Genghis Khan). Some cities recovered in the mid-13th century; development continued differently by region.</p>`,
  must:["7 cities list","Citadel / Shahristan / Rabad","Mosque = new element","Dinars (gold), dirhams (silver-plated)","Mongol disruption 13th c."],
  confused:[["Shahristan","Rabad","Shahristan = CENTER with ruler & nobility. Rabad = OUTSIDE craft suburbs."],["Citadel","Shahristan","Citadel = the fortress core; Shahristan = the whole inner city that includes the citadel."]],
  traps:["The mosque was a NEW element in medieval Turkic cities.","Dinars were GOLD; dirhams were SILVER(-plated)."]
 },
 {id:"w4t2", title:"Medieval science: al-Farabi, Yusuf Balasaguni, Mahmud al-Kashgari", src:"L",
  quick:[
   "==Al-Farabi== – from ==Otrar (Farab)==; philosophy, logic, mathematics, music, ethics; the ==\"Second Teacher\"== after Aristotle {L}",
   "Al-Farabi's works: <i>==Views of the Residents of the Virtuous City==</i> (ideal society), <i>==Great Book of Music==</i> {L}",
   "==Yusuf Balasaguni== – poet, philosopher, statesman; <i>==Kutadgu Bilig==</i> ('Wisdom of Royal Glory') – guide to wise governance {L}",
   "Kutadgu Bilig characters: ==Kün-Togdı (ruler – Justice), Ay-Toldı (vizier – Fortune/Happiness), Ögdülmiş (adviser – Wisdom), Odgurmış (ascetic – Moderation)== {L}",
   "==Mahmud al-Kashgari== – linguist; <i>==Dīwān Lughāt al-Turk==</i> (==1072–1074==) – dictionary & encyclopedia of Turkic culture; ==400+ proverbs== {L}"
  ],
  deep:`<h4>Abu Nasr Muhammad al-Farabi {L}</h4>
<p>Philosopher and encyclopedic scholar from <b>Otrar (Farab)</b> ({X} c. 870–950). Fields: philosophy, logic, mathematics, music, ethics. Known as the <b>"Second Teacher"</b> (after Aristotle, the "First Teacher"). Works:</p>
<ul><li><i>Treatise on the Views of the Residents of the Virtuous City</i> – the ideal society and virtuous life.</li>
<li><i>The Great Book of Music</i> – major work on music theory.</li></ul>
<p>{X} Al-Farabi Kazakh National University (founded 1934) is named after him.</p>
<h4>Yusuf Balasaguni {L}</h4>
<p>Turkic poet, philosopher and statesman of the <b>Karakhanid</b> period; author of <b><i>Kutadgu Bilig</i></b> ("Wisdom of Royal Glory" / "Knowledge that brings happiness"; {X} completed 1069–1070). It is a guide to ethical and wise governance, addressed to rulers, officials and society.</p>
<p><b>Ideal ruler</b>: just and honest; values knowledge and education; listens to wise advisers; treats people fairly.</p>
<table class="tbl"><tr><th>Character</th><th>Role</th><th>Symbolizes</th></tr>
<tr><td>Kün-Togdı</td><td>Ruler</td><td>Justice</td></tr>
<tr><td>Ay-Toldı</td><td>Vizier</td><td>Fortune / Happiness</td></tr>
<tr><td>Ögdülmiş</td><td>Adviser</td><td>Wisdom / Reason</td></tr>
<tr><td>Odgurmış</td><td>Ascetic</td><td>Moderation / Contentment</td></tr></table>
<p class="tip">{C} Kün = "sun" → the ruler shines <b>justice</b> on all. Ay = "moon" → <b>fortune</b> waxes and wanes. Ögdülmiş → "<b>ög</b>" = mind → <b>wisdom</b>. Odgurmış → the ascetic who is "awakened" → <b>moderation</b>.</p>
<h4>Mahmud al-Kashgari {L}</h4>
<p>Turkic scholar and linguist of the Karakhanid period; author of <b><i>Dīwān Lughāt al-Turk</i></b> (<b>1072–1074</b>) – "Compendium of the Turkic Languages", a dictionary and encyclopedia of Turkic culture: language, folklore, traditions, everyday life; songs, epics, legends and <b>400+ proverbs</b>; information on tribes, cities, crafts, food, animals, customs and beliefs. {X} Written in Arabic for Arab readers; it contains one of the oldest maps of the Turkic world.</p>
<p><b>Proverbs</b> from the Dīwān (lecture):</p>
<ul><li>"The mouth of the one who says 'fire' does not burn." – used when someone apologizes for what they said.</li>
<li>"The fish is in the water, but its eyes are outside." – someone who pretends not to notice.</li>
<li>"It is better to be the head of a calf than the foot of a bull." – independence is better than dependence.</li>
<li>"Give milk to the one who does not give you water." – respond with kindness to those who harm you.</li>
<li>"If you cannot bite a stone, you should kiss it." – act kindly to achieve your goal.</li></ul>`,
  must:["Al-Farabi – Otrar – Second Teacher – Virtuous City – Great Book of Music","Balasaguni – Kutadgu Bilig – 4 characters & their meanings","Kashgari – Dīwān Lughāt al-Turk 1072–1074 – 400+ proverbs"],
  confused:[["Balasaguni","Kashgari","Balasaguni = GOVERNANCE poem (Kutadgu Bilig). Kashgari = DICTIONARY (Dīwān Lughāt al-Turk)."],["Kün-Togdı","Ay-Toldı","Kün (sun) = RULER = Justice; Ay (moon) = VIZIER = Fortune."],["Ögdülmiş","Odgurmış","Ögdülmiş = ADVISER = Wisdom; Odgurmış = ASCETIC = Moderation."]],
  traps:["Al-Farabi is the SECOND teacher (Aristotle is the first).","The 'calf head vs bull foot' proverb means INDEPENDENCE, not humility."]
 },
 {id:"w4t3", title:"Sufism and Islamic culture in Central Asia; Khoja Ahmed Yasawi", src:"L",
  quick:[
   "==Sufism== (==taṣawwuf== – literally 'to dress in wool') – mystical Islam; truth of divine love through direct personal experience of God {L}",
   "Values: devotion, humility, love, remembrance of God {L}",
   "==Tariqa== = Sufi brotherhood: ==Naqshbandi, Yassawi, Qadiriyya== {L}",
   "==Farid ud-Din Attar==, <i>==The Conference of the Birds==</i> – inner transformation; the birds find they ARE the ==Simorgh== {L}",
   "Sufism spread in Central Asia in the ==10th–12th centuries==; shrines and pilgrimage {L}",
   "==Khoja Ahmed Yasawi== – major Turkic Sufi; Islam accessible to Turkic speakers; <i>==Dīwān-i Hikmet==</i> (Book of Wisdom); mausoleum in ==Turkistan== {L}"
  ],
  deep:`<p><b>Sufism</b> (<i>taṣawwuf</i>, literally "to dress in wool") is the mystical Islamic belief and practice in which Muslims seek the truth of divine love and knowledge through <b>direct personal experience of God</b>. Important values: devotion, humility, love, remembrance of God (<i>dhikr</i> {X}). Sufism developed many traditions and orders – <b>tariqas</b> (Sufi brotherhoods): the <b>Naqshbandi</b>, the <b>Yassawi</b>, the <b>Qadiriyya</b>. {L}</p>
<p><b>Farid ud-Din Attar</b>, <i>The Conference of the Birds</i>: birds travel to find their king, the <b>Simorgh</b>; at the end they discover that they themselves are the Simorgh – a symbol of inner spiritual transformation. {L}</p>
<h4>Sufism in Central Asia {L}</h4>
<ul><li>Spread and developed widely in the <b>10th–12th centuries</b>.</li>
<li>Interacted with existing Turkic cultural traditions.</li>
<li>Shrines and pilgrimage became important parts of religious life.</li></ul>
<h4>Khoja Ahmed Yasawi {L}</h4>
<ul><li>Major Turkic Sufi figure; associated with the <b>Yasawiyya</b> tradition.</li>
<li>Taught Islamic spirituality in a form accessible to <b>Turkic-speaking</b> communities (in Turkic, not Arabic/Persian {X}).</li>
<li>Author of <b><i>Dīwān-i Hikmet</i></b> (Book of Wisdom).</li>
<li>His <b>mausoleum in Turkistan</b> became an important pilgrimage site. {X} It was built on Timur's order (late 14th c.) and became Kazakhstan's <b>first UNESCO World Heritage site (2003)</b>. Yasawi died in 1166.</li></ul>`,
  must:["Taṣawwuf = 'to dress in wool'","Tariqas: Naqshbandi, Yassawi, Qadiriyya","Attar – Conference of the Birds – Simorgh","10th–12th c. spread","Yasawi – Dīwān-i Hikmet – Turkistan mausoleum (UNESCO 2003)"],
  confused:[["Dīwān-i Hikmet","Dīwān Lughāt al-Turk","Hikmet = WISDOM poems of Yasawi (Sufism). Lughāt al-Turk = DICTIONARY of Kashgari (linguistics)."],["Attar","Yasawi","Attar = Persian poet, Conference of the Birds. Yasawi = Turkic Sufi, Book of Wisdom."]],
