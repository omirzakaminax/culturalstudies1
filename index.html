 id:5, title:"Formation of Kazakh Culture. Kazakh Culture in the XVIII – late XIX c.", short:"Kazakh Culture XVIII–XIX c.",
 files:["Week 5 Lecture (32 slides)","Week 6 Seminar – Week 5 review questions"],
 goals:["Identify key elements of Kazakh traditional culture","Describe major rituals, folk poetry and musical traditions","Explain the values and ethics of batyrs","Discuss the Zar-Zaman phenomenon"],
 seminarQs:["Life-cycle rites: birth, maturity, death (zharys qazan, shildekhana, besik toi, tusau kesu…)","Funeral and memorial rituals; lament","Wedding rituals (matchmaking, kyz uzatu…)","Folk songs, traditional dances, folk games (khan, asyk, ai kerek, ak sandyk–kok sandyk)"],
 topics:[
 {id:"w5t1", title:"Formation of Kazakh traditional culture: rites, jewelry, games", src:"L",
  quick:[
   "Cultural stabilization; growth of oral literature and customary law; Islam's influence {L}",
   "==Religious syncretism== – combination of different beliefs; Islamic + pre-Islamic elements coexist {L}",
   "Birth rites: ==shildekhana, besik toi, tusau kesu== {L}",
   "Marriage: sacred contract in Islam; community approval; ==Zhar-Zhar== – choral song at the wedding {L}",
   "Jewelry: ==qudagy zhüzik== (ring for the matchmaker's mother), ==shashbau== (hair), ==öñirzhiek== (chest), ==topsaly bilezik== (hinged bracelets), ==boytumar== (amulet) {L}",
   "National games: ==kokpar, asyq atu, togyzqumalaq, kyz kuu== {L}",
   "Funeral – Islamic: body washing, ==janaza==, burial facing Mecca; Tengrian: night guard, purification by fire, burial near winter dwelling {L}"
  ],
  deep:`<p>The formation of Kazakh traditional culture involved <b>cultural stabilization</b>, the growth of <b>oral literature</b> and <b>customary law</b>, and the influence of <b>Islam</b>. A key feature is <b>religious syncretism</b> – the combination of different forms of belief, with Islamic and pre-Islamic (Tengrian) elements coexisting. {L}</p>
<h4>Life-cycle rites {L}{S}{X}</h4>
<table class="tbl"><tr><th>Rite</th><th>Meaning</th></tr>
<tr><td><b>Shildekhana</b></td><td>Celebration of a baby's birth (first days; guests guard and bless mother and child)</td></tr>
<tr><td><b>Besik toi</b></td><td>"Cradle feast" – putting the baby in the cradle (besik) for the first time</td></tr>
<tr><td><b>Tusau kesu</b></td><td>"Cutting the fetters" – a child's first steps; a respected person cuts a cord tied around the legs</td></tr>
<tr><td>Zharys qazan {S}</td><td>Meal prepared by women when a woman goes into labor, wishing a quick birth</td></tr>
<tr><td>Kyz uzatu {S}</td><td>Seeing off the bride from her parents' home</td></tr>
<tr><td>Betashar {X}</td><td>"Unveiling the face" of the bride with a song of advice; UNESCO intangible heritage 2024</td></tr></table>
<p><b>Marital customs</b>: marriage as a sacred contract in Islam, but recognition through <b>community approval</b>; <b>Zhar-Zhar</b> songs (choral song at the wedding); emphasis on oral tradition and social ceremony over formal Islamic procedure. {L}</p>
<h4>Jewelry {L}</h4>
<p><b>Qudagy zhüzik</b> – a ring for the matchmaker's mother; <b>shashbau</b> – decorative hair ornaments; <b>öñirzhiek</b> – chest ornament; <b>topsaly bilezik</b> – hinged bracelets; earrings and necklaces; silver belts and buckles; <b>boytumar</b> – protective amulets; decorative buttons. (Atyrau museum 3D exhibits.)</p>
<h4>National games {L}{S}</h4>
<p><b>Kokpar</b> (horsemen fight for a goat carcass), <b>asyq atu</b> (shooting knucklebones), <b>togyzqumalaq</b> (board game "nine pebbles"), <b>kyz kuu</b> ("catch the girl" on horseback). Seminar games: khan, asyk, ai kerek, ak sandyk–kok sandyk.</p>
<h4>Funeral rites – syncretism in action {L}</h4>
<table class="tbl"><tr><th>Islamic elements</th><th>Tengrian / shamanic elements</th></tr>
<tr><td>Body washing</td><td>Night guard (staying awake overnight at the home)</td></tr>
<tr><td>Janaza (ritual prayer)</td><td>Purification by fire</td></tr>
<tr><td>Burial facing Mecca</td><td>Burial near the family's winter dwelling (ancestral connection)</td></tr></table>
<p>{X} <b>Zhoktau</b> = lament song for the dead (mentioned with ritual songs).</p>`,
  must:["Religious syncretism","Shildekhana / besik toi / tusau kesu","Zhar-Zhar = wedding choral song","Jewelry names","Funeral: Islamic vs Tengrian elements"],
  confused:[["Besik toi","Tusau kesu","Besik = CRADLE. Tusau kesu = cutting fetters at FIRST STEPS."],["Zhar-Zhar","Zhoktau","Zhar-Zhar = WEDDING song. Zhoktau = LAMENT (funeral)."],["Shashbau","Öñirzhiek","Shashbau = HAIR ('shash' = hair). Öñirzhiek = CHEST ornament."]],
  traps:["Night guard and fire purification are TENGRIAN elements, not Islamic.","Qudagy zhüzik is for the MATCHMAKER'S MOTHER (quda = in-law)."]
 },
 {id:"w5t2", title:"Folk poetry: akyns, zhyraus, genres; batyrs' ethics", src:"L",
  quick:[
   "==Akyns== – improvising poets & singers; ==sal & sery==; ==zhyraus== – epic storytellers, historians, advisors {L}",
   "Zhyrau poetry 15th–18th c.: ==unity of tribes of the Kazakh Khanate==, strengthening the state {L}",
   "==Tolgau== – poems-reflections on ethics, morality, honour, life and death {L}",
   "Zhyraus: ==Asan-kaygy, Kaztugan, Dospambet, Shalkiiz, Zhyembet, Margaska, Aktamberdy, Bukhar, Umbet== {L}",
   "==Bukhar Zhyrau Kalkamanuly (1668–1781)== – biy under ==Tauke Khan==; chief adviser to ==Abylai Khan==; ~==1,200 lines== survive {L}",
   "Genres: tolgau; ritual songs (zhar-zhar, zhoktau); proverbs; fairy tales; epics {L}",
   "Heroic epics: ==Er-Targyn, Er-Kokshe, Kambar batyr, Koblandy==; lyrical: ==Kozy-Korpesh – Bayan-sulu, Kyz-Zhibek, Sulushash== {L}",
   "==April 15== – Kozy Korpesh – Bayan Sulu Day (Day of Lovers) {L}",
   "==Abai, Word 29 (1895)== – questions blind trust in proverbs {L}",
   "==Batyrs== – code of honour, service, bravery; ==Qabanbay, Raiymbek, Malaysary, Bogenbay==; Qabanbay's horse ==Qubas== {L}"
  ],
  deep:`<h4>Bearers of oral poetry {L}</h4>
<ul><li><b>Akyns</b> – improvising poets and singers (they compete in <i>aitys</i>).</li>
<li><b>Sal and sery</b> – {X} wandering poet-musicians and romantic heroes famous for songs and elegance.</li>
<li><b>Zhyraus</b> – epic storytellers, historians and advisors (often next to khans).</li></ul>
<p>Functions: preserving collective memory; transmitting morals, history and identity; performing ritual songs and fairy tales.</p>
<h4>Zhyrau poetry of the 15th–18th centuries {L}</h4>
<p>Main themes: <b>cohesion and unity</b> of the tribes of the <b>Kazakh Khanate</b>, and strengthening the state and its military power. <b>Tolgau</b> (poems-reflections): ethics, morality, honour and dignity. Representatives: <b>Asan-kaygy</b>, <b>Kaztugan</b>, <b>Dospambet</b>, <b>Sypyra</b>, <b>Shalkiiz</b>, <b>Zhyembet</b>, <b>Margaska</b>, <b>Aktamberdy</b>, <b>Bukhar</b>, <b>Umbet</b>.</p>
<p><b>Bukhar Zhyrau Kalkamanuly (1668–1781)</b>: poet and statesman; influential <b>biy under Tauke Khan</b>; <b>chief adviser to Abylai Khan</b> during the Dzungar invasions. Didactic poems promoting national unity, independence and good governance; criticized khans for despotism, greed and neglect of ordinary people. About <b>1,200 lines</b> survive.</p>
<h4>Genres of folk poetry {L}</h4>
<ol><li><b>Tolgau</b> – instructive songs-reflections on life and death, present and future.</li>
<li><b>Ritual songs</b> – zhar-zhar, zhoktau, etc.</li>
<li><b>Proverbs and sayings</b> – phrases that share advice or cultural wisdom.</li>
<li><b>Fairy tales</b> – stories, often for children, sometimes with magic creatures.</li>
<li><b>Epics</b> – <b>heroic</b> (Er-Targyn, Er-Kokshe, Kambar batyr, Koblandy: courage, sacrifice, defending the homeland) and <b>lyrical</b> (Kozy-Korpesh – Bayan-sulu, Kyz-Zhibek, Sulushash: love, beauty, morals, honour).</li></ol>
<p><b>Commemoration today</b>: <b>April 15</b> – Day of Lovers, known as <b>Kozy Korpesh – Bayan Sulu Day</b>. {L}</p>
<p><b>Can proverbs change?</b> <b>Abai, the Twenty-Ninth Word (1895)</b> criticizes proverbs that justify wrongdoing: "If you're unknown, then fire the field" – "what is the use of fame extracted out of a crime?"; "Gold will lead astray even an angel". Lesson: not every proverb is wisdom; we must judge them critically. {L}</p>
<h4>Fairy-tale characters {L}</h4>
<p><b>Zhetyrnaq</b> (creature with copper/iron claws), <b>Peri</b> (fairy/spirit), <b>Dyu</b> (demon/giant), <b>Shoyynqulaq</b> (ogre-like creature), <b>Kara Dau</b> (Black Giant), <b>Zhalgyz Kozdi Dau</b> (One-Eyed Giant), <b>Zhelayaq</b> (Swift-Footed), <b>Qanbaq Shal</b> (old man light as a tumbleweed), <b>Mystan Kempir</b> (witch hag).</p>
<h4>Batyrs – values and ethics {L}</h4>
<p>Batyrs were a distinct social group with their own ideology, lifestyle, military traditions, rules and ethics, living by a <b>code of honour, service and bravery</b>. Names: <b>Qabanbay, Raiymbek, Malaysary, Bogenbay</b> and others. Common features of batyr stories (Sänik & Sadykhan 1991): enemies portrayed as <b>honorable and equal opponents</b>; strength and endurance from childhood; great companions and <b>loyal animal friends</b>. Example: <b>Qabanbay</b>'s duel with the Dzungar batyr <b>Myqtym</b>, who also respected the code of combat honour; Qabanbay's horse <b>Qubas</b>.</p>`,
  must:["Akyn / zhyrau / sal-sery","Zhyrau themes: unity of Kazakh Khanate tribes","Bukhar Zhyrau 1668–1781, Tauke Khan biy, adviser of Abylai","Heroic vs lyrical epics lists","April 15 Kozy Korpesh – Bayan Sulu Day","Abai Word 29 (1895)","Batyrs' code; Qabanbay vs Myqtym; horse Qubas"],
  confused:[["Akyn","Zhyrau","Akyn = IMPROVISER (aitys). Zhyrau = EPIC storyteller & ADVISER to khans."],["Heroic epic","Lyrical epic","Heroic: Er-Targyn, Er-Kokshe, Kambar, Koblandy. Lyrical (love): Kozy-Korpesh–Bayan-sulu, Kyz-Zhibek, Sulushash."],["Tauke Khan","Abylai Khan","Bukhar was a BIY under Tauke and chief ADVISER to Abylai."]],
  traps:["Kyz-Zhibek is a LYRICAL epic (love), not heroic.","Myqtym was the DZUNGAR batyr – the enemy who also respected honour."]
 },
 {id:"w5t3", title:"Kazakh traditional music: küy and composers", src:"L",
  quick:[
   "Two genres: ==instrumental== and ==vocal== music; instrumental = ==küy== (soloist) {L}",
   "Instruments: ==dombra, kobyz== etc. {L}",
   "==Kurmangazy Sagyrbayuly (1818–1889)== – dombra; freedom & resistance; inspired by ==1836–1838 uprising== of ==Isatay Taimanuly & Makhambet Utemisuly== {L}",
   "Kurmangazy's küys: ==Saryarka, Kishkentai, Adai, Alatau== {L}",
   "==Tattimbet Kazangapuly (1815–1860)== – founder of classical dombra music; master of ==shertpe== style; Karkaraly {L}",
   "==Zhayau Musa Bayzhanuly (1835–1929)== – 'Zhayau' = on foot; song ==Ak Sisa== {L}",
   "Other names: ==Dina, Dauletkerey== {L}"
  ],
  deep:`<p>Kazakh traditional music has two genres: <b>instrumental</b> and <b>vocal</b>. Instrumental music is the <b>küy</b>, performed by soloists on traditional instruments such as the <b>dombra</b> and the <b>kobyz</b>. Representatives: <b>Kurmangazy, Dina, Dauletkerey, Tattimbet</b>. {L} {X} The <b>Kazakh traditional art of Dombra Küy</b> was inscribed on the UNESCO Representative List of Intangible Cultural Heritage in <b>2014</b>.</p>
<table class="tbl"><tr><th>Composer</th><th>Dates</th><th>Key facts</th></tr>
<tr><td><b>Kurmangazy Sagyrbayuly</b></td><td>1818–1889</td><td>Composer and dombra player, master of küy; music of freedom, resistance to injustice and national identity; inspired by the <b>1836–1838 uprising</b> led by <b>Isatay Taimanuly</b> and <b>Makhambet Utemisuly</b>; küys <b>Saryarka, Kishkentai, Adai, Alatau</b>. {X} The National Conservatory and the Orchestra of Folk Instruments are named after him. {L}</td></tr>
<tr><td><b>Tattimbet Kazangapuly</b></td><td>1815–1860</td><td>Outstanding küyshi, <b>founder of classical dombra music</b>; master of the <b>shertpe</b> style (plucking); born in present-day <b>Karkaraly</b> district, Karaganda region. {L}</td></tr>
<tr><td><b>Zhayau Musa Bayzhanuly</b></td><td>1835–1929</td><td>Composer, singer, poet; nickname <b>Zhayau = "on foot"</b>; song <b>Ak Sisa</b> tells how a wealthy man took his horse, forcing him to travel on foot – social injustice and resistance to the powerful. {L}</td></tr>
<tr><td>Dina Nurpeisova {X}</td><td>1861–1955</td><td>Woman küyshi, student of Kurmangazy's tradition</td></tr>
<tr><td>Dauletkerey Shigayuly {X}</td><td>1820–1887</td><td>Küyshi of the western (tokpe) school</td></tr></table>
<p class="tip">{C} <b>Shertpe</b> (plucked, eastern/central style) = <b>T</b>attimbet; <b>Tokpe</b> (strummed, western style) = Kurmangazy's school. "<b>T</b>attimbet's <b>T</b>ouch is gentle – shertpe."</p>`,
  must:["Küy = instrumental","Kurmangazy 1818–1889; uprising 1836–1838 (Isatay & Makhambet); Saryarka, Kishkentai, Adai, Alatau","Tattimbet 1815–1860 shertpe, Karkaraly","Zhayau Musa 1835–1929 Ak Sisa"],
  confused:[["Kurmangazy","Tattimbet","Kurmangazy = resistance küys (Saryarka, Adai). Tattimbet = founder of classical dombra, SHERTPE, Karkaraly."],["Zhayau Musa","Kurmangazy","Zhayau Musa = 'on foot', song Ak Sisa (a SONG, not a küy)."]],
  traps:["The uprising that inspired Kurmangazy was 1836–1838 (Isatay & Makhambet), not 1916.","Tattimbet (1815) was born BEFORE Kurmangazy (1818)."]
 },
 {id:"w5t4", title:"The Zar-Zaman phenomenon", src:"L",
  quick:[
   "==Zar Zaman== = '==Era of Sorrow==' {L}",
   "Founder: ==Shortanbai Kanayuly==; also ==Dulat Babatayuly, Murat Monkeuly== {L}",
   "Criticized ==Russian colonial rule==; decline of independence; mourned destruction of nomadic traditions {L}",
   "Condemned inequality, heavy taxes, corruption, moral decline; emphasized ==Islam== and Kazakh customs {L}"
  ],
  deep:`<p><b>Zar Zaman</b> ("Era of Sorrow") is a poetic movement of the 19th century. {L}</p>
<ul><li><b>Founder</b>: <b>Shortanbai Kanayuly</b> ({X} 1818–1881); other poets: <b>Dulat Babatayuly</b> ({X} 1802–1871) and <b>Murat Monkeuly</b> ({X} 1843–1906).</li>
<li>Criticized <b>Russian colonial rule</b> and the decline of Kazakh independence.</li>
<li>Mourned the destruction of nomadic traditions and traditional social relations.</li>
<li>Condemned social inequality, heavy taxes, corruption and moral decline.</li>
<li>Emphasized <b>Islam</b>, religious values and preservation of Kazakh customs.</li>
<li>Reflected fears of social collapse and the loss of traditional ways of life.</li></ul>
<p class="tip">{C} "<b>Zar</b>" = lament/grief. Remember <b>S-D-M</b>: <b>S</b>hortanbai <b>D</b>ulat <b>M</b>urat – "Sad Days of Mourning".</p>
<p>{C} Contrast: Zar Zaman poets looked <b>back</b> with sorrow and to Islam; <b>Abai</b> (1845–1904) looked <b>forward</b> to education and enlightenment while also criticizing society.</p>`,
  must:["Zar Zaman = Era of Sorrow","Shortanbai (founder), Dulat, Murat","Anti-colonial, mourning nomadic decline, Islam"],
  confused:[["Zar Zaman poets","Alash intellectuals","Zar Zaman (19th c.) = lament + Islam + tradition. Alash (early 20th c.) = enlightenment, education, autonomy, newspapers."]],

 }

{
 id:6, title:"Kazakh Culture in the XX Century", short:"Kazakh Culture XX c.", endterm:true,
 files:["Week 6 Lecture (36 slides)","Week 6 Seminar (31 slides)"],

 seminarQs:["Famous Kazakh opera performers of the XX century","Literature of Kazakhstan in the XX century","Soviet Kazakh writers of the XX century","Formation and development of Kazakh cinema; Soviet Kazakh film directors and actors"],
 topics:[
 {id:"w6t1", title:"Soviet cultural policy: contradictory trends, education and science", src:"L",
  quick:[
   "Early 20th c. two directions: ==Western/European-style democracy, secularism, independent statehood (Alash)== vs ==Turkic-Islamic (Pan-Turkism/Pan-Islamism)== {L}",
   "Soviet policy promoted national identity: folklore, museums, dress, opera, poets, classic literature (==Terry Martin, <i>The Affirmative Action Empire</i>, 2001==) {L}{S}",
   "Stalin: national cultures ==\"national in form, socialist in content\"== {S}",
   "Contradictions: ==modernization== (industrialization, Soviet identity) + ==suppression of traditions== → ==hybrid culture== {L}",
   "Religion: atheism, softer policy during WWII (==Eden==); religion survived at home – 'grey zones' (==Abashin==); ==SADUM== {L}",
   "Education: ==1917–18== first literacy schools; ==1930== universal compulsory primary education; ==by 1939 literacy 83.6%== (under 50) {L}",
   "==1928== first university – Kazakh Pedagogical University named after ==Abai==, Almaty (9 teachers, 124 students) {L}",
   "==1934== Kazakh State University (now ==Al-Farabi KazNU==) {L}",
   "==1946== Academy of Sciences of the Kazakh SSR; first president ==Kanysh Satpayev== {L}",
   "1950s institutes: Semipalatinsk Vet (1951), Med (1953); Karaganda Med (1950), Ped (1952), Polytechnic (1953); Guryev Ped (1950); Shymkent Ped (1954) {L}",
   "1980s: ==Zheltoqsan (Dec 1986)== vs appointment of ==G. Kolbin==; ==Nevada–Semipalatinsk (1989)== – ==O. Suleimenov==; ==Law on Languages (Sept 1989)== {L}"
  ],
  deep:`<h4>Beginning of the century {L}</h4>
<p>Two intellectual directions: (1) priority to <b>Western/European-style democracy, secularism</b>, independent statehood and the Kazakh language (the <b>Alash</b> movement, Alash Orda autonomy {X}); (2) <b>Turkic-Islamic</b> (Pan-Turkism/Pan-Islamism) – unity of the peoples of Turkestan based on shared religion and region, following both Sharia and European legal norms (Turkestan Autonomy {X}).</p>
<h4>Soviet nationality policy {L}{S}</h4>
<p>According to Terry Martin (<i>The Affirmative Action Empire: Nations and Nationalism in the Soviet Union, 1923–1939</i>, 2001), Soviet policy <b>systematically promoted</b> the distinctive national identity of non-Russian peoples – national folklore, museums, dress, food, costumes, <b>opera</b>, poets, "progressive" historical events and classic literary works. The long-term goal: national identities would coexist with, and eventually be superseded by, an all-union socialist culture. Stalin's formula: Soviet national cultures should be <b>"national in form, socialist in content."</b> Each republic received its own national form of the hujum (unveiling campaign) {L}.</p>
<h4>Contradictory trends {L}</h4>
<ul><li><b>Modernization</b>: industrialization and the creation of a new Soviet identity.</li>
<li><b>Suppression of traditions</b>: restrictions on traditional Kazakh practices.</li>
<li>Result – a <b>hybrid culture</b> combining Soviet ideology with remnants of traditional practices, often in tension.</li>
<li><b>Religion</b>: official atheism, but the policy depended on context; during <b>World War II</b> religious policy became softer (Jeff Eden, <i>God Save the USSR</i>). Religion persisted in domestic spaces – <b>"grey zones"</b> (Sergei Abashin). <b>SADUM</b> = Spiritual Administration of the Muslims of Central Asia and Kazakhstan; madrasas: Mir-i Arab (Bukhara, middle level) and Imam Ismail al-Bukhari (Tashkent, upper level).</li></ul>
<p>{X} The darkest side: the famine of 1931–1933 (Asharshylyk) and the repressions of 1937–1938, when Alash leaders and writers (Baitursynov, Dulatuly, Seifullin, Zhumabayev, Zhansugurov, Mailin) were executed or died in camps.</p>
<h4>Public education {L}</h4>
<table class="tbl"><tr><th>Year</th><th>Event</th></tr>
<tr><td>1917–1918</td><td>First literacy schools in major cities</td></tr>
<tr><td>1930</td><td>Universal compulsory primary education introduced</td></tr>
<tr><td>1930s</td><td>Literacy campaigns in rural areas and among industrial workers</td></tr>
<tr><td>By 1939</td><td>Literacy 83.6% among the population under 50</td></tr></table>
<p><b>Komsomol</b> helped organize schools and provided food, clothing and shoes for children.</p>
<h4>Higher education and science {L}</h4>
<ul><li><b>1928</b> – the first Kazakh National Pedagogical University named after <b>Abai</b> opened in Almaty with <b>9 teachers and 124 students</b>.</li>
<li><b>1934</b> – Kazakh State University (now <b>Al-Farabi</b> Kazakh National University).</li>
<li><b>1941–1945</b> – WWII brought evacuated scientists and universities to Kazakhstan.</li>
<li><b>1946</b> – <b>Academy of Sciences of the Kazakh SSR</b> founded; first president <b>Kanysh Satpayev</b> (geologist). <span class="warn-inline">Seminar "myth": Dinmukhamed Kunaev was NOT the first president.</span> The Academy celebrates its <b>80th anniversary in 2026</b>. {S}</li>
<li><b>1950s</b> – specialized institutes: Semipalatinsk Veterinary (1951) and Medical (1953); Karaganda Medical (1950), Pedagogical (1952), Polytechnic (1953 – mining and metallurgy); Guryev (now Atyrau) Pedagogical (1950); Shymkent Pedagogical (1954).</li></ul>
<h4>The 1980s – birth of civil society {L}</h4>
<ul><li><b>Zheltoqsan – the December Events of 1986</b>: Kazakh youth in Alma-Ata protested the appointment of <b>Gennady Kolbin</b> as head of the republic (replacing Kunaev {X}). A watershed moment: an explosion of national consciousness; the creative intelligentsia (including <b>Mukhtar Shakhanov</b>) fought for an objective investigation.</li>
<li><b>Nevada–Semipalatinsk Anti-Nuclear Movement (1989)</b>, founded on the initiative of <b>Olzhas Suleimenov</b>: united scientists, writers, musicians and activists – the first case where a cultural and civic force stopped nuclear tests at the test site ({X} the Semipalatinsk site was closed on 29 August 1991).</li>
<li><b>Law on Languages (September 1989)</b>: Kazakh received the status of <b>state language</b> – the culmination of years of advocacy by the intelligentsia.</li></ul>`,
  must:["Martin 2001 'Affirmative Action Empire'","'National in form, socialist in content' – Stalin","Hybrid culture; Eden (WWII softer); Abashin (grey zones); SADUM","1930 compulsory primary; 1939 literacy 83.6%","1928 Abai Ped. Univ. (9 teachers/124 students); 1934 KazGU; 1946 Academy – Satpayev","Dec 1986 Zheltoqsan – Kolbin; 1989 Nevada-Semipalatinsk – Suleimenov; Sept 1989 Law on Languages"],

 {id:"w6t2", title:"Famous Kazakh opera performers of the XX century", src:"S",
  quick:[
   "Opera = staged work set entirely to music; story told through song – combines music, words, drama, dance {S}",
   "Why opera in Soviet Kazakhstan? Soviet policy promoted 'national' opera as part of 'national in form' culture {S}{C}",
   "First Kazakh operas: ==Kyz Zhibek – E. Brusilovsky (1934)==; ==Abai – A. Zhubanov & L. Khamidi (1944)==; ==Birzhan–Sara – M. Tulebayev (1946)== {S}",
   "==Kulyash Baiseitova (1912–1957)== – first Zhibek; ==People's Artist of the USSR at 24 (1936)== – youngest ever; 'Kazakh Nightingale' {S}{X}",
   "==Roza Baglanova (1922–2011)== – front-line concerts in WWII; People's Artist of the USSR (1967); Khalyk Kaharmany {S}{X}",
   "==Bibigul Tulegenova (born 1929)== – lyric-coloratura soprano; People's Artist of the USSR (1967); ==last Hero of Socialist Labour (1991)== {S}{X}",
   "==Zhamal Omarova== – singer; first performed 'Menin Qazaqstanym' (later the anthem) {L}{X}",
   "==Shara Zhienkulova (1912–1991)== – first professional Kazakh ==dancer==, founder of Kazakh stage dance {L}{X}",
   "==Ermek Serkebayev (1926–2013)== – baritone; Abai, Birzhan, Figaro; People's Artist of the USSR (1959) {X}"
  ],
  deep:`<p><b>What is opera?</b> "In Western tradition, an opera is a staged work set entirely to music with orchestral overture, continuous music, recitative, arias and chorus" (Buxton International Festival). "Opera is a dramatic story told through song… the most complete art form, combining all the elements of art: words, music, drama and dance" (Basile Opera Center). {S}</p>
<p><b>Why did opera develop in Soviet Kazakhstan?</b> {C} Opera was a <i>new genre</i> for Kazakh culture (traditional music was küy and song). The Soviet state promoted national operas as part of "national in form, socialist in content" culture; composers combined Kazakh folk melodies and epics with European opera form. The Kazakh Musical Theatre (founded 1933–34 {X}) became the Abai Opera and Ballet Theatre; the <b>1936 Decade of Kazakh Art in Moscow</b> made Kazakh opera famous across the USSR {X}.</p>
<h4>The first Kazakh operas {S}</h4>
<table class="tbl"><tr><th>Opera</th><th>Composer(s)</th><th>Year</th></tr>
<tr><td><b>Kyz Zhibek</b> (libretto G. Musrepov {X})</td><td>Evgeni <b>Brusilovsky</b> (1905–1981)</td><td>first staged <b>1934</b></td></tr>
<tr><td><b>Abai</b></td><td>Akhmet <b>Zhubanov</b> (1906–1968) & Latif <b>Khamidi</b> (1906–1983)</td><td><b>1944</b></td></tr>
<tr><td><b>Birzhan – Sara</b></td><td>Mukan <b>Tulebayev</b></td><td><b>1946</b></td></tr></table>
<p class="tip">{C} Chronology mnemonic: <b>"Zhibek → Abai → Birzhan" = Z-A-B, 34-44-46</b>: "Zhibek opens (1934), Abai in war (1944), Birzhan after victory (1946)."</p>
<h4>Performers – profiles</h4>
<table class="tbl"><tr><th>Performer</th><th>Dates</th><th>Contribution</th></tr>
<tr><td><b>Kulyash Baiseitova</b></td><td>1912–1957</td><td>Opera singer (lyric-coloratura soprano) and actress; the opera <i>Kyz Zhibek</i> was written for her voice and she was the first Zhibek; also Sara (<i>Birzhan–Sara</i>), Azhar (<i>Abai</i>), Cio-Cio-San, Tatiana; <b>People's Artist of the USSR in 1936 at age 24 – the youngest holder ever</b>; two Stalin Prizes (1948, 1949); called the <b>"Kazakh Nightingale"</b>; died on tour in Moscow; the Astana opera house theatre and a national folk-song contest bear her name. {S}{X}</td></tr>
<tr><td><b>Roza Baglanova</b></td><td>1922–2011</td><td>Born in Kazaly (Kyzylorda region); soprano, opera and pop singer; during the Great Patriotic War sang <b>at the front</b> with a concert brigade from Uzbekistan; after the war the first Kazakh singer with all-Union fame; songs like "Saulem-ai"; <b>People's Artist of the USSR (1967)</b>; <b>Khalyk Kaharmany</b> (People's Hero of Kazakhstan). {S}{X}</td></tr>
<tr><td><b>Bibigul Tulegenova</b></td><td>born 1929</td><td>Born in Semipalatinsk; lyric-coloratura soprano, actress, teacher; roles: Zhibek, Azhar (<i>Abai</i>), Sara, Tatiana; <b>People's Artist of the USSR (1967)</b>, USSR State Prize (1970); <b>Hero of Socialist Labour (1991) – the last person ever to receive this title</b>; also a "Kazakh nightingale"; an international vocal competition bears her name. {S}{X}</td></tr>
<tr><td><b>Zhamal Omarova</b></td><td>1912–1976 {X}</td><td>Folk and estrada singer of the Kazakh Philharmonic; she was the first to sing Shamshi Kaldayakov's song <b>"Menin Qazaqstanym"</b>, which became the national anthem (2006). {L}{X}</td></tr>
<tr><td><b>Shara Zhienkulova</b></td><td>1912–1991</td><td>The <b>first professional Kazakh dancer</b>, founder of Kazakh stage dance; People's Artist of the Kazakh SSR (1938); acted in <i>Amangeldy</i> (1938); the subject of Gulfairus Ismailova's painting "Kazakh Waltz". <i>Not an opera singer – a dancer.</i> {L}{X}</td></tr>
<tr><td><b>Ermek Serkebayev</b></td><td>1926–2013</td><td>Lyric baritone; roles Abai, Birzhan, Figaro (<i>The Barber of Seville</i>); People's Artist of the USSR (1959), Hero of Socialist Labour (1986); acted in <i>Our Dear Doctor</i> (1957) and <i>Angel in a Skullcap</i> (1968). {X}</td></tr>
<tr><td>Kanabek Baiseitov {X}</td><td>1905–1977</td><td>Singer-actor, director, a founder of the Kazakh Musical Theatre; husband of Kulyash</td></tr>
<tr><td>Kurmanbek Dzhandarbekov {X}</td><td>1905–1973</td><td>Opera singer and actor of the first generation; first husband of Shara Zhienkulova</td></tr></table>
<p><b>Influence on Kazakh musical culture</b> {C}: they created a professional Kazakh vocal school, combined folk-song tradition with European technique, made Kazakh opera known throughout the USSR and abroad, and trained new generations (e.g. Tulegenova's pupils at Astana Opera).</p>`,
  must:["Kyz Zhibek – Brusilovsky – 1934","Abai – Zhubanov & Khamidi – 1944","Birzhan–Sara – Tulebayev – 1946","Baiseitova 1912–1957: first Zhibek, People's Artist USSR 1936 at 24","Baglanova 1922–2011: front-line singer","Tulegenova b.1929: last Hero of Socialist Labour 1991","Zhienkulova = dancer"],
  confused:[["Baiseitova","Tulegenova","Both 'nightingales' and both sang Zhibek. BAISEITOVA = FIRST Zhibek (1934), 1912–1957, USSR title in 1936. TULEGENOVA = born 1929, USSR title 1967, last Hero of Socialist Labour 1991."],["Baglanova","Baiseitova","BAGLANOVA = WAR singer at the FRONT (b.1922). BAISEITOVA = OPERA pioneer (b.1912)."],["Zhubanov & Khamidi","Brusilovsky","Brusilovsky = KYZ ZHIBEK (1934). Zhubanov+Khamidi = ABAI (1944)."],["Zhienkulova","Omarova","Zhienkulova = DANCE. Omarova = SINGER, first 'Menin Qazaqstanym'."]],
  traps:["Birzhan–Sara is by TULEBAYEV, not Brusilovsky.","Shara Zhienkulova was a DANCER, though the lecture lists her among 'opera, theatre performers'.","Baiseitova received the USSR title in 1936 (some sources say 1937) – the slide-based answer is 1936."]
 },
 {id:"w6t3", title:"Literature of Kazakhstan in the XX century: periods and movements", src:"L",
  quick:[
   "Periods: ==Alash awakening (1900s–1920s)== → ==early Soviet & repressions (1920s–30s)== → ==war literature (1940s)== → ==post-war epic novels (1940s–70s)== → =='thaw' & poetry of the 1960s–80s== → ==perestroika & independence== {C}{X}",
   "==Alikhan Bokeikhanov==: scientific articles, 'Kazakh' newspaper (\"The Duma and the Kazakhs\") {L}",
   "==Akhmet Baitursynov (1872–1937)==: <i>==Forty Fables==</i> (1909, St. Petersburg), <i>==The Mosquito==</i> (1911) {L}{S}",
   "==Mirzhakyp Dulatuly (1885–1935)==: <i>==Awake, Kazakh!==</i> (1909); <i>==Unhappy Zhamal==</i> (1910) – ==first Kazakh novel== {L}",
   "Alash ideas: national identity, education, cultural awakening {L}",
   "Major themes: ==tradition and modernity, revolution, social change, national identity, Soviet ideology== {L}",
   "Poets: ==M. Makataev, T. Aibergenov, O. Suleimenov, K. Myrzaliev, M. Shakhanov, F. Ungarsynova== {S}"
  ],
  deep:`<h4>Main stages {X}{C}</h4>
<table class="tbl"><tr><th>Period</th><th>Features</th><th>Names</th></tr>
<tr><td>1900s–1920s – National awakening (Alash)</td><td>Enlightenment, education, newspapers ("Kazakh" 1913–1918, "Ai Qap"), fight for national identity and autonomy</td><td>Bokeikhanov, Baitursynov, Dulatuly, Magzhan Zhumabayev</td></tr>
<tr><td>1920s–1930s – Early Soviet literature</td><td>New Soviet themes, socialist realism (from 1934); Union of Writers of Kazakhstan; repressions of 1937–38 destroyed a generation</td><td>Saken Seifullin, Ilyas Zhansugurov, Beimbet Mailin; Zhambyl Zhabayev (akyn)</td></tr>
<tr><td>1940s – War literature</td><td>Patriotism, heroism of the Great Patriotic War</td><td>B. Momyshuly, G. Musrepov (<i>Kazakh Soldier</i>)</td></tr>
<tr><td>1940s–1970s – Great epic novels</td><td>Historical-revolutionary novels, national history, the "encyclopedia of Kazakh life"</td><td>M. Auezov, S. Mukanov, A. Nurpeisov, I. Esenberlin</td></tr>
<tr><td>1960s–1980s – Poetry of the "thaw"</td><td>Lyrical, philosophical and civic poetry; national identity; anti-nuclear and anti-colonial themes</td><td>Makataev, Aibergenov, Suleimenov, Myrzaliev, Shakhanov, Ungarsynova</td></tr>
<tr><td>Late 1980s–1990s</td><td>Glasnost: rehabilitation of repressed Alash writers, Zheltoqsan theme, independence</td><td>Shakhanov, Suleimenov</td></tr></table>
<h4>Alash intellectuals and the national awakening {L}{S}</h4>
<ul><li><b>Alikhan Bokeikhanov</b> – scientific articles in the <i>New Encyclopedic Dictionary</i> and the collection <i>Forms of National Movements in Modern States</i>; articles in the <b>"Kazakh"</b> newspaper: "The Duma Parties", "The Duma and the Kazakhs". <span class="warn-inline">The slide gives 1870–1939; standard reference dates are 1866–1937 {X}.</span> {X} Leader of the Alash party and Alash Orda government (1917–1920).</li>
<li><b>Akhmet Baitursynov (1872–1937)</b> – first poems in the collection of translations <b><i>Forty Fables</i></b> (Қырық мысал, <b>1909</b>, St. Petersburg); second book <b><i>The Mosquito</i></b> (Маса, <b>1911</b>) – both encouraged social and intellectual awakening. {X} Reformer of the Kazakh alphabet (based on Arabic script) and founder of Kazakh linguistics; editor of "Kazakh".</li>
<li><b>Mirzhakyp Dulatuly (1885–1935)</b> – <b><i>Awake, Kazakh!</i></b> (Оян, қазақ!, <b>1909</b>) urged people to recognize the need for social change; <b><i>Unhappy Zhamal</i></b> (<b>1910</b>) – the <b>first novel in Kazakh literature</b>.</li></ul>
<p>Ideas: national identity, education, cultural awakening. {L}</p>
<h4>Soviet-period literature {L}</h4>
<p>Major themes: <b>tradition and modernity, revolution, social change, national identity and Soviet ideology</b>. Key works (details in the next topic): Auezov's <i>The Path of Abai</i>, Mukanov's <i>Botagoz</i>, Nurpeisov's <i>Blood and Sweat</i>, Esenberlin's <i>Nomads</i>, Suleimenov's <i>AZ i IA</i> and <i>Earth, Bow Down to Man</i>, Momyshuly's <i>Our Family</i>.</p>
<p><b>Poets of the second half of the century</b> {S}: Mukagali <b>Makataev</b>, Tolegen <b>Aibergenov</b>, Olzhas <b>Suleimenov</b>, Kadyr <b>Myrzaliev</b>, Mukhtar <b>Shakhanov</b>, Fariza <b>Ungarsynova</b> (Ongarsynova).</p>
<p>Seminar discussion: <i>Can literature help us understand a nation's culture and history?</i> {S} {C} Yes – e.g. <i>The Path of Abai</i> preserves 19th-century customs, law and debates; <i>Blood and Sweat</i> shows Aral fishermen during revolution; but Soviet censorship and ideology also shaped what could be written.</p>`,
  must:["Baitursynov: Forty Fables 1909, The Mosquito 1911","Dulatuly: Awake, Kazakh! 1909; Unhappy Zhamal 1910 – first Kazakh novel","Bokeikhanov: 'Kazakh' newspaper articles","Soviet themes: tradition vs modernity, revolution, identity, ideology","Poets list"],
  confused:[["Baitursynov","Dulatuly","BAITURSYNOV = FABLES & MOSQUITO (Forty Fables 1909, Masa 1911). DULATULY = 'AWAKE, KAZAKH!' 1909 + first NOVEL 'Unhappy Zhamal' 1910."],["Awake, Kazakh! (1909)","Forty Fables (1909)","Same year 1909! Awake = Dulatuly (call to action). Fables = Baitursynov (translations)."]],
  traps:["The FIRST Kazakh novel is 'Unhappy Zhamal' (Dulatuly, 1910) – not 'The Path of Abai'.","'Forty Fables' was published in ST. PETERSBURG.","Bokeikhanov's dates on the slide (1870–1939) differ from reference dates (1866–1937)."]
 },

  deep:`<table class="tbl"><tr><th>Writer</th><th>Dates</th><th>Main works</th><th>Themes / contribution</th></tr>
<tr><td><b>Mukhtar Auezov</b></td><td>1897–1961</td><td><b><i>The Path of Abai</i></b> (Abai Zholy) – four volumes {S} ({X} 1942–1956; Lenin Prize 1959); plays <i>Enlik–Kebek</i>, libretto of <i>Aiman–Sholpan</i></td><td>Life of the poet Abai and the Kazakh steppe of the 19th century; tradition, modernization, national identity; called the <b>"encyclopedia of Kazakh people's life"</b>. {L} {X} The Kazakh drama theatre and the Institute of Literature bear his name. <span class="warn-inline">Seminar "myth": the claim that it was translated into "over 100 languages" is presented as doubtful.</span></td></tr>
<tr><td><b>Sabit Mukanov</b></td><td>1900–1973</td><td><b><i>Botagoz</i></b> ({X} 1938)</td><td>The revolutionary period, formation of Soviet Kazakhstan, social changes after the Bolshevik revolution; Botagoz – social conflicts and emotional struggles of a young Kazakh woman caught in the turmoil of the revolution; "the life and struggle of the Kazakh people in 1912–1920". {S}</td></tr>
<tr><td><b>Gabit Musrepov</b></td><td>1902–1985</td><td><b><i>Kazakh Soldier</i></b>; <b><i>Ulpan</i></b>; <b><i>Awakened Land</i></b> (Оянған өлке)</td><td><i>Kazakh Soldier</i> – about Kairosh Sartaliev, a participant of the Great Patriotic War; <i>Ulpan</i> – the fate of a Kazakh woman in the 19th century; <i>Awakened Land</i> – first part of a trilogy about the formation of the Kazakh working class. {S} {X} Also wrote the libretto of the opera <i>Kyz Zhibek</i> and the screenplay of the 1970 film.</td></tr>
<tr><td><b>Abdizhamil Nurpeisov</b></td><td>1924–2022</td><td><b><i>Blood and Sweat</i></b> (Қан мен тер) – trilogy</td><td>Historical-revolutionary trilogy: the First World War and the civil war of 1918–1920; the lives of Kazakh <b>fishermen on the shores of the Aral Sea</b>. {L}{S}</td></tr>
<tr><td><b>Ilyas Esenberlin</b></td><td>1915–1983 {X}</td><td><b><i>Nomads</i></b> (Көшпенділер) – multi-volume ({X} trilogy: <i>The Enchanted Sword, Despair, Khan Kene</i>)</td><td>Recreates the history of the Kazakh people from the <b>15th century to the mid-19th century</b> (Kazakh Khanate). {L}{S} {X} Basis of the film <i>Nomad</i> (2005).</td></tr>
<tr><td><b>Bauyrzhan Momyshuly</b></td><td>1910–1982</td><td><b><i>Our Family</i></b>; protagonist of <b><i>Volokolamsk Highway</i></b> by Alexander Bek</td><td>Legendary WWII commander of the Panfilov division near Moscow {X}; Hero of the Soviet Union (posthumously, 1990 {X}); military prose about honour and courage. {L}{S}</td></tr>
<tr><td><b>Olzhas Suleimenov</b></td><td>born 1936 {X}</td><td><b><i>AZ i IA</i></b> (1975 {X}); <b><i>Earth, Bow Down to Man</i></b> ({X} 1961, poem about Gagarin's flight)</td><td>Poet and thinker; Turkic–Slavic shared history; leader of the Nevada–Semipalatinsk movement (1989). {L}</td></tr>
<tr><td><b>Akhmet Baitursynov</b></td><td>1872–1937</td><td><i>Forty Fables</i> (1909), <i>The Mosquito</i> (1911)</td><td>Alash enlightener, linguist. {S}</td></tr></table>
<p><b>Quote from <i>Blood and Sweat</i></b> (lecture): "Is not death the most reliable weapon in your hands? Was it not your forefather Genghiz Khan who unsheathed it…" – the cruelty of power in history. <b>Quote</b> "My first and greatest happiness is my people… More precious than gold is my people's worth" – love for one's people as a theme. {L}</p>
<p><b>Other writers worth knowing</b> {X}: <b>Saken Seifullin</b> (1894–1938, founder of Soviet Kazakh literature, repressed); <b>Magzhan Zhumabayev</b> (1893–1938, Alash poet); <b>Ilyas Zhansugurov</b> (1894–1938, poem <i>Kulager</i>); <b>Beimbet Mailin</b> (1894–1938, co-author of the <i>Amangeldy</i> script); <b>Zhambyl Zhabayev</b> (1846–1945, akyn, Stalin Prize).</p>`,
  must:["Auezov – Path of Abai (4 vols) – 'encyclopedia of Kazakh life'","Mukanov – Botagoz – 1912–1920","Musrepov – Kazakh Soldier (Kairosh Sartaliev), Ulpan, Awakened Land","Nurpeisov – Blood and Sweat – Aral fishermen, 1918–1920","Esenberlin – Nomads – 15th to mid-19th c.","Momyshuly – Our Family; Volokolamsk Highway (A. Bek)"],
  confused:[["Mukanov","Musrepov","MUKANOV = Botagoz (girl in REVOLUTION). MUSREPOV = Ulpan (19th-c. woman), Kazakh Soldier (WWII), Awakened Land."],["Nurpeisov","Esenberlin","NURPEISOV = Blood & Sweat (ARAL fishermen, 1918–20). ESENBERLIN = Nomads (15th–19th c. KHANATE history)."],["Momyshuly","Bek","MOMYSHULY is the HERO of 'Volokolamsk Highway'; Alexander BEK is its AUTHOR."],["Botagoz","Ulpan","Botagoz (Mukanov) = revolution 1912–20; Ulpan (Musrepov) = 19th century."]],

 {id:"w7t1", title:"From Soviet republic to independent Kazakhstan; globalization and identity", src:"L",

  deep:`<h4>Key dates of independence {L}</h4>
<table class="tbl"><tr><th>Date</th><th>Event</th></tr>
<tr><td>25 October 1990</td><td><b>Declaration on the State Sovereignty</b> of the Kazakh SSR – political and legal foundations of statehood; integrity and inviolability of territory; development of the culture of peoples and their languages; strengthening national identity</td></tr>
<tr><td>16 December 1991</td><td><b>Day of Independence</b> – Constitutional Law "On the State Independence of the Republic of Kazakhstan"</td></tr>
<tr><td>12 November 1993</td><td>Decree "On the introduction of the National Currency"</td></tr>
<tr><td>15 November 1993</td><td><b>Tenge</b> came into circulation – Day of the National Currency</td></tr></table>
<h4>Globalization {L}</h4>
<p><b>Globalization</b> is a historical process that encompasses the expansion and deepening of interconnections and interdependencies between countries at various levels: economic, financial, technological, cultural and military. Common consequences: <b>migration</b> across borders (intertwining of cultures); the identity of the individual becomes <b>vulnerable</b>; <b>blurring of boundaries</b> between cultures and a tendency toward <b>uniformity</b>.</p>
<p><b>Glocalization</b> – the adaptation of global cultural elements to local conditions based on local customs; term introduced by <b>Roland Robertson</b>. Example: Coca-Cola's "Share a Coke" bottles with local Kazakh names. {L} {C} Other examples: McDonald's menus adapted to local taste; Kazakh-language versions of global apps.</p>
<p><b>Multiculturalism</b> – the coexistence, acceptance and promotion of multiple distinct cultural, ethnic or racial groups within one society, respecting diverse traditions instead of forcing assimilation. {L}</p>
<h4>Identity {L}</h4>
<ul><li><b>Identity</b> (as a social phenomenon) – a system of material, spiritual and cultural values that distinguish one culture from another; a group's recognition of its uniqueness; the result of a historical and social process.</li>
<li><b>Self-identity</b> – the way we think about ourselves and construct unifying narratives of the self – a reflexive, discursive construction of the self.</li>
<li><b>Digital identity</b> – the representation of yourself on social media.</li>
<li><b>National identity</b> – citizens' identification with their country's historical and cultural traditions, moral values, ideals, beliefs, national sovereignty; belonging to the country as a political community.</li></ul>
<p>Kazakhstan's challenge: <b>preserving national identity while integrating into the global community</b>.</p>
<h4>Five global trends affecting culture {L}</h4>
<ol><li>Formation of the <b>information society</b> – knowledge and information become key resources.</li>
<li>New trends in art – <b>modernism, postmodernism</b> – combining cultural approaches.</li>
<li><b>Mass culture</b> – mass audiences access culture through mass media.</li>
<li>Increasing influence of <b>religions</b> → cultural and ideological contradictions.</li>
<li>Intensification of <b>global problems</b> – environmental crises, migration, political instability.</li></ol>
<h4>Modernism vs postmodernism {L}</h4>
<p>(Ayşe Derya Kahraman) <b>Modernity</b> – control, hierarchy, reality. <b>Postmodern</b> – chaos, uncertainty, performance, imitation.</p>
<p><b>Jean Baudrillard</b> – <i>Simulacra and Simulation</i> ({X} 1981): modern society as simulation – "the generation by models of a real without origin or reality: a <b>hyperreal</b>". <b>Simulacra</b> – objects created by simulation, a copy without the original reality behind it. {C} Example: an Instagram-filtered "perfect" Astana sunset that looks more real than reality; a theme-park "nomad village".</p>`,
  must:["25 Oct 1990 sovereignty; 16 Dec 1991 independence; 12/15 Nov 1993 tenge","Globalization definition + 3 consequences","Glocalization – Robertson – Share a Coke","4 identity types","Baudrillard: simulacra, hyperreal"],
  confused:[["Globalization","Glocalization","Globalization = worldwide interconnection, tends to uniformity. Glocalization (Robertson) = global ADAPTED to local."],["Self-identity","National identity","Self = how I narrate MYSELF. National = belonging to a COUNTRY's traditions & political community."],["12 Nov 1993","15 Nov 1993","12th = DECREE signed; 15th = tenge entered CIRCULATION (Day of national currency)."],["Modernity","Postmodernity","Modern = control, hierarchy, reality. Postmodern = chaos, uncertainty, performance, imitation."]],
  traps:["Independence Day = 16 December 1991; sovereignty declaration = 25 October 1990.","Glocalization was introduced by Roland ROBERTSON, not Baudrillard."]
 },
 {id:"w7t2", title:"Contemporary Kazakh art and cultural institutions", src:"L",
  quick:[
   "Contemporary artists: ==Rustam Khalfin (1949–2008)==, ==Sergei Maslov (1952–2002)==, ==Moldakul Narymbetov (1948–2011)== {L}",
   "Khalfin – installation ==<i>Flying White</i> (1997)==, Kasteyev Museum; Khalfin Foundation {L}",
   "==Cultural institution== – mission to conserve, interpret, disseminate cultural, scientific and environmental knowledge {L}",
   "Cultural centers (==Tselinny Center==), library, museum, ==virtual museum== {L}",
   "Kazakh museums: ==ALZhIR== (Akmola camp of wives of traitors), ==Mashhur Zhusip== memorial museum, ==National Museum== {L}",
   "==Civic education== – preparing youth for dialogue and cooperation based on human rights, moral position, laws, democracy {L}"
  ],
  deep:`<h4>Contemporary Kazakh art after independence {L}</h4>
<p>Artists experiment with various forms of expression, take inspiration from global movements while <b>reclaiming national heritage and traditional codes</b>. Notable artists: <b>Rustam Khalfin</b> (1949–2008; installation <i>"Flying White"</i>, 1997, mixed media – A. Kasteyev State Museum of Arts; Khalfin Foundation), <b>Sergei Maslov</b> (1952–2002), <b>Moldakul Narymbetov</b> (1948–2011).</p>
<h4>Cultural institutions {L}</h4>
<p>A <b>cultural institution</b> has an acknowledged mission to engage in the <b>conservation, interpretation and dissemination</b> of cultural, scientific and environmental knowledge, and to inform and educate citizens. Examples: theatres, operas, museums, libraries, cultural centers.</p>
<ul><li><b>Cultural centers</b> – display masterpieces, encourage creativity and education; select and present cultural goods from local, national and world heritage (e.g. <b>Tselinny Center of Contemporary Culture</b>, Almaty).</li>
<li><b>Library</b> – provides access to information sources, space and equipment.</li>
<li><b>Museum</b> – lets citizens attend public collections for inspiration, learning and enjoyment.</li>
<li><b>Virtual museum</b> – an <b>umbrella term</b> for digital representation of museum collections, from virtual tours and guides to fully online museums. Museums are spaces where citizens engage with history and shape national identity.</li></ul>
<p>Kazakh examples: <b>ALZhIR</b> – museum of the Akmolinsk Camp of Wives of Traitors to the Motherland (Stalin's Gulag camp for wives of the repressed); <b>Memorial museum of Mashhur Zhusip Kopeiuly</b> (poet and collector of folklore); <b>National Museum of the Republic of Kazakhstan</b> (Astana). {L}</p>
<p><b>Civic education</b> – a process of personality development preparing young people for social statements, dialogue and cooperation based on respect for human rights, a personal moral position and knowledge of state laws and principles of democracy. {L}</p>
<p>Conclusion of the lecture: modern Kazakh culture in globalization is a complex, multi-layered process <b>balancing between preserving traditions and adapting them to global trends</b>. {L}</p>`,
  must:["Khalfin (Flying White 1997), Maslov, Narymbetov","Cultural institution definition","Virtual museum = umbrella term","ALZhIR, Mashhur Zhusip museum, National Museum","Civic education"],
  confused:[["Khalfin","Kasteev","Khalfin = CONTEMPORARY art (installation 1997). Kasteev = founder of Kazakh fine art (Soviet era)."]],
  traps:["'Flying White' is by Khalfin and is kept in the Kasteyev museum – don't attribute it to Kasteev."]
 },
 {id:"w7t3", title:"Cultural Intelligence (CQ): features, dimensions, outcomes", src:"S",
  quick:[
   "==CQ== – the capability to function effectively in ==intercultural contexts== (==Earley & Ang, 2003==) {L}{S}",
   "CQ can belong to an ==individual, a team or a firm== {S}",
   "Shift: from focusing on cultural differences → to ==functioning effectively== amid differences {S}",
   "Rooted in the ==multiloci view of intelligence==; four factors {S}",
   "==Metacognitive== – mental capability to ==acquire and understand== cultural knowledge 🧠 {L}{S}",
   "==Cognitive== – ==knowledge about cultures==, similarities and differences ✍ {L}{S}",
   "==Motivational== – ==interest and confidence== in intercultural contexts 💯 {L}{S}",
   "==Behavioral== – capability to ==flex behaviors== in intercultural interactions 🙏 {L}{S}",
   "==IQ== – score from standardized tests of cognitive abilities vs age group; ==EQ== – manage own emotions & understand others' {S}",
   "Outcomes: positive for individuals, teams, firms; applied in ==150+ countries== for selection, training, development {S}"
  ],
  deep:`<p><b>Official reading</b>: Van Dyne, Ang, Tan & Rockstuhl, "Cultural Intelligence", <i>Oxford Bibliographies</i> (last reviewed 19 April 2024) – the uploaded PDF (the LMS link itself requires a university login and could not be opened).</p>
<h4>Definition and features {S}</h4>
<p><b>Cultural intelligence (CQ)</b> is the <b>capability to function effectively in intercultural contexts</b> (Earley & Ang 2003). Key features from the reading:</p>
<ul><li>CQ can be the capability of an <b>individual, a team or a firm</b>.</li>
<li>It matters because the world is diverse and organizations value <b>bridging cultures</b>.</li>
<li>It marks a research shift <b>away from studying cultural differences</b> toward <b>how to function effectively</b> in situations of cultural difference.</li>
<li>It is theoretically precise about what is and is not part of the construct; it is rooted in the <b>multiloci view of intelligence</b> ({X} R. Sternberg: intelligence located in several "loci").</li>
<li>CQ is <b>distinct</b> from other interpersonal intelligences (e.g. EQ) and intercultural competencies; it is <b>uniquely relevant to intercultural (not monocultural) contexts</b>; it is different from its <b>antecedents</b> – personality traits and multicultural experiences.</li></ul>
<h4>The four dimensions {L}{S}</h4>
<table class="tbl"><tr><th>Dimension</th><th>Definition</th><th>Key question {C}</th><th>Example {C}</th></tr>
<tr><td>🧠 <b>Metacognitive</b></td><td>The mental capability to <b>acquire and understand</b> cultural knowledge (awareness, planning, checking)</td><td>"Am I aware of how I think about this culture?"</td><td>Before a Zoom call with Japanese partners, you plan how to adjust and later check whether your assumptions were right</td></tr>
<tr><td>✍ <b>Cognitive</b></td><td><b>Knowledge</b> about cultures, their similarities and differences (norms, values, laws, language)</td><td>"What do I know about this culture?"</td><td>Knowing that in Kazakhstan elders are greeted first, or Hofstede's dimensions</td></tr>
<tr><td>💯 <b>Motivational</b></td><td><b>Interest and confidence</b> in functioning effectively in intercultural contexts</td><td>"Do I want to and believe I can?"</td><td>An exchange student who eagerly joins local events despite language difficulty</td></tr>
<tr><td>🙏 <b>Behavioral</b></td><td>The capability to <b>flex behaviors</b> (verbal and non-verbal) in intercultural interactions</td><td>"Can I act appropriately?"</td><td>Changing tone, gestures, distance or greeting style (bowing, handshake)</td></tr></table>
<p class="tip">{C} Mnemonic <b>"My Cat Must Behave"</b> = <b>M</b>etacognitive, <b>C</b>ognitive, <b>M</b>otivational, <b>B</b>ehavioral. Or <b>"Think – Know – Want – Do"</b>: Metacognitive = <i>think about thinking</i>, Cognitive = <i>know</i>, Motivational = <i>want</i>, Behavioral = <i>do</i>.</p>
<h4>CQ vs IQ vs EQ {S}</h4>
<table class="tbl"><tr><th></th><th>IQ</th><th>EQ</th><th>CQ</th></tr>
<tr><td>Definition</td><td>Score from standardized tests measuring cognitive abilities relative to one's age group</td><td>Ability to manage your own emotions and understand the emotions of others</td><td>Capability to function effectively in intercultural contexts</td></tr>
<tr><td>Domain</td><td>General reasoning, logic</td><td>Emotions (often within one's own culture)</td><td>Cultural differences</td></tr>
<tr><td>Can it grow? {C}</td><td>Relatively stable</td><td>Can be developed</td><td>Can be developed through learning, experience, reflection</td></tr></table>
<p class="tip">{C} A person with high EQ may read emotions well at home but misread them abroad (smiles, silence, eye contact differ across cultures) – that gap is where CQ is needed.</p>
<h4>Outcomes and benefits {S}{X}</h4>
<p>The reading reports a growing body of research on the <b>positive consequences of CQ for individuals, teams and firms</b>; in less than twenty years CQ became a practical framework used by organizations in <b>over 150 countries</b> for global <b>selection, training and development</b>. {X} Typical outcomes in studies (Ang et al. 2007): better <b>cultural judgment and decision making</b>, <b>cultural adaptation</b> (less culture shock), and <b>task performance</b> in multicultural settings; also better leadership, negotiation and teamwork.</p>
<h4>How to develop CQ {X}{C}</h4>
<ul><li>Metacognitive: keep a reflection journal; question your assumptions.</li>
<li>Cognitive: learn history, values, Hofstede's dimensions, a foreign language.</li>
<li>Motivational: set goals, join international clubs, celebrate small successes.</li>
<li>Behavioral: practice greetings, adapt speech speed, observe and mirror local etiquette.</li></ul>
<h4>Examples {C}</h4>
<ul><li><b>University</b>: AITU group project with exchange students from India and Korea – agree on communication style and deadlines.</li>
<li><b>Professional</b>: an IT team in Astana working for a German client must adapt to direct feedback and strict punctuality.</li>
<li><b>International</b>: a volunteer at the World Nomad Games helps guests from 89 countries.</li></ul>`,
  must:["CQ = capability to function effectively in intercultural contexts","Earley & Ang 2003","Metacognitive / Cognitive / Motivational / Behavioral definitions","IQ vs EQ vs CQ","Individual, team, firm; 150+ countries"],
  confused:[["Metacognitive CQ","Cognitive CQ","META = capability to ACQUIRE and UNDERSTAND knowledge (thinking about thinking). COGNITIVE = the KNOWLEDGE itself."],["Motivational CQ","Behavioral CQ","MOTIVATIONAL = INTEREST & CONFIDENCE (want). BEHAVIORAL = FLEX actions (do)."],["EQ","CQ","EQ = emotions (yours and others'). CQ = effectiveness ACROSS cultures."]],
  traps:["CQ was introduced in 2003 by Earley AND Ang (not Hofstede).","Personality traits and multicultural experience are ANTECEDENTS of CQ, not part of it.","'Knowledge about cultures' = COGNITIVE, not metacognitive."]

 {id:"w7t4", title:"IT ethics, digital ethics and netiquette", src:"S",
  quick:[
   "==Digital ethics== – applied ethics on moral principles, values and norms of behavior in digital environments (internet, AI, algorithms, data) {L}",
   "==Netiquette== – the set of rules of behavior when communicating online {L}",
   "==Virginia Shea==, <i>Netiquette</i> – ==10 rules== {L}{S}",
   "Rule 1 ==Remember the human==; 2 same standards online as offline; 3 know where you are; 4 respect time & bandwidth; 5 look good online {L}",

   "Case: candidate's Instagram; ==Ilana Gershon== – people turn themselves into a 'hirable subject' {S}",
   "Kazakhstan ==Digital Code== adopted ==9 January 2026== – 9 principles incl. digital ethics {S}"
  ],
  deep:`<p class="note">ℹ️ <b>About the official video</b> ("Internet Etiquette: Netiquette Guidelines for the Online Classroom", SDSU Center for Online & Professional Education, 2015, 5:11): I could see the page details but <b>could not access its captions or transcript</b>, so I did not watch it. The guidelines below come from the lecture/seminar slides and general sources. If you paste the transcript, the notes can be extended with the video's exact points.</p>
<h4>IT ethics / digital ethics {L}{X}</h4>
<p><b>Digital ethics</b> is a field of applied ethics that examines the moral principles, values and norms governing human behavior in digital environments – the creation, use and impact of the internet, artificial intelligence, algorithms and data systems. {L} <b>IT ethics</b> covers the main issues: {X}</p>
<table class="tbl"><tr><th>Issue</th><th>Key idea</th><th>Example</th></tr>
<tr><td>Privacy & personal data</td><td>People control information about themselves; consent; data minimization</td><td>Not posting a classmate's photo without permission</td></tr>
<tr><td>Cybersecurity</td><td>Protecting systems and data from attacks; responsibility for passwords and updates</td><td>Phishing awareness, two-factor authentication</td></tr>
<tr><td>Intellectual property & copyright</td><td>Creators' rights to their works; licenses (e.g. Creative Commons)</td><td>Using pirated software is unethical and illegal</td></tr>
<tr><td>Plagiarism</td><td>Presenting someone else's work as your own</td><td>Copying code from GitHub without attribution</td></tr>
<tr><td>AI ethics</td><td>Fairness, transparency, accountability, human oversight, bias (UNESCO Recommendation on the Ethics of AI)</td><td>Submitting AI-generated essays as your own work; biased hiring algorithms</td></tr>
<tr><td>Digital responsibility</td><td>Thinking about the consequences of online actions; digital footprint</td><td>Checking facts before sharing news</td></tr>
<tr><td>Online communication ethics</td><td>Respect, honesty, no harassment</td><td>No insults in group chats</td></tr></table>
<h4>Netiquette – Virginia Shea's 10 rules {L}{S}</h4>
<p><b>Netiquette</b> = the set of rules and behavior while communicating online. ({X} Virginia Shea, <i>Netiquette</i>, 1994.)</p>
<ol><li><b>Remember the human</b> – there is a person behind the screen (the <b>First Rule</b>).</li>
<li>Adhere to the <b>same standards of behavior online</b> that you follow in real life.</li>
<li><b>Know where you are</b> in cyberspace (each forum has its own norms).</li>
<li><b>Respect other people's time and bandwidth.</b></li>
<li><b>Make yourself look good online</b> (spelling, clear content, polite tone).</li>
<li><b>Share expert knowledge.</b></li>
<li><b>Help keep flame wars under control.</b></li>
<li><b>Respect other people's privacy.</b></li>
<li><b>Don't abuse your power.</b></li>
<li><b>Be forgiving of other people's mistakes.</b></li></ol>
<p class="tip">{C} Mnemonic: "<b>R-S-K-R-L / S-F-P-P-F</b>" → "<b>R</b>eal <b>S</b>tudents <b>K</b>now <b>R</b>ules, <b>L</b>ook <b>S</b>mart, <b>F</b>ight <b>F</b>lames, <b>P</b>rotect <b>P</b>rivacy, <b>F</b>orgive." (Remember, Standards, Know where, Respect time, Look good, Share, Flame wars, Privacy, Power, Forgive.)</p>
<p><b>Golden Rule of Morality</b>: do to others what you want others to do to you. <b>Golden Rule of Netiquette</b>: <b>do not do or say online what you would not do or say offline</b>. {S}</p>
<h4>Netiquette in the online classroom {X}{C}</h4>
<ul><li>Use a professional tone and correct names/titles when emailing instructors; clear subject lines.</li>
<li>Avoid ALL CAPS (it reads as shouting), sarcasm and slang that can be misread.</li>
<li>Read the whole discussion before posting; stay on topic; respond respectfully to different opinions.</li>
<li>Mute your microphone when not speaking; be on time; keep camera backgrounds appropriate.</li>
<li>Cite sources; do not share classmates' work or private information.</li></ul>
<h4>Cyberbullying forms {S}</h4>
<table class="tbl"><tr><th>Form</th><th>Meaning</th></tr>
<tr><td>Electronic harassment</td><td>Repeatedly sending abusive, insulting or threatening messages</td></tr>
<tr><td>Defamation</td><td>Sending false information or spreading rumors to harm a person</td></tr>
<tr><td>Impersonation</td><td>Hacking someone's account and pretending to be them to trap or discredit them</td></tr>
<tr><td>Deception</td><td>Tricking someone into revealing secrets/embarrassing pictures and then posting them</td></tr>
<tr><td>Exclusion</td><td>Deliberately and cruelly excluding someone from an online group</td></tr>
<tr><td>Cyberstalking</td><td>Repeatedly monitoring someone's actions online, spying, threatening their security</td></tr>
<tr><td>Trolling</td><td>Posting offensive, mocking or provoking comments to upset others</td></tr></table>
<h4>Case: the candidate's Instagram {S}</h4>
<p>An employer rejects an intern candidate after seeing party photos, sarcastic memes and political opinions. Discussion: is it fair? Anthropologist <b>Ilana Gershon</b> studies how people manage <b>digital self-presentation</b> and adapt online identities to employment – carefully checking Facebook/LinkedIn and trying to <b>turn themselves into a "hirable subject"</b> (also for university admission and online dating).</p>
<h4>Kazakhstan's Digital Code {S}</h4>
<p>Adopted on <b>9 January 2026</b>, it establishes the legal framework for the digital environment. Aim: "to ensure the sustainable development and functioning of the digital environment in the interests of individuals and legal entities, society and the state". Nine principles: (1) respect for human rights, freedoms and legitimate interests; (2) security of individuals, society and the state; (3) freedom of digital data circulation; (4) freedom to create, develop and use digital technologies; (5) balance between private and public interests; (6) accessibility and inclusiveness; (7) proportionate and justified state participation; (8) technological neutrality of legal regulation; (9) <b>digital ethics and social responsibility</b>.</p>
<p>Seminar discussion terms also included <b>digital identity</b> and <b>cancel culture</b> (see Week 9).</p>`,

  confused:[["Defamation","Impersonation","Defamation = spreading FALSE info/rumors. Impersonation = PRETENDING to be the person (hacked account)."],["Deception","Impersonation","Deception = TRICKING someone into revealing secrets, then posting. Impersonation = posing AS them."],["Cyberstalking","Electronic harassment","Stalking = MONITORING/spying repeatedly. Harassment = sending abusive MESSAGES repeatedly."],["Golden Rule of Morality","Golden Rule of Netiquette","Morality: do to others what you want done to you. Netiquette: don't do/say online what you wouldn't offline."]],

 {id:"w7t5", title:"IT museums in the world and Kazakhstan; digital museums", src:"S",
  quick:[
   "==Virtual museum== (==Schweibenz==): logically related collection of digital objects… ==no real place or space== {S}",
   "==Computer History Museum== (Mountain View, California): exhibition ==<i>Revolution: The First 2000 Years of Computing</i>== (2011), 20 galleries from abacus to the Web {S}{X}",
   "==Heinz Nixdorf MuseumsForum== (Paderborn, Germany): calls itself the ==world's biggest computer museum==; ==5,000 years== of IT – cuneiform to WWW; opened ==1996== {S}{X}",
   "==UNESCO Virtual Museum of Stolen Cultural Objects==: launched ==Sept 2025== (MONDIACULT, Barcelona); designed by ==Francis Kéré== as a ==baobab tree==; ~250 objects from 46 countries; wants its collection to ==shrink== {S}{X}",
   "==e-Museum (e-museum.kz)==: national platform uniting ==all Kazakhstan's museums==; virtual tours; ==700+ 3D exhibits== {L}{S}",
   "Also: ==Google Arts & Culture==, ==DataArt IT Museum== {S}"
  ],
  deep:`<p><b>Virtual museum</b> – classical definition by <b>W. Schweibenz</b> (1998): "a logically related collection of digital objects composed in a variety of media… it has <b>no real place or space</b>; its objects and the related information can be disseminated all over the world." Also: an <b>umbrella term</b> for digital representations of collections, from virtual tours to fully online museums. {S}</p>
<h4>The four official museums</h4>
<table class="tbl"><tr><th>Museum</th><th>Where / when</th><th>What it shows</th><th>Purpose</th></tr>
<tr><td><b>Computer History Museum (CHM)</b></td><td>Mountain View, California (Silicon Valley) {X}; roots in the Digital Computer Museum (1979, Gordon & Gwen Bell, Ken Olsen) {X}</td><td>Permanent exhibition <b><i>Revolution: The First 2000 Years of Computing</i></b> (opened January 2011 {X}) with <b>20 topics/galleries</b>: Calculators, Punched Cards, Analog Computers, Birth of the Computer, Early Computer Companies, Real-Time Computing, Mainframes, Memory & Storage, The Art of Programming, Supercomputers, Minicomputers, Digital Logic, <b>AI & Robotics</b>, Input & Output, <b>Computer Graphics, Music and Art</b>, Computer Games, Personal Computers, Mobile Computing, <b>Networking</b>, The Web {X}</td><td>Preserve and present the history of the information age and its impact on society</td></tr>
<tr><td><b>Heinz Nixdorf MuseumsForum (HNF)</b></td><td>Paderborn, Germany; in the former headquarters of Nixdorf Computer AG; opened 24 Oct 1996 {X}</td><td>"<b>The world's biggest computer museum</b>": about <b>5,000 years</b> of information technology <b>from cuneiform script to the World Wide Web</b>; 11 areas (numbers & signals; mechanization; invention of the computer; office work; computers 1950–2000; everything goes digital; Nixdorf as pioneer) – typewriters, punched-card systems, C64, first mobile phones, robots {X}</td><td>Museum + forum: education in information and communication technology for a wide audience</td></tr>
<tr><td><b>UNESCO Virtual Museum of Stolen Cultural Objects</b></td><td>Online; launched 29 September 2025 at MONDIACULT, Barcelona {X}</td><td>About 240–250 stolen/missing cultural objects from 46 countries in 2D/3D, with stories and community testimonies; rooms incl. a gallery and an auditorium; designed by Pritzker-winning architect <b>Francis Kéré</b> (Burkina Faso) in the form of a <b>baobab tree</b> (resilience) {X}</td><td>Fight <b>illicit trafficking</b> of cultural property (mission of the <b>1970 UNESCO Convention</b>); supported by Saudi Arabia and <b>INTERPOL</b>; unusual goal – its collection should <b>shrink</b> as objects are returned {X}</td></tr>
<tr><td><b>e-Museum Kazakhstan</b> (e-museum.kz)</td><td>National online platform; linked to the National Museum of the RK {X}</td><td>"National digital platform that unites <b>all the country's museums</b> and information about their collections in a single information space"; virtual tours; <b>over 700 3D exhibits</b>; information on culture, history and objects from <b>all regions</b> {L}. Sections: Museums of Kazakhstan (by 20 regions/cities, GIS map), 3D models (e.g. a dombyra, a clay yurt-shaped candleholder), State Catalog, museum items, virtual tours, legislation; Kazakh/Russian/English {X}</td><td>Make Kazakh heritage accessible everywhere; digital preservation; national identity</td></tr></table>
<p class="tip">{C} Memory hooks: <b>CHM = California, Chronology of Computing (2000 years)</b>. <b>HNF = Huge (biggest), Nixdorf, Five thousand years</b>. <b>UNESCO = Undo theft</b> (stolen objects, wants to shrink). <b>e-Museum = every museum of Kazakhstan, 700 3D</b>.</p>
<h4>Seminar "two truths and a myth" (CHM facts) {S}</h4>
<ul><li>Robots: IBM's first chess computer <b>Deep Thought LOST</b> to Kasparov in 1989 (the myth said it won). Karel Čapek introduced "robot" in his <b>1921</b> play <i>R.U.R.</i> (Czech <i>robota</i>); Asimov created the <b>Three Laws of Robotics</b>.</li>
<li>Graphics: AutoCAD (Autodesk, <b>1982</b>); the Utah <b>teapot</b>; graphics have been part of computing since the <b>1940s</b> (seminar answer; the myth version said 1950s).</li>
<li>Networking: transatlantic cable by <b>1866</b>; Morse code represents information digitally; in the late 1960s <b>ARPA's ARPANET</b> (packet switching) was the first large-scale general-purpose network experiment (the myth credited Britain's NPL network).</li></ul>
<h4>Digital vs physical museums {C}{X}</h4>
<table class="tbl"><tr><th>Advantages of digital museums</th><th>Disadvantages</th></tr>
<tr><td>Access 24/7 from anywhere; free or cheap; inclusive for people with disabilities</td><td>No "aura" of the authentic object (Walter Benjamin {X}); less emotional impact</td></tr>
<tr><td>Preservation of fragile objects (3D scans), backup if originals are lost</td><td>Digital preservation risks: file formats, servers, funding</td></tr>
<tr><td>Interactive, multimedia, multilingual, good for education</td><td>Digital divide – unequal internet access</td></tr>
<tr><td>Can show stolen/destroyed heritage (UNESCO) or reunite scattered collections</td><td>Preserves <i>information about</i> heritage rather than the heritage itself (seminar debate)</td></tr></table>
<p>Seminar question: <i>Can digital technology preserve cultural heritage, or only information about it?</i> {S} {C} Strong answer: it preserves information, access and memory; physical conservation is still needed; digital tools complement museums.</p>`,
  must:["Schweibenz definition – no real place or space","CHM – Mountain View – Revolution: First 2000 Years of Computing","HNF – Paderborn – world's biggest – 5,000 years, cuneiform to WWW","UNESCO Virtual Museum – stolen objects – Kéré baobab – 2025 – 1970 Convention","e-Museum – all museums of Kazakhstan – 700+ 3D"],
  confused:[["CHM","HNF","CHM = USA, '2000 years' exhibition. HNF = GERMANY, '5,000 years', world's BIGGEST."],["UNESCO Virtual Museum","e-Museum","UNESCO = STOLEN objects worldwide. e-Museum = ALL KAZAKH museums, 3D exhibits."],["Deep Thought","Deep Blue","Deep Thought LOST to Kasparov in 1989 (seminar). (Deep Blue later won in 1997.) {X}"]],
  traps:["HNF, not CHM, claims to be the world's BIGGEST computer museum.","The CHM exhibition covers 2,000 years; HNF covers 5,000 years.","The first large-scale network experiment in the seminar answer is ARPANET (USA), not NPL (Britain)."]
 }
 ]
}

  quick:[

  ],
  deep:`<p>The medieval German saying <b>"Stadtluft macht frei"</b> – "city air brings freedom" – shows the city as a space of liberty. {L}</p>
<h4>Georg Simmel – "The Metropolis and Mental Life" (1903) {L}</h4>
<p>Based on observation of <b>Berlin</b>: city life consists of <b>fleeting anonymous contacts</b> (public transport, shopping); people are <b>removed from emotional and social ties</b>; there is a <b>predominance of the visual sense</b>. The city gives <b>freedom and opportunities</b> but also <b>psychological pressure and disconnectedness</b>. {X} Simmel also described the "blasé attitude" of city dwellers.</p>
<h4>The informational city {L}</h4>
<p>Surveillance and data: increased <b>CCTV</b> cameras; security systems around houses; police helicopters with infra-red cameras; electronic shopping cards recording spending; <b>wearable computing</b>; increasing numbers of <b>UAVs (drones)</b>.</p>
<h4>Smart city {L}</h4>
<p>"Smart city" is a concept for developing an urban environment by introducing high-tech solutions and innovative systems for efficient management of infrastructure and resources, effective delivery of services and continuous improvement of quality of life (Kazakhstan, <i>Methodology for the Development of "Smart Cities" and "Smart Regions"</i>, 12.07.2026). Cultural projects: <b>digitization of library and museum collections</b> and a unified portal; <b>3D/VR tours</b> of key tourist attractions; the <b>Smart City Research and Innovation Center</b> at AITU.</p>
<p><b>8-80 Cities</b> initiative: "if everything we do in our cities is great for an 8-year-old and an 80-year-old, then it will be better for all people." {L}</p>
<p><b>Public place</b> – sites freely accessible to people (streets, stations, squares); places of <b>commemoration</b> and <b>visual culture</b> (e.g. the Kazakh Eli monument). {L}</p>`,
  must:["Simmel 1903 'The Metropolis and Mental Life' – Berlin – anonymity, visual sense","Informational city features","Smart city definition","8-80 cities","Public place"],
  confused:[["Informational city","Smart city","Informational city = SURVEILLANCE and data collection (CCTV, drones). Smart city = high-tech MANAGEMENT for quality of life."]],
  traps:["Simmel observed BERLIN, and his essay is from 1903."]
 },
 {id:"w8t2", title:"Urban culture of modern Astana: architecture and symbols", src:"L",
  quick:[

  ],
  deep:`<h4>The new capital {L}{X}</h4>
<p>The capital was moved from <b>Almaty to Akmola</b> in <b>1997–98</b> ({X} official transfer 10 December 1997; renamed Astana in 1998; international presentation 10 June 1998; called Nur-Sultan 2019–2022, then Astana again). {X} The master plan was designed by Japanese architect <b>Kisho Kurokawa</b> (a founder of Metabolism) who imagined the city as a living organism – a "Eurasian" style mixing East and West.</p>
<h4>The semiotics of Astana's architecture {L}</h4>
<table class="tbl"><tr><th>Landmark</th><th>Facts</th><th>Meaning / cultural code</th></tr>
<tr><td><b>Baiterek</b></td><td>Architect <b>Akmyrza Rustembekov</b> (per lecture); {X} completed 2002; total height 105 m, observation deck at <b>97 m</b> (year 1997, capital moved)</td><td>Turkic myth and cosmology + modern architecture; <b>the golden egg on the Tree of Life</b> – rebirth and continuity in Kazakh culture (the mythical bird Samruk lays its egg in the tree {X}); the symbol of the capital</td></tr>
<tr><td><b>Khan Shatyr</b></td><td>British architect <b>Norman Foster</b>; {X} opened July 2010; 150 m with spire</td><td>"Khan's tent" – the historical idea of a place where khans lived; <b>the tallest tent in the world</b>; a nomadic tent in modern materials – ancestral heritage with cutting-edge technology</td></tr>
<tr><td><b>Palace of Peace and Reconciliation</b> ("Pyramid of Peace")</td><td><b>Norman Foster</b>; {X} opened 2006; venue of the Congress of Leaders of World and Traditional Religions</td><td>Spaces for Judaism, Islam, Christianity, Buddhism, Hinduism, Taoism and others → Kazakhstan's dedication to <b>interfaith harmony and multi-ethnic tolerance</b></td></tr>
<tr><td><b>Mängilik El Triumphal Arch</b></td><td>Opened <b>16 December 2011</b> (20 years of independence {C})</td><td>Ideas of <b>Mängilik El</b> ("Eternal Country") and <b>Uly Dala Eli</b> ("Great Steppe Country")</td></tr>
<tr><td>{X} Hazret Sultan Mosque (2012), Astana Opera (2013), EXPO-2017 "Future Energy" Nur Alem sphere</td><td>—</td><td>Islam as tradition; elite culture; "green" future, global image</td></tr></table>
<p>Seminar-style questions from the lecture: <i>What do you see? What symbols or cultural references? What ideas or values are represented? How does it contribute to the image of Astana?</i> {L}</p>
<h4>How architecture reflects identity {C}</h4>
<ul><li><b>Nomadic codes in modern form</b>: tent (Khan Shatyr), yurt-like domes, shanyrak motifs, ornaments on facades.</li>
<li><b>Mythology</b>: Baiterek = tree of life + Samruk's golden egg.</li>
<li><b>State ideology</b>: Mängilik El arch; Kazakh Eli monument; Independence Square.</li>
<li><b>Multiculturalism and tolerance</b>: Palace of Peace and Reconciliation.</li>
<li><b>Globalization</b>: star architects (Foster, Kurokawa), EXPO, skyscrapers – the city as a "brand" for a global audience.</li>
<li><b>Digital representation</b>: Astana is shown through Instagram images, 3D/VR tours, drone videos, the Center of Urbanism's projects (urbanastana.kz).</li>
<li><b>Critique</b> {X}: "showcase" city, Baudrillard-style simulacra; high cost; car-oriented design vs 8-80 human-scale ideas.</li></ul>`,

   "Digital representation: e-museum 3D objects, social media (TikTok, Instagram), memes, Kazakh corpus, national branding (Visit Kazakhstan), games {C}"
  ],
  deep:`<p>A <b>cultural code</b> is a set of symbols and images that pass information within a group. <b>Values</b> are ideas about what in life seems important. {L} (Week 2: a cultural code is "the key to understanding culture; a set of images associated with stereotypes/mentality".)</p>
<p>Value directions in today's Kazakhstan (Gabitov, <i>Culture Challenges</i>): {L}</p>
<ul><li><b>Ecology culture</b> – e.g. the <b>Taza Kazakhstan</b> ("Clean Kazakhstan") movement.</li>
<li><b>Preserving cultural identity</b>.</li>
<li><b>Digital transformation</b>.</li></ul>
<h4>Main Kazakh cultural codes {X}{C}</h4>
<table class="tbl"><tr><th>Code</th><th>Meaning</th><th>Digital representation</th></tr>
<tr><td>Shanyrak / yurt</td><td>Family, unity, continuity, home</td><td>State emblem, logos, 3D yurt models on e-Museum</td></tr>
<tr><td>Hospitality (qonaqzhailylyq), dastarkhan</td><td>Openness, generosity</td><td>Food bloggers, tourism campaigns</td></tr>
<tr><td>Respect for elders, zheti ata (knowing 7 generations of ancestors)</td><td>Family memory, kinship</td><td>Genealogy (shezhire) apps and websites</td></tr>
<tr><td>Horse, steppe, nomadic freedom</td><td>Freedom, endurance</td><td>World Nomad Games broadcasts, films</td></tr>
<tr><td>Dombra & küy, aitys</td><td>Oral and musical heritage</td><td>Dombra Day (first Sunday of July {X}), YouTube aitys, online küy archives</td></tr>
<tr><td>Ornament (koshkar muyiz etc.)</td><td>Prosperity, protection</td><td>Fashion, app design, emoji/sticker packs</td></tr>
<tr><td>Kazakh language</td><td>Identity</td><td>Latin-script transition, Kazakh National Corpus, Kazakh-language content and AI models</td></tr></table>
<h4>How Kazakhstan presents itself to a global audience {C}{X}</h4>
<ul><li>National brand: "Great Steppe", nomadic heritage, tolerance and multi-ethnic harmony, modern Astana, EXPO-2017.</li>
<li>Sport and events: <b>World Nomad Games 2024 in Astana</b> (89 countries); Astana Opera tours.</li>
<li>Social media: TikTok memes, Instagram tourism, Kazakh musicians on YouTube (e.g. Dimash Qudaibergen; Q-pop band Ninety One).</li>
<li>Digital heritage: e-Museum, e-history.kz, UNESCO nominations.</li></ul>
<h4>Challenges of cultural representation {C}</h4>
<ul><li><b>Stereotyping and exoticization</b> – reducing culture to yurts, horses and eagles for tourists.</li>
<li><b>Commercialization</b> – traditions as products; "folklorism".</li>

<li><b>Misrepresentation by outsiders</b> (e.g. the film <i>Borat</i> {X}) vs self-representation by Kazakhs.</li>
<li><b>Regional and generational diversity</b> can be lost in a single "national" image.</li></ul>`,
